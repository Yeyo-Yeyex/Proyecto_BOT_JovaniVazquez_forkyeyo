<!doctype html>
<!--
Escena del Bacará (Punto y Banca), dibujada con canvas. La pinta Node con Skia
(assets/escena_node.cjs) y, si no hay Node, un Chromium sin ventana (ver
bot/services/bacara_scene.py).

No decide nada: Python le pasa, fotograma a fotograma, dónde está cada carta,
los totales, el cartel, las chispas y la carretera grande
(bot/services/bacara_render.py, `board_state` y `coup_states`). Aquí solo se
pinta. Funciones que llama Python:

- loadFonts()                espera a las fuentes (canvas no las carga solo).
- setup(meta)                {rows, cols} de la carretera grande.
- renderFrames(states, first) dibuja los fotogramas y devuelve, de cada uno, el
                             recuadro que ha cambiado (PNG en Chromium, píxeles
                             crudos en Node) y dónde va.
                             Si un estado trae "full": true devuelve el fotograma
                             entero (sirve para empezar un tramo nuevo que no sigue
                             al fotograma anterior).

Un estado es:
  cards[]    en orden de dibujo (la última encima): card {rank, suit, label, red},
             side, x, y (centro), rot, scale, flip (0 dorso, 1 cara), peel (null o
             0-1: el apretón), lift, glow, dim.
  player, banker   {value | null, pop, win}: la ficha con el total de cada mano.
  win, winGlow     "jugador" | "banca" | "empate" | null y cuánto brilla su zona.
  banner     {kind, title, sub, a} | null     header  {shoe, hand, left}
  road       {cells[[col, fila, lado, empates, natural, índice]], fresh, newest, stats}
  sparks     [[x, y, radio, alfa, clase]]     ms      (lo ignora la escena)

Se dibuja al doble de tamaño (S = 2) y se reduce al copiarlo. El recuadro que
cambia se calcula comparando con el fotograma anterior, así que montar los
recuadros da exactamente lo mismo que pintar cada fotograma entero. Sin emojis:
el Chromium del Docker no trae su fuente; los palos son trazados de canvas.

El apretón (`peel`): la carta se ve boca abajo y, por su lado largo derecho, se
despega una franja que enseña la cara SIN los índices de las esquinas, con una
curva de papel en el pliegue. Se adivinan los palos, no el número.
-->
<html lang="es">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: "Luckiest"; src: url("../botes/fonts/luckiest-guy.woff"); }
  @font-face { font-family: "Montserrat"; src: url("../memes/fonts/MontserratBold.ttf"); font-weight: 700; }
  html, body { margin: 0; padding: 0; background: transparent; }
</style>
</head>
<body>
<script>
"use strict";
const S = 2;
// Estas medidas salen de bot/services/bacara_render.py: si cambian allí, cambian aquí.
const W = 640, H = 420;
const CARD_W = 80, CARD_H = 112;
const SHOE_X = 320, SHOE_Y = 44;
const PLAYER_SLOTS = [[125, 122], [215, 122], [170, 226]];
const BANKER_SLOTS = [[425, 122], [515, 122], [470, 226]];
const PLAYER_BADGE = [42, 122], BANKER_BADGE = [598, 122];
const ROAD_X = 14, ROAD_Y = 284, ROAD_CELL = 20, ROAD_ROWS = 6, ROAD_COLS = 22;
const PANEL_X = 466;
// Solo de la escena.
const ZONE_Y = 40, ZONE_H = 232, ZONE_W = 280;
const TIE_Y = 250;

const BLUE = "#3478e6", RED = "#d6343c", GREEN = "#28b060", GOLD = "#ffd65c";
const SIDE_COLOR = { J: BLUE, B: RED, E: GREEN };

const big = document.createElement("canvas"); big.width = W * S; big.height = H * S;
const out = document.createElement("canvas"); out.width = W; out.height = H;
const crop = document.createElement("canvas");
const bctx = big.getContext("2d");
const octx = out.getContext("2d", { willReadFrequently: true });
const cctx = crop.getContext("2d");

let META = { rows: ROAD_ROWS, cols: ROAD_COLS };
let BG = null;
let PREV = null;           // píxeles del fotograma anterior (Uint32Array)
const SPRITES = new Map(); // cartas ya dibujadas (una vez por página)

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function rng(seed) {
  return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
function roundRect(g, x, y, w, h, r) {
  g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
}
function spaced(g, px) { if ("letterSpacing" in g) g.letterSpacing = px + "px"; }
function rgba(hex, a) {
  const n = parseInt(hex.slice(1), 16);
  return `rgba(${n >> 16 & 255},${n >> 8 & 255},${n & 255},${a})`;
}

// -- Palos: trazados de canvas, centrados en (0, 0) y de lado 1 -------------------------------

function suitPath(g, suit) {
  g.beginPath();
  if (suit === 2) {                                    // diamantes
    g.moveTo(0, -0.5); g.quadraticCurveTo(0.12, -0.2, 0.37, 0); g.quadraticCurveTo(0.12, 0.2, 0, 0.5);
    g.quadraticCurveTo(-0.12, 0.2, -0.37, 0); g.quadraticCurveTo(-0.12, -0.2, 0, -0.5);
  } else if (suit === 1) {                             // corazones
    g.moveTo(0, 0.5);
    g.bezierCurveTo(-0.15, 0.35, -0.5, 0.12, -0.5, -0.15);
    g.bezierCurveTo(-0.5, -0.38, -0.32, -0.5, -0.17, -0.5);
    g.bezierCurveTo(-0.07, -0.5, 0, -0.43, 0, -0.32);
    g.bezierCurveTo(0, -0.43, 0.07, -0.5, 0.17, -0.5);
    g.bezierCurveTo(0.32, -0.5, 0.5, -0.38, 0.5, -0.15);
    g.bezierCurveTo(0.5, 0.12, 0.15, 0.35, 0, 0.5);
  } else if (suit === 0) {                             // picas: corazón del revés con tallo
    g.moveTo(0, -0.5);
    g.bezierCurveTo(0.12, -0.3, 0.5, -0.08, 0.5, 0.14);
    g.bezierCurveTo(0.5, 0.34, 0.34, 0.42, 0.2, 0.42);
    g.bezierCurveTo(0.1, 0.42, 0.03, 0.37, 0.03, 0.28);
    g.bezierCurveTo(0.03, 0.38, 0.1, 0.47, 0.24, 0.5);
    g.lineTo(-0.24, 0.5);
    g.bezierCurveTo(-0.1, 0.47, -0.03, 0.38, -0.03, 0.28);
    g.bezierCurveTo(-0.03, 0.37, -0.1, 0.42, -0.2, 0.42);
    g.bezierCurveTo(-0.34, 0.42, -0.5, 0.34, -0.5, 0.14);
    g.bezierCurveTo(-0.5, -0.08, -0.12, -0.3, 0, -0.5);
  } else {                                             // tréboles: tres bolas y tallo
    for (const [bx, by] of [[0, -0.27], [-0.27, 0.1], [0.27, 0.1]]) { g.moveTo(bx + 0.23, by); g.arc(bx, by, 0.23, 0, Math.PI * 2); }
    g.moveTo(-0.04, 0.05); g.bezierCurveTo(-0.02, 0.3, -0.1, 0.42, -0.2, 0.5);
    g.lineTo(0.2, 0.5); g.bezierCurveTo(0.1, 0.42, 0.02, 0.3, 0.04, 0.05); g.closePath();
    g.moveTo(-0.15, -0.05); g.lineTo(0.15, -0.05); g.lineTo(0, 0.12); g.closePath();
  }
}
function drawSuit(g, suit, x, y, size, color, flipped = false) {
  g.save(); g.translate(x, y); if (flipped) g.rotate(Math.PI); g.scale(size, size);
  g.fillStyle = color; suitPath(g, suit); g.fill(); g.restore();
}

// -- Cartas (una vez cada una, a tamaño de dibujo) -------------------------------------------

// Pips de 2 a 10 en la disposición clásica de la baraja francesa: [columna, fila].
// Columnas: 0 izquierda, 1 centro, 2 derecha. Las filas son alturas en px de la carta.
const PIP_X = [27, 40, 53];
const R1 = 24, R4 = 88, R2 = R1 + (R4 - R1) / 3, R3 = R1 + 2 * (R4 - R1) / 3, MID = (R1 + R4) / 2;
const PIPS = {
  2: [[1, R1], [1, R4]],
  3: [[1, R1], [1, MID], [1, R4]],
  4: [[0, R1], [2, R1], [0, R4], [2, R4]],
  5: [[0, R1], [2, R1], [1, MID], [0, R4], [2, R4]],
  6: [[0, R1], [2, R1], [0, MID], [2, MID], [0, R4], [2, R4]],
  7: [[0, R1], [2, R1], [1, (R1 + MID) / 2], [0, MID], [2, MID], [0, R4], [2, R4]],
  8: [[0, R1], [2, R1], [1, (R1 + MID) / 2], [0, MID], [2, MID], [1, (MID + R4) / 2], [0, R4], [2, R4]],
  9: [[0, R1], [2, R1], [0, R2], [2, R2], [1, MID], [0, R3], [2, R3], [0, R4], [2, R4]],
  10: [[0, R1], [2, R1], [1, (R1 + R2) / 2], [0, R2], [2, R2], [0, R3], [2, R3], [1, (R3 + R4) / 2], [0, R4], [2, R4]],
};

function crown(g, kind) {   // corona o gorro centrado en (0, 0), de unos 26 de ancho
  g.save();
  const grad = g.createLinearGradient(0, -14, 0, 2); grad.addColorStop(0, "#ffe27a"); grad.addColorStop(1, "#c8901c");
  g.lineJoin = "round"; g.lineWidth = 1; g.strokeStyle = "#7a5206";
  if (kind === "J") {                                   // gorro con pluma
    g.beginPath(); g.moveTo(-11, 1); g.quadraticCurveTo(-12, -11, 0, -11); g.quadraticCurveTo(12, -11, 11, 1); g.closePath();
    g.fillStyle = grad; g.fill(); g.stroke();
    g.beginPath(); g.moveTo(-13, 1.5); g.lineTo(13, 1.5); g.lineWidth = 2.4; g.strokeStyle = "#7a5206"; g.stroke();
    g.beginPath(); g.moveTo(6, -9); g.quadraticCurveTo(16, -17, 15, -4); g.quadraticCurveTo(11, -9, 6, -6); g.closePath();
    g.fillStyle = "#e8e2d0"; g.lineWidth = 0.9; g.strokeStyle = "#7a5206"; g.fill(); g.stroke();
  } else {
    g.beginPath(); g.moveTo(-11, 1); g.lineTo(-12.5, -10); g.lineTo(-6, -4.5); g.lineTo(0, -13);
    g.lineTo(6, -4.5); g.lineTo(12.5, -10); g.lineTo(11, 1); g.closePath();
    g.fillStyle = grad; g.fill(); g.stroke();
    g.fillStyle = kind === "K" ? "#c8232f" : "#2a5aa8";
    for (const jx of [-6, 0, 6]) { g.beginPath(); g.arc(jx, -2.4, 1.5, 0, Math.PI * 2); g.fill(); }
    g.fillStyle = "#fff6c4";
    for (const [tx, ty] of [[-12.5, -10], [0, -13], [12.5, -10]]) { g.beginPath(); g.arc(tx, ty, 1.5, 0, Math.PI * 2); g.fill(); g.stroke(); }
    if (kind === "K") { g.fillStyle = "#c8901c"; g.fillRect(-0.7, -19, 1.4, 5); g.fillRect(-2.2, -17.5, 4.4, 1.4); }
  }
  g.restore();
}

function faceSprite(card, plain = false) {
  const key = (card.rank * 4 + card.suit) + (plain ? 100 : 0);
  if (SPRITES.has(key)) return SPRITES.get(key);
  const c = document.createElement("canvas"); c.width = CARD_W * S; c.height = CARD_H * S;
  const g = c.getContext("2d"); g.scale(S, S);
  const color = card.red ? "#c8232f" : "#1a1c22";
  roundRect(g, 0.5, 0.5, CARD_W - 1, CARD_H - 1, 7);
  const grad = g.createLinearGradient(0, 0, CARD_W, CARD_H);
  grad.addColorStop(0, "#ffffff"); grad.addColorStop(1, "#ece8dd");
  g.fillStyle = grad; g.fill(); g.strokeStyle = "#9d998b"; g.lineWidth = 1; g.stroke();
  roundRect(g, 2, 2, CARD_W - 4, CARD_H - 4, 5.5);
  g.strokeStyle = "rgba(255,255,255,0.9)"; g.lineWidth = 0.8; g.stroke();
  if (!plain) {
    // Índices en las esquinas (la de abajo, del revés).
    const corner = () => {
      g.fillStyle = color; g.font = `${card.label.length > 1 ? 13.5 : 17}px Luckiest`;
      g.textAlign = "center"; g.textBaseline = "alphabetic"; g.fillText(card.label, 11, 19.5);
      drawSuit(g, card.suit, 11, 29.5, 10.5, color);
    };
    corner();
    g.save(); g.translate(CARD_W, CARD_H); g.rotate(Math.PI); corner(); g.restore();
  }
  const r = card.rank;
  if (r === 1) {                                         // as: un palo grande con un aro fino
    g.save(); g.shadowColor = "rgba(0,0,0,0.25)"; g.shadowBlur = 4 * S; g.shadowOffsetY = 1.2 * S;
    drawSuit(g, card.suit, CARD_W / 2, CARD_H / 2 + 1, card.suit === 0 ? 50 : 42, color); g.restore();
    g.beginPath(); g.arc(CARD_W / 2, CARD_H / 2, 29, 0, Math.PI * 2);
    g.strokeStyle = card.red ? "rgba(200,35,47,0.22)" : "rgba(26,28,34,0.2)"; g.lineWidth = 0.9; g.stroke();
  } else if (r >= 11) {                                  // figuras: marco dorado, letra y corona
    const fx = 17, fy = 14, fw = CARD_W - 34, fh = CARD_H - 28;
    roundRect(g, fx, fy, fw, fh, 4);
    const bg = g.createLinearGradient(fx, fy, fx + fw, fy + fh);
    bg.addColorStop(0, "#fdf6dc"); bg.addColorStop(0.5, "#f3e4b0"); bg.addColorStop(1, "#fdf6dc");
    g.fillStyle = bg; g.fill();
    g.strokeStyle = card.red ? "#c8232f" : "#232733"; g.lineWidth = 1.4; g.stroke();
    roundRect(g, fx + 2.2, fy + 2.2, fw - 4.4, fh - 4.4, 2.5);
    g.strokeStyle = "#c8901c"; g.lineWidth = 1; g.stroke();
    // Línea diagonal de la baraja (media figura arriba, media abajo).
    g.save(); roundRect(g, fx + 2.2, fy + 2.2, fw - 4.4, fh - 4.4, 2.5); g.clip();
    g.strokeStyle = "rgba(200,144,28,0.45)"; g.lineWidth = 0.8;
    g.beginPath(); g.moveTo(fx, fy + fh); g.lineTo(fx + fw, fy); g.stroke();
    g.restore();
    const kind = card.label;
    for (const flipped of [false, true]) {
      g.save(); g.translate(CARD_W / 2, CARD_H / 2); if (flipped) g.rotate(Math.PI);
      g.translate(0, -29); crown(g, kind); g.restore();
      g.save(); g.translate(CARD_W / 2, CARD_H / 2); if (flipped) g.rotate(Math.PI);
      drawSuit(g, card.suit, 0, -16.5, 11, color); g.restore();
    }
    g.save(); g.font = "30px Luckiest"; g.textAlign = "center"; g.textBaseline = "middle";
    g.lineJoin = "round"; g.lineWidth = 3.4; g.strokeStyle = "rgba(255,255,255,0.9)";
    g.strokeText(kind, CARD_W / 2, CARD_H / 2 + 2); g.fillStyle = color; g.fillText(kind, CARD_W / 2, CARD_H / 2 + 2);
    g.restore();
  } else {                                               // 2 a 10: pips en columnas y filas
    for (const [col, y] of PIPS[r]) drawSuit(g, card.suit, PIP_X[col], y, 15, color, y > MID + 0.5);
  }
  SPRITES.set(key, c);
  return c;
}

function backSprite() {
  if (SPRITES.has("back")) return SPRITES.get("back");
  const c = document.createElement("canvas"); c.width = CARD_W * S; c.height = CARD_H * S;
  const g = c.getContext("2d"); g.scale(S, S);
  roundRect(g, 0.5, 0.5, CARD_W - 1, CARD_H - 1, 7); g.fillStyle = "#f4f1e8"; g.fill();
  g.strokeStyle = "#9d998b"; g.lineWidth = 1; g.stroke();
  const x = 4.5, y = 4.5, w = CARD_W - 9, h = CARD_H - 9;
  roundRect(g, x, y, w, h, 4.5);
  const grad = g.createLinearGradient(0, 0, CARD_W, CARD_H);
  grad.addColorStop(0, "#1f3f86"); grad.addColorStop(0.55, "#12285c"); grad.addColorStop(1, "#091535");
  g.fillStyle = grad; g.fill();
  g.save(); roundRect(g, x, y, w, h, 4.5); g.clip();
  g.strokeStyle = "rgba(240,190,80,0.34)"; g.lineWidth = 0.8;     // rejilla de rombos dorada
  for (let k = -CARD_H; k < CARD_W + CARD_H; k += 9) {
    g.beginPath(); g.moveTo(k, 0); g.lineTo(k + CARD_H, CARD_H); g.stroke();
    g.beginPath(); g.moveTo(k + CARD_H, 0); g.lineTo(k, CARD_H); g.stroke();
  }
  g.restore();
  roundRect(g, x + 3.5, y + 3.5, w - 7, h - 7, 3);
  g.strokeStyle = "rgba(255,214,110,0.85)"; g.lineWidth = 1.1; g.stroke();
  // Sello central: medallón dorado con corona y «PS».
  g.save(); g.translate(CARD_W / 2, CARD_H / 2);
  const rg = g.createRadialGradient(0, -4, 2, 0, 0, 23);
  rg.addColorStop(0, "#27498f"); rg.addColorStop(1, "#0b1a42");
  g.fillStyle = rg; g.beginPath(); g.arc(0, 0, 22, 0, Math.PI * 2); g.fill();
  g.strokeStyle = "#f3c64f"; g.lineWidth = 1.8; g.stroke();
  g.beginPath(); g.arc(0, 0, 18.4, 0, Math.PI * 2); g.lineWidth = 0.7; g.stroke();
  g.fillStyle = "#f3c64f";
  for (let k = 0; k < 16; k++) { const a = k * Math.PI / 8; g.beginPath(); g.arc(Math.cos(a) * 20.2, Math.sin(a) * 20.2, 0.7, 0, Math.PI * 2); g.fill(); }
  g.save(); g.translate(0, -5.5); g.scale(0.75, 0.75); crown(g, "K"); g.restore();
  g.font = "15px Luckiest"; g.textAlign = "center"; g.textBaseline = "alphabetic"; g.lineJoin = "round";
  g.lineWidth = 2.2; g.strokeStyle = "#0b1a42"; g.strokeText("PS", 0, 12.5);
  g.fillStyle = "#ffd75e"; g.fillText("PS", 0, 12.5);
  g.restore();
  // Rombos en las cuatro esquinas.
  g.fillStyle = "rgba(255,214,110,0.9)";
  for (const [qx, qy] of [[13, 13], [CARD_W - 13, 13], [13, CARD_H - 13], [CARD_W - 13, CARD_H - 13]]) {
    g.beginPath(); g.moveTo(qx, qy - 3); g.lineTo(qx + 2.2, qy); g.lineTo(qx, qy + 3); g.lineTo(qx - 2.2, qy); g.closePath(); g.fill();
  }
  SPRITES.set("back", c);
  return c;
}

// -- Fondo: tapete, zonas, zapato, carretera -------------------------------------------------

function woodGradient(g, y0, y1) {
  const grad = g.createLinearGradient(0, y0, 0, y1);
  grad.addColorStop(0, "#9a6a35"); grad.addColorStop(0.5, "#6d4521"); grad.addColorStop(1, "#43280f");
  return grad;
}

function paintShoe(g) {
  // El zapato: caja de madera con ribete dorado; por la boca (SHOE_X, SHOE_Y) asoman las cartas.
  g.save();
  const bx = SHOE_X - 34, by = 4, bw = 68, bh = 38;
  g.fillStyle = "rgba(0,0,0,0.38)"; roundRect(g, bx + 2, by + 4, bw, bh, 8); g.fill();
  roundRect(g, bx, by, bw, bh, 8); g.fillStyle = woodGradient(g, by, by + bh); g.fill();
  g.save(); roundRect(g, bx, by, bw, bh, 8); g.clip();
  g.strokeStyle = "rgba(0,0,0,0.2)"; g.lineWidth = 0.7;
  for (let k = 0; k < 5; k++) { g.beginPath(); g.moveTo(bx, by + 4 + k * 7); g.bezierCurveTo(bx + 20, by + 1 + k * 7, bx + 45, by + 8 + k * 7, bx + bw, by + 3 + k * 7); g.stroke(); }
  g.fillStyle = "rgba(255,230,160,0.28)"; g.fillRect(bx, by, bw, 2.5);
  g.restore();
  g.strokeStyle = "#e0b04a"; g.lineWidth = 1.4; roundRect(g, bx, by, bw, bh, 8); g.stroke();
  // Placa dorada.
  roundRect(g, SHOE_X - 15, by + 5, 30, 12, 4); g.fillStyle = "#e9bd55"; g.fill();
  g.strokeStyle = "#7a5206"; g.lineWidth = 0.8; g.stroke();
  g.fillStyle = "#6a400c"; g.font = "9px Luckiest"; g.textAlign = "center"; g.textBaseline = "middle"; spaced(g, 0.5);
  g.fillText("8×52", SHOE_X + 0.3, by + 11.4); spaced(g, 0);
  // Boca: ranura oscura y el mazo con la primera carta asomando.
  roundRect(g, SHOE_X - 24, 33, 48, 11, 3); g.fillStyle = "#170c04"; g.fill();
  g.strokeStyle = "#e0b04a"; g.lineWidth = 1; g.stroke();
  g.fillStyle = "#f2efe4";
  for (let k = 0; k < 3; k++) g.fillRect(SHOE_X - 21, 35.2 + k * 2.2, 42, 1.5);
  roundRect(g, SHOE_X - 21, 40.5, 42, 7, 2);
  const cg = g.createLinearGradient(0, 40, 0, 48); cg.addColorStop(0, "#1f3f86"); cg.addColorStop(1, "#0b1a42");
  g.fillStyle = cg; g.fill(); g.strokeStyle = "#f3c64f"; g.lineWidth = 0.8; g.stroke();
  g.restore();
}

function paintBackground() {
  const c = document.createElement("canvas"); c.width = W * S; c.height = H * S;
  const g = c.getContext("2d"); g.scale(S, S);
  // Tapete con degradado radial y una textura de fieltro.
  let grad = g.createRadialGradient(320, 190, 30, 320, 190, 470);
  grad.addColorStop(0, "#238253"); grad.addColorStop(0.55, "#135a37"); grad.addColorStop(1, "#06281a");
  g.fillStyle = grad; g.fillRect(0, 0, W, H);
  const r = rng(11);
  for (let k = 0; k < 2600; k++) {
    g.fillStyle = r() < 0.5 ? "rgba(255,255,255,0.035)" : "rgba(0,0,0,0.06)";
    g.fillRect(r() * W, r() * H, 1, 1);
  }
  g.strokeStyle = "rgba(0,0,0,0.035)"; g.lineWidth = 1;
  for (let k = -H; k < W; k += 5) { g.beginPath(); g.moveTo(k, 0); g.lineTo(k + H, H); g.stroke(); }
  grad = g.createRadialGradient(320, 200, 190, 320, 200, 430);
  grad.addColorStop(0, "rgba(0,0,0,0)"); grad.addColorStop(1, "rgba(0,0,0,0.5)");
  g.fillStyle = grad; g.fillRect(0, 0, W, H);
  // Zonas del Jugador y de la Banca.
  for (const [cx, color, name, pay] of [[170, BLUE, "JUGADOR", "PAGA 1:1"], [470, RED, "BANCA", "PAGA 0,95:1"]]) {
    const x = cx - ZONE_W / 2;
    roundRect(g, x, ZONE_Y, ZONE_W, ZONE_H, 20);
    const zg = g.createLinearGradient(0, ZONE_Y, 0, ZONE_Y + ZONE_H);
    zg.addColorStop(0, rgba(color, 0.2)); zg.addColorStop(1, rgba(color, 0.06));
    g.fillStyle = zg; g.fill();
    g.strokeStyle = rgba(color, 0.7); g.lineWidth = 2; g.stroke();
    roundRect(g, x + 4, ZONE_Y + 4, ZONE_W - 8, ZONE_H - 8, 16);
    g.strokeStyle = "rgba(255,255,255,0.1)"; g.lineWidth = 0.8; g.stroke();
    // Nombre y pago en una línea, centrados.
    g.font = "17px Luckiest"; spaced(g, 1.5); const nw = g.measureText(name).width;
    g.font = "700 8.5px Montserrat"; spaced(g, 1); const pw = g.measureText(pay).width;
    const gap = 10, total = nw + gap + pw, sx = cx - total / 2;
    g.textBaseline = "alphabetic"; g.textAlign = "left";
    g.font = "17px Luckiest"; spaced(g, 1.5); g.lineJoin = "round"; g.lineWidth = 3; g.strokeStyle = "rgba(0,0,0,0.45)";
    g.strokeText(name, sx, 58); g.fillStyle = color === BLUE ? "#8db6ff" : "#ff8f95"; g.fillText(name, sx, 58);
    g.font = "700 8.5px Montserrat"; spaced(g, 1); g.fillStyle = "rgba(255,240,200,0.85)";
    g.fillText(pay, sx + nw + gap, 57.5);
    spaced(g, 0);
    // Huecos vacíos: contorno punteado sutil (el tercero, tumbado).
    const slots = cx < 320 ? PLAYER_SLOTS : BANKER_SLOTS;
    slots.forEach(([sx2, sy2], i) => {
      g.save(); g.translate(sx2, sy2); if (i === 2) g.rotate(Math.PI / 2);
      roundRect(g, -CARD_W / 2, -CARD_H / 2, CARD_W, CARD_H, 6);
      g.fillStyle = "rgba(0,0,0,0.12)"; g.fill();
      g.setLineDash([4, 4]); g.lineWidth = 1.2; g.strokeStyle = "rgba(255,255,255,0.2)"; g.stroke();
      g.restore();
    });
  }
  // Rótulo de arriba: título a la izquierda.
  g.save(); g.font = "26px Luckiest"; spaced(g, 2); g.textAlign = "left"; g.textBaseline = "alphabetic";
  g.lineJoin = "round"; g.lineWidth = 5; g.strokeStyle = "rgba(20,10,0,0.6)"; g.strokeText("BACARÁ", 20, 30);
  const tg = g.createLinearGradient(0, 8, 0, 32); tg.addColorStop(0, "#fff1a8"); tg.addColorStop(1, "#e0a41c");
  g.fillStyle = tg; g.fillText("BACARÁ", 20, 30); g.restore();
  paintShoe(g);
  // Etiqueta del empate (la parte fija; el brillo es dinámico).
  paintTie(g, 0);
  // Carretera grande: papel con cuadrícula.
  const px = ROAD_X - 3, py = ROAD_Y - 3, pw2 = META.cols * ROAD_CELL + 6, ph = META.rows * ROAD_CELL + 6;
  g.save(); g.shadowColor = "rgba(0,0,0,0.45)"; g.shadowBlur = 6 * S; g.shadowOffsetY = 2 * S;
  roundRect(g, px, py, pw2, ph, 5); g.fillStyle = "#f4f0e4"; g.fill(); g.restore();
  roundRect(g, px, py, pw2, ph, 5); g.strokeStyle = "#c79a2e"; g.lineWidth = 1.2; g.stroke();
  g.strokeStyle = "rgba(120,110,90,0.35)"; g.lineWidth = 0.7; g.beginPath();
  for (let col = 0; col <= META.cols; col++) { const x = ROAD_X + col * ROAD_CELL; g.moveTo(x, ROAD_Y); g.lineTo(x, ROAD_Y + META.rows * ROAD_CELL); }
  for (let row = 0; row <= META.rows; row++) { const y = ROAD_Y + row * ROAD_CELL; g.moveTo(ROAD_X, y); g.lineTo(ROAD_X + META.cols * ROAD_CELL, y); }
  g.stroke();
  // Panel del recuento.
  roundRect(g, PANEL_X, ROAD_Y - 3, W - PANEL_X - 12, ph, 8);
  g.fillStyle = "rgba(4,24,14,0.5)"; g.fill(); g.strokeStyle = "rgba(255,214,110,0.3)"; g.lineWidth = 1; g.stroke();
  // Marco dorado fino y viñeta.
  g.save(); roundRect(g, 3, 3, W - 6, H - 6, 12); g.strokeStyle = "rgba(255,214,110,0.3)"; g.lineWidth = 1; g.stroke(); g.restore();
  // Rótulo de la mesa.
  g.save(); g.font = "700 7.5px Montserrat"; g.textAlign = "center"; g.textBaseline = "middle"; g.fillStyle = "rgba(255,214,110,0.3)";
  spaced(g, 3); g.fillText("CASINO DEL ESTADO  ·  PUNTO Y BANCA", 320, 412.5); g.restore();
  return c;
}

// La etiqueta «EMPATE PAGA 8:1», entre las dos zonas; `glow` (0-1) la ilumina.
function paintTie(g, glow) {
  g.save();
  g.font = "700 8.5px Montserrat"; spaced(g, 1);
  const text = "EMPATE PAGA 8:1", w = g.measureText(text).width + 22, h = 20;
  if (glow > 0) { g.shadowColor = "rgba(93,255,154,0.95)"; g.shadowBlur = 16 * S * glow; }
  roundRect(g, 320 - w / 2, TIE_Y - h / 2, w, h, 10);
  g.fillStyle = glow > 0 ? rgba("#1c8a4c", 0.65 + 0.3 * glow) : "rgba(6,40,24,0.7)"; g.fill();
  g.shadowBlur = 0;
  g.strokeStyle = glow > 0 ? `rgba(160,255,200,${0.6 + 0.4 * glow})` : rgba(GREEN, 0.7); g.lineWidth = 1.2; g.stroke();
  g.fillStyle = glow > 0 ? "#fff" : "#6fe0a0"; g.textAlign = "center"; g.textBaseline = "middle";
  g.fillText(text, 320.5, TIE_Y + 0.5);
  g.restore();
}

// -- Zonas ganadoras, fichas, carretera --------------------------------------------------------

function drawWinZone(st) {
  const a = clamp(st.winGlow || 0, 0, 1);
  if (!st.win || a <= 0) return;
  const g = bctx;
  if (st.win === "empate") {
    const grad = g.createLinearGradient(262, 0, 378, 0);
    grad.addColorStop(0, "rgba(93,255,154,0)"); grad.addColorStop(0.5, `rgba(93,255,154,${0.3 * a})`); grad.addColorStop(1, "rgba(93,255,154,0)");
    g.fillStyle = grad; g.fillRect(262, ZONE_Y + 4, 116, ZONE_H - 8);
    paintTie(g, a);
    return;
  }
  const color = st.win === "jugador" ? BLUE : RED, cx = st.win === "jugador" ? 170 : 470;
  const x = cx - ZONE_W / 2;
  g.save();
  roundRect(g, x, ZONE_Y, ZONE_W, ZONE_H, 20);
  const grad = g.createRadialGradient(cx, 150, 20, cx, 150, 190);
  grad.addColorStop(0, rgba(st.win === "jugador" ? "#6fa6ff" : "#ff6f78", 0.38 * a)); grad.addColorStop(1, rgba(color, 0.14 * a));
  g.fillStyle = grad; g.fill();
  g.shadowColor = st.win === "jugador" ? "rgba(110,170,255,0.95)" : "rgba(255,110,120,0.95)"; g.shadowBlur = 18 * S * a;
  g.strokeStyle = st.win === "jugador" ? `rgba(170,205,255,${0.4 + 0.6 * a})` : `rgba(255,170,175,${0.4 + 0.6 * a})`;
  g.lineWidth = 2 + 1.6 * a; g.stroke();
  g.restore();
}

function drawBadge(info, pos, color, light) {
  if (!info || info.value == null) return;
  const g = bctx, sc = info.pop == null ? 1 : Math.max(info.pop, 0.01);
  g.save(); g.translate(pos[0], pos[1]); g.scale(sc, sc);
  g.shadowColor = info.win ? "rgba(255,214,90,0.95)" : "rgba(0,0,0,0.55)"; g.shadowBlur = (info.win ? 14 : 6) * S;
  g.shadowOffsetY = info.win ? 0 : 2 * S;
  g.beginPath(); g.arc(0, 0, 24, 0, Math.PI * 2);
  const grad = g.createLinearGradient(0, -24, 0, 24); grad.addColorStop(0, light); grad.addColorStop(1, color);
  g.fillStyle = grad; g.fill(); g.shadowBlur = 0; g.shadowOffsetY = 0;
  g.strokeStyle = info.win ? "#ffd75e" : "#fff"; g.lineWidth = 3; g.stroke();
  g.beginPath(); g.arc(0, 0, 19, 0, Math.PI * 2); g.strokeStyle = "rgba(255,255,255,0.35)"; g.lineWidth = 0.9;
  g.setLineDash([2.5, 3]); g.stroke(); g.setLineDash([]);
  g.font = "28px Luckiest"; g.textAlign = "center"; g.textBaseline = "middle";
  g.lineJoin = "round"; g.lineWidth = 4; g.strokeStyle = "rgba(0,0,30,0.55)";
  g.strokeText(String(info.value), 0, 2); g.fillStyle = "#fff"; g.fillText(String(info.value), 0, 2);
  g.restore();
}

function drawHeader(h) {
  if (!h) return;
  const g = bctx;
  g.save(); g.font = "700 10px Montserrat"; g.textAlign = "right"; g.textBaseline = "middle"; spaced(g, 1.2);
  const text = h.hand ? `ZAPATO ${h.shoe} · MANO ${h.hand} · QUEDAN ${h.left}` : `ZAPATO ${h.shoe}`;
  g.shadowColor = "rgba(0,0,0,0.6)"; g.shadowBlur = 3 * S; g.fillStyle = "#f2e8c8";
  g.fillText(text, 620, 20);
  g.restore();
}

function drawRoad(road) {
  if (!road) return;
  const g = bctx;
  for (const [col, row, side, ties, natural, index] of road.cells) {
    const cx = ROAD_X + col * ROAD_CELL + ROAD_CELL / 2, cy = ROAD_Y + row * ROAD_CELL + ROAD_CELL / 2;
    let sc = 1;
    if (road.fresh != null && index === road.newest) sc = Math.max(road.fresh, 0);
    if (sc <= 0) continue;
    g.save(); g.translate(cx, cy); g.scale(sc, sc);
    const color = SIDE_COLOR[side];
    if (road.fresh != null && index === road.newest) {
      g.shadowColor = rgba(color, 0.8); g.shadowBlur = 8 * S * clamp(sc, 0, 1);
    }
    g.beginPath(); g.arc(0, 0, 7.2, 0, Math.PI * 2); g.strokeStyle = color; g.lineWidth = 2.8; g.stroke();
    g.shadowBlur = 0;
    if (natural) { g.beginPath(); g.arc(0, 0, 2.1, 0, Math.PI * 2); g.fillStyle = "#e8a817"; g.fill(); g.strokeStyle = "#7a5206"; g.lineWidth = 0.6; g.stroke(); }
    if (ties > 0) {
      g.beginPath(); g.moveTo(-8, 8); g.lineTo(8, -8); g.strokeStyle = "#1f9d55"; g.lineWidth = 2; g.lineCap = "round"; g.stroke();
      if (ties > 1) {
        g.font = "700 7.5px Montserrat"; g.textAlign = "center"; g.textBaseline = "middle";
        g.lineJoin = "round"; g.lineWidth = 2.2; g.strokeStyle = "#f4f0e4"; g.strokeText(String(ties), 6.5, 6.6);
        g.fillStyle = "#14703c"; g.fillText(String(ties), 6.5, 6.6);
      }
    }
    g.restore();
  }
  // Recuento del zapato.
  const s = road.stats || {};
  const rows = [["B", "BANCA", s.banker], ["J", "JUGADOR", s.player], ["E", "EMPATE", s.tie]];
  g.save(); g.textBaseline = "middle";
  let y = ROAD_Y + 10;
  for (const [letter, label, value] of rows) {
    g.beginPath(); g.arc(PANEL_X + 14, y, 6, 0, Math.PI * 2); g.fillStyle = SIDE_COLOR[letter]; g.fill();
    g.strokeStyle = "rgba(255,255,255,0.8)"; g.lineWidth = 1; g.stroke();
    g.font = "700 11px Montserrat"; g.textAlign = "left"; spaced(g, 1); g.fillStyle = "#f2e8c8"; g.fillText(label, PANEL_X + 28, y + 0.5);
    spaced(g, 0); g.textAlign = "right"; g.font = "16px Luckiest"; g.fillStyle = "#fff"; g.fillText(String(value ?? 0), W - 24, y + 1);
    y += 23;
  }
  g.beginPath(); g.arc(PANEL_X + 14, y, 6, 0, Math.PI * 2); g.fillStyle = "#e8a817"; g.fill();
  g.strokeStyle = "rgba(255,255,255,0.8)"; g.lineWidth = 1; g.stroke();
  g.font = "700 11px Montserrat"; g.textAlign = "left"; spaced(g, 1); g.fillStyle = "#f2e8c8"; g.fillText("NATURALES", PANEL_X + 28, y + 0.5);
  spaced(g, 0); g.textAlign = "right"; g.font = "16px Luckiest"; g.fillStyle = "#fff"; g.fillText(String(s.naturals ?? 0), W - 24, y + 1);
  y += 24;
  if ((s.streak || 0) >= 2 && s.streakSide) {
    const col = s.streakSide === "B" ? RED : BLUE;
    roundRect(g, PANEL_X + 6, y - 9, W - PANEL_X - 12 - 12, 18, 9);
    g.fillStyle = rgba(col, 0.9); g.fill(); g.strokeStyle = "rgba(255,255,255,0.85)"; g.lineWidth = 1.2; g.stroke();
    g.font = "13px Luckiest"; spaced(g, 1); g.textAlign = "center"; g.fillStyle = "#fff";
    g.fillText(`RACHA ${s.streakSide} ×${s.streak}`, PANEL_X + 6 + (W - PANEL_X - 24) / 2, y + 1);
  }
  g.restore();
}

// -- Cartas ---------------------------------------------------------------------------------

function cardPath(g, inset = 0) {
  roundRect(g, -CARD_W / 2 + inset, -CARD_H / 2 + inset, CARD_W - 2 * inset, CARD_H - 2 * inset, 7 - inset * 0.5);
}

function drawPeel(g, c) {
  const peel = clamp(c.peel, 0, 1);
  g.drawImage(backSprite(), -CARD_W / 2, -CARD_H / 2, CARD_W, CARD_H);
  if (peel <= 0) return;
  const fx = CARD_W / 2 - peel * CARD_W;              // línea del pliegue (en la carta de pie)
  // Sombra del papel que se levanta, sobre el dorso.
  g.save(); cardPath(g); g.clip();
  let grad = g.createLinearGradient(fx - 12, 0, fx, 0);
  grad.addColorStop(0, "rgba(0,0,0,0)"); grad.addColorStop(1, "rgba(0,0,0,0.3)");
  g.fillStyle = grad; g.fillRect(fx - 12, -CARD_H / 2, 12, CARD_H);
  // La franja despegada enseña la cara sin índices.
  g.beginPath(); g.rect(fx, -CARD_H / 2, CARD_W / 2 - fx, CARD_H); g.clip();
  g.drawImage(faceSprite(c.card, true), (fx + CARD_W / 2) * S, 0, peel * CARD_W * S, CARD_H * S,
              fx, -CARD_H / 2, peel * CARD_W, CARD_H);
  grad = g.createLinearGradient(fx, 0, fx + 18, 0);          // sombra suave sobre la cara
  grad.addColorStop(0, "rgba(40,30,10,0.4)"); grad.addColorStop(1, "rgba(40,30,10,0)");
  g.fillStyle = grad; g.fillRect(fx, -CARD_H / 2, Math.min(18, peel * CARD_W), CARD_H);
  g.restore();
  // La curva del papel doblándose en el pliegue.
  if (peel < 0.995) {
    g.save(); cardPath(g); g.clip();
    grad = g.createLinearGradient(fx - 3, 0, fx + 7, 0);
    grad.addColorStop(0, "rgba(0,0,0,0)"); grad.addColorStop(0.2, "rgba(60,50,30,0.55)");
    grad.addColorStop(0.5, "rgba(255,255,250,0.95)"); grad.addColorStop(0.78, "rgba(190,184,166,0.7)");
    grad.addColorStop(1, "rgba(150,144,126,0)");
    g.fillStyle = grad; g.fillRect(fx - 3, -CARD_H / 2, 10, CARD_H); g.restore();
  }
}

function drawCard(c) {
  const g = bctx, lift = c.lift || 0, peeling = c.peel != null;
  const flip = peeling ? 0 : c.flip, ang = clamp(flip, 0, 1) * Math.PI;
  const faceUp = !peeling && flip > 0.5;
  const sx = Math.max(Math.abs(Math.cos(ang)), 0.025);
  const zoom = (c.scale == null ? 1 : c.scale) * (1 + lift / 300);
  // Sombra sobre el tapete: más lejos y más difusa al levantar la carta.
  g.save();
  g.translate(c.x + 2 + lift * 0.28, c.y + 3 + lift * 0.42); g.rotate(c.rot || 0); g.scale(sx * zoom, zoom);
  const fade = 1 - Math.min(lift, 60) / 110;
  for (let k = 3; k >= 0; k--) {
    g.globalAlpha = 0.16 * fade; g.fillStyle = "#000"; cardPath(g, -k * 1.1 - lift / 40); g.fill();
  }
  g.restore();
  g.save();
  g.translate(c.x, c.y - lift * 0.35); g.rotate(c.rot || 0); g.scale(sx * zoom, zoom);
  if (c.glow > 0) {                                           // brillo dorado detrás de la carta
    g.save(); g.shadowColor = "#ffd24a"; g.shadowBlur = 26 * S * clamp(c.glow, 0, 1);
    g.fillStyle = "#ffd24a"; g.globalAlpha = 0.85 * clamp(c.glow, 0, 1); cardPath(g, 3); g.fill(); g.restore();
  }
  if (peeling) drawPeel(g, c);
  else g.drawImage(faceUp ? faceSprite(c.card) : backSprite(), -CARD_W / 2, -CARD_H / 2, CARD_W, CARD_H);
  if (!peeling && faceUp && sx > 0.2 && c.glow > 0) {         // un velo de luz sobre la cara
    g.globalAlpha = 0.18 * clamp(c.glow, 0, 1); g.fillStyle = "#fff";
    roundRect(g, -CARD_W / 2, -CARD_H / 2, CARD_W, CARD_H / 2, 7); g.fill(); g.globalAlpha = 1;
  }
  if (c.dim > 0) { g.fillStyle = `rgba(6,12,10,${clamp(c.dim, 0, 1) * 0.85})`; cardPath(g); g.fill(); }
  g.restore();
}

function spark(g, x, y, r, a, kind) {
  const color = ["255,216,74", "109,255,158", "255,255,255", "255,110,110", "120,170,255"][kind] || "255,255,255";
  g.save(); g.translate(x, y);
  const rg = g.createRadialGradient(0, 0, 0, 0, 0, r * 1.7);
  rg.addColorStop(0, `rgba(${color},${a * 0.55})`); rg.addColorStop(1, `rgba(${color},0)`);
  g.fillStyle = rg; g.beginPath(); g.arc(0, 0, r * 1.7, 0, Math.PI * 2); g.fill();
  g.fillStyle = `rgba(${color},${a})`; g.beginPath();
  for (let k = 0; k < 8; k++) { const rr = k % 2 ? r * 0.28 : r, an = k * Math.PI / 4 - Math.PI / 2;
    g.lineTo(Math.cos(an) * rr, Math.sin(an) * rr); }
  g.closePath(); g.fill(); g.restore();
}

const BANNERS = {
  jugador: { c: ["#6ea6ff", "#1f4fb0"], stroke: "#0a2150", text: "#fff" },
  banca: { c: ["#ff7a80", "#a5202a"], stroke: "#4a0a10", text: "#fff" },
  empate: { c: ["#52e895", "#16824a"], stroke: "#06361c", text: "#fff" },
  natural: { c: ["#fff0a0", "#e0a010"], stroke: "#6b4a05", text: "#fff6c8" },
  shoe: { c: ["#c99557", "#5d3a18"], stroke: "#2a1706", text: "#ffe9b0" },
};

function drawBanner(b) {
  if (!b) return;
  const g = bctx, a = clamp(b.a, 0, 1.4);
  if (a <= 0) return;
  const look = BANNERS[b.kind] || BANNERS.shoe;
  g.save(); g.font = "27px Luckiest"; spaced(g, 1);
  const tw = g.measureText(b.title).width;
  g.font = "700 13px Montserrat"; spaced(g, 0);
  const sw = b.sub ? g.measureText(b.sub).width + 22 : 0;
  const w = Math.max(230, tw + sw + (sw ? 52 : 40)), h = 46;
  g.translate(W / 2, 175); const sc = 0.6 + 0.4 * a; g.scale(sc, sc); g.globalAlpha = clamp(a * 1.4, 0, 1);
  g.shadowColor = "rgba(0,0,0,0.6)"; g.shadowBlur = 12 * S; g.shadowOffsetY = 3;
  roundRect(g, -w / 2, -h / 2, w, h, 12);
  const grad = g.createLinearGradient(0, -h / 2, 0, h / 2); grad.addColorStop(0, look.c[0]); grad.addColorStop(1, look.c[1]);
  g.fillStyle = grad; g.fill(); g.shadowBlur = 0; g.shadowOffsetY = 0;
  g.strokeStyle = b.kind === "natural" ? "#fffbe0" : b.kind === "shoe" ? "#f3c64f" : "rgba(255,255,255,0.85)"; g.lineWidth = 2; g.stroke();
  g.fillStyle = "rgba(255,255,255,0.22)"; roundRect(g, -w / 2 + 4, -h / 2 + 3, w - 8, h / 2 - 3, 9); g.fill();
  const lx = sw ? -w / 2 + 22 + tw / 2 : 0;
  g.font = "27px Luckiest"; spaced(g, 1); g.textAlign = "center"; g.textBaseline = "middle";
  g.lineJoin = "round"; g.lineWidth = 5.5; g.strokeStyle = look.stroke;
  g.strokeText(b.title, lx, 2); g.fillStyle = look.text; g.fillText(b.title, lx, 2);
  if (sw) {
    const px = w / 2 - 14 - sw / 2;
    roundRect(g, px - sw / 2, -13, sw, 26, 13); g.fillStyle = "rgba(6,20,14,0.75)"; g.fill();
    g.font = "700 13px Montserrat"; spaced(g, 0.5); g.fillStyle = "#ffe08a"; g.fillText(b.sub, px, 1);
  }
  g.restore();
}

function paint(st) {
  const g = bctx;
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.drawImage(BG, 0, 0);
  g.save(); g.scale(S, S);
  drawWinZone(st);
  drawHeader(st.header);
  drawRoad(st.road);
  for (const c of st.cards || []) drawCard(c);
  drawBadge(st.player, PLAYER_BADGE, BLUE, "#7eb0ff");
  drawBadge(st.banker, BANKER_BADGE, RED, "#ff858c");
  drawBanner(st.banner);
  for (const [x, y, r, a, kind] of st.sparks || []) spark(g, x, y, r, a, kind);
  g.restore();
}

// -- Salida: solo el recuadro que cambia ------------------------------------------------------

function snapshot(full) {
  octx.imageSmoothingEnabled = true; octx.imageSmoothingQuality = "high";
  octx.drawImage(big, 0, 0, W, H);
  const cur = new Uint32Array(octx.getImageData(0, 0, W, H).data.buffer);
  let x0 = 0, y0 = 0, x1 = W, y1 = H;
  if (!full && PREV) {
    x0 = W; y0 = H; x1 = 0; y1 = 0;
    for (let y = 0; y < H; y++) {
      const row = y * W;
      for (let x = 0; x < W; x++) {
        if (cur[row + x] !== PREV[row + x]) {
          if (x < x0) x0 = x; if (x >= x1) x1 = x + 1;
          if (y < y0) y0 = y; if (y >= y1) y1 = y + 1;
        }
      }
    }
    if (x1 <= x0) { x0 = 0; y0 = 0; x1 = 1; y1 = 1; }   // nada ha cambiado
  }
  PREV = cur;
  const w = x1 - x0, h = y1 - y0;
  crop.width = w; crop.height = h;
  cctx.drawImage(out, x0, y0, w, h, 0, 0, w, h);
  return { x: x0, y: y0, u: window.exportFrame(crop) };
}

// En Chromium cada recuadro va como data URL de PNG; el pintor de Node
// (assets/escena_node.cjs) pone su exportFrame, que devuelve los píxeles tal cual.
window.exportFrame ??= (canvas) => canvas.toDataURL("image/png");

window.loadFonts = async () => {
  await Promise.all([document.fonts.load("30px Luckiest"), document.fonts.load("700 12px Montserrat")]);
  await document.fonts.ready;
  return true;
};
window.setup = (meta) => {
  META = { rows: meta?.rows || ROAD_ROWS, cols: meta?.cols || ROAD_COLS }; PREV = null;
  if (!BG) BG = paintBackground();
  return true;
};
window.renderFrames = (states, first = 0) => states.map((st) => { paint(st); return snapshot(!!st.full); });
</script>
