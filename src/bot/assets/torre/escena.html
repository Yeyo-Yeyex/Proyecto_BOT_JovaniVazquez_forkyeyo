  x.restore();
}

// -- Vista del piso ----------------------------------------------------------------------

function drawShafts(x, oy, t) {
  if (TH.shaft <= 0) return;
  x.save(); x.globalCompositeOperation = "lighter";
  WINDOWS.forEach(([wx, wy, ww, wh], i) => {
    const k = i ? -1 : 1, x0 = wx + 4, x1 = wx + ww - 4, y0 = wy + wh * 0.3 + oy, y1 = GROUND_Y + 30 + oy;
    x.fillStyle = linear(x, 0, y0, 0, y1, [[0, rgba(TH.light, TH.shaft)], [1, rgba(TH.light, 0)]]);
    x.beginPath(); x.moveTo(x0, y0); x.lineTo(x1, y0); x.lineTo(x1 + k * 90, y1); x.lineTo(x0 + k * 70, y1); x.closePath(); x.fill();
    const r = rng(500 + i);
    for (let j = 0; j < 7; j++) {   // polvo en el haz
      const q = (r() + t * 0.012 * (0.5 + r())) % 1, px = lerp(x0, x0 + k * 80, q) + r() * (x1 - x0), py = lerp(y0, y1 - 20, q);
      x.fillStyle = rgba(TH.light, 0.5 * (1 - q)); x.beginPath(); x.arc(px, py, 0.8, 0, TAU); x.fill();
    }
  });
  x.restore();
}

function drawFloorAt(x, st, floor, oy, current) {
  if (!FLOOR_BG) FLOOR_BG = paintFloorBG();
  x.drawImage(FLOOR_BG, 0, oy, LW, H);
  const t = st.t || 0;
  for (const [tx, ty] of TORCHES) drawFlame(x, tx, ty - 5 + oy, t + floor * 3);
  const rects = doorRects(META.width);
  rects.forEach((d0, i) => {
    const ds = (current && st.doors && st.doors[i]) || {};
    const d = { x: d0.x + (ds.dx || 0), y: d0.y + oy, w: d0.w, h: d0.h }, L = leafRect(d);
    if (ds.glow) {
      x.save(); x.globalCompositeOperation = "lighter";
      x.fillStyle = radial(x, d.x + d.w / 2, d.y + d.h / 2, 10, d.h * 0.9, [[0, rgba(TH.accent, 0.45 * ds.glow)], [1, rgba(TH.accent, 0)]]);
      x.fillRect(d.x - d.h, d.y - d.h * 0.5, d.w + d.h * 2, d.h * 1.9); x.restore();
    }
    if (ds.show) drawContent(x, ds.show, L, ds.a ?? 1, t);
    drawLeaf(x, i % 4, L, ds.open || 0, t + i * 2);
    if (ds.glow) {
      x.save(); x.globalCompositeOperation = "lighter";
      x.lineWidth = 2 + 2.5 * ds.glow; x.strokeStyle = rgba(TH.accent, 0.85 * ds.glow); archPath(x, d.x - 1, d.y - 1, d.w + 2, d.h + 1); x.stroke();
      x.lineWidth = 1; x.strokeStyle = rgba("#ffffff", 0.7 * ds.glow); x.stroke();
      x.restore();
    }
    if (ds.ring) {   // la ruleta: el arco encendido y la placa que brilla
      x.save(); x.globalCompositeOperation = "lighter";
      x.fillStyle = radial(x, d.x + d.w / 2, d.y - RING, 2, 34, [[0, `rgba(255,250,210,${0.8 * ds.ring})`], [1, "rgba(255,250,210,0)"]]);
      x.fillRect(d.x + d.w / 2 - 34, d.y - RING - 34, 68, 68);
      x.lineWidth = 5; x.strokeStyle = rgba(TH.accent, 0.5 * ds.ring); archPath(x, d.x - RING - 3, d.y - RING - 3, d.w + 2 * RING + 6, d.h + RING + 3); x.stroke();
      x.restore();
      x.lineWidth = 2.2; x.strokeStyle = rgba("#fff6c8", ds.ring); x.stroke();
    }
    if (ds.dim) { archPath(x, d.x - RING - 2, d.y - RING - 8, d.w + 2 * RING + 4, d.h + RING + 12); x.fillStyle = `rgba(0,0,0,${ds.dim})`; x.fill(); }
    if (ds.sparkle) {
      x.save(); x.globalCompositeOperation = "lighter";
      for (let k = 0; k < 7; k++) {
        const a = (k / 7) * TAU + t * 0.25, rr = d.w * 0.55 * (0.7 + 0.3 * Math.sin(t * 0.9 + k));
        sparkle(x, d.x + d.w / 2 + Math.cos(a) * rr, d.y + d.h * 0.62 + Math.sin(a) * rr * 1.2, 2.2 + 1.4 * Math.sin(t + k * 1.7));
      }
      x.restore();
    }
  });
  drawShafts(x, oy, t);
  x.drawImage(titleSprite(floor), LW / 2 - 105, oy, 210, 46);
  if (current && st.dragon) drawDragonAttack(x, st, rects, oy);
}

function drawDragonAttack(x, st, rects, oy) {
  const dr = st.dragon, d = leafRect(rects[dr.door]), t = st.t || 0;
  const rise = ease(clamp(dr.rise, 0, 1));
  const cx = lerp(d.x + d.w / 2, LW / 2, rise), cy = lerp(d.y + d.h * 0.5 + oy, 150, rise);
  const size = lerp(d.w * 0.95, 310, rise);
  x.save();
  if (rise < 0.3) {   // dentro del hueco, que se le va quedando pequeño
    const m = Math.pow(rise / 0.3, 2) * 300;
    archPath(x, d.x - m, d.y + oy - m, d.w + 2 * m, d.h + 2 * m); x.clip();
  }
  if (rise > 0) {   // sombra del dragón sobre la sala
    x.fillStyle = radial(x, cx, cy + size * 0.1, size * 0.2, size * 0.9, [[0, `rgba(0,0,0,${0.5 * rise})`], [1, "rgba(0,0,0,0)"]]);
    x.fillRect(0, 0, LW, H);
  }
  drawDragonHead(x, cx, cy, size, { mouth: dr.mouth || 0, tilt: Math.sin(t * 1.7) * 0.04 * rise });
  x.restore();
  if (dr.fire > 0) drawBreath(x, cx, cy + size * 0.4, dr.fire, t);
}

// La escalera de caracol entre dos pisos: la pared curva que se pierde en la
// sombra a los lados, el machón del centro y los peldaños a su alrededor.
function stairSprite() {
  return cached("stairs", () => {
    const [c, y] = layer(LW, 2 * H);
    paintWall(y, 0, 0, LW, 2 * H, 131, 24, [36, 72]);
    y.fillStyle = linear(y, 0, 0, LW, 0, [[0, "rgba(0,0,0,0.93)"], [0.28, "rgba(0,0,0,0.5)"], [0.5, "rgba(0,0,0,0.35)"], [0.72, "rgba(0,0,0,0.5)"], [1, "rgba(0,0,0,0.93)"]]);
    y.fillRect(0, 0, LW, 2 * H);
    return c;
  });
}
function drawStairwell(x, q, t) {
  const off = ease(q) * H * 0.9;   // la cámara sube: todo pasa hacia abajo
  x.drawImage(stairSprite(), 0, off - H, LW, 2 * H);
  for (const [j, tx] of [[0, 92], [1, LW - 92], [2, 92]]) {   // antorchas que se quedan atrás
    const ty = 210 - j * 230 + off * 1.15;
    if (ty < -60 || ty > H + 60) continue;
    x.save(); x.globalCompositeOperation = "lighter";
    x.fillStyle = radial(x, tx, ty - 12, 4, 130, [[0, rgba(TH.flame[1], 0.35)], [1, rgba(TH.flame[2], 0)]]);
    x.fillRect(tx - 130, ty - 142, 260, 260); x.restore();
    paintSconce(x, tx, ty); drawFlame(x, tx, ty - 5, t + j * 3);
  }
  const col = LW / 2, stone = TH.stone;
  for (let k = -4; k < 30; k++) {   // peldaños: dan la vuelta al machón
    const a = k * 0.6, co = Math.cos(a), sy = 318 - k * 24 + off;
    if (co < -0.15 || sy < -40 || sy > H + 10) continue;
    const xo = col + Math.sin(a) * 210, lit = 0.55 + 0.45 * co;
    x.fillStyle = "rgba(0,0,0,0.4)";   // sombra del peldaño en la pared
    x.beginPath(); x.moveTo(col, sy + 30); x.lineTo(xo, sy + 26); x.lineTo(xo, sy + 44); x.lineTo(col, sy + 40); x.closePath(); x.fill();
    x.fillStyle = linear(x, 0, sy - 6, 0, sy + 9, [[0, shade(stone[0], -0.2 + 0.25 * lit)], [1, shade(mix(stone[0], stone[1], 0.5), -0.4 + 0.3 * lit)]]);
    x.beginPath(); x.moveTo(col, sy - 2); x.lineTo(xo, sy - 6); x.lineTo(xo, sy + 6); x.lineTo(col, sy + 9); x.closePath(); x.fill();
    x.fillStyle = linear(x, 0, sy + 8, 0, sy + 30, [[0, shade(stone[1], -0.45 + 0.3 * lit)], [1, shade(stone[1], -0.8 + 0.2 * lit)]]);
    x.beginPath(); x.moveTo(col, sy + 9); x.lineTo(xo, sy + 6); x.lineTo(xo, sy + 26); x.lineTo(col, sy + 30); x.closePath(); x.fill();
    x.strokeStyle = `rgba(255,230,190,${0.35 * lit})`; x.lineWidth = 1;
    x.beginPath(); x.moveTo(col, sy + 9); x.lineTo(xo, sy + 6); x.stroke();
  }
  x.fillStyle = linear(x, col - 20, 0, col + 20, 0, [[0, shade(stone[1], -0.7)], [0.45, shade(stone[0], -0.35)], [1, shade(stone[1], -0.8)]]);
  x.fillRect(col - 20, 0, 40, H);
  x.fillStyle = radial(x, LW / 2, H / 2, 60, 280, [[0, "rgba(0,0,0,0)"], [1, "rgba(0,0,0,0.8)"]]); x.fillRect(0, 0, LW, H);
}

// Al subir (`climb` de 0 a 1), la cámara entra por la puerta del huevo, sube
// a oscuras por la escalera de caracol y llega al piso de arriba (o a la cima),
// que se asienta desde arriba: nunca se ven dos pisos a la vez.
const INTO = 0.28, STAIRS = 0.7;
function drawFloorView(x, st) {
  const c = st.climb || 0;
  if (c >= STAIRS) {
    const e = easeOut((c - STAIRS) / (1 - STAIRS)), z = 1 + 0.1 * (1 - e);
    x.save(); x.translate(LW / 2, H / 2); x.scale(z, z); x.translate(-LW / 2, -H / 2 - 14 * (1 - e));
    if (st.floor >= 8) drawSummitAt(x, st, 0);
    else drawFloorAt(x, st, st.floor + 1, 0, false);
    x.restore();
    if (e < 1) { x.fillStyle = `rgba(0,0,0,${Math.pow(1 - e, 1.3)})`; x.fillRect(0, 0, LW, H); }
    return;
  }
  if (c >= INTO) {
    const q = (c - INTO) / (STAIRS - INTO);
    drawStairwell(x, q, st.t || 0);
    x.fillStyle = `rgba(0,0,0,${1 - 0.85 * Math.pow(Math.sin(Math.PI * q), 0.6)})`; x.fillRect(0, 0, LW, H);
    return;
  }
  if (c > 0) {
    const i = Math.max(0, (st.doors || []).findIndex((d) => d.open));
    const d = doorRects(META.width)[i], p = c / INTO, z = 1 + 3.2 * p * p;
    const cx = d.x + d.w / 2, cy = d.y + d.h * 0.62;
    x.save(); x.translate(cx, cy); x.scale(z, z); x.translate(-cx, -cy);
    drawFloorAt(x, st, st.floor, 0, true);
    x.restore();
    x.fillStyle = `rgba(0,0,0,${0.97 * p * p})`; x.fillRect(0, 0, LW, H);
    return;
  }
  drawFloorAt(x, st, st.floor, 0, true);
  if (st.char) {   // todo chamuscado: hollín, humo y brasas
    x.fillStyle = `rgba(36,14,4,${0.5 * st.char})`; x.fillRect(0, 0, LW, H);
    x.fillStyle = radial(x, LW / 2, H / 2, 80, 300, [[0, "rgba(0,0,0,0)"], [1, `rgba(8,4,2,${0.75 * st.char})`]]); x.fillRect(0, 0, LW, H);
    const r = rng(17);
    for (let i = 0; i < 12; i++) {
      const sx = r() * LW + Math.sin(st.t * 0.2 + i) * 10, sy = H - ((st.t * 5 + r() * H) % (H + 60)) + 30, sr = 26 + r() * 34;
      x.fillStyle = radial(x, sx, sy, 0, sr, [[0, `rgba(30,24,22,${0.55 * st.char})`], [1, "rgba(30,24,22,0)"]]);
      x.fillRect(sx - sr, sy - sr, sr * 2, sr * 2);
    }
    drawEmbers(x, st.t, 30, LW, H, 333);
  }
  if (st.coins) {   // vuelan hacia el panel y se pierden por el borde de la vista
    const p = st.coins, from = [LW / 2, 200], to = [LW + 60, 46];
    for (let i = 0; i < 16; i++) {
      const q = clamp(p * 1.7 - i * 0.045, 0, 1);
      if (q <= 0 || q >= 1) continue;
      const spread = (i % 2 ? 1 : -1) * (20 + (i * 13) % 50);
      const bx = lerp(from[0] + spread, to[0], ease(q)), by = lerp(from[1], to[1], q) - Math.sin(q * Math.PI) * 90;
      drawCoin(x, bx, by, 9, st.t * 0.7 + i);
    }
  }
}

// -- La cima -----------------------------------------------------------------------------

function paintSummit() {
  const [c, x] = layer(LW, H);
  paintSky(x, LW, H, 47);
  const r = rng(53);
  const [top, bottom] = TH.decor === "lava" || TH.decor === "ruinas" ? ["rgba(90,30,20,0.9)", "rgba(30,10,8,0.95)"]
    : TH.decor === "noche" ? ["rgba(110,120,180,0.9)", "rgba(40,48,90,0.95)"] : TH.decor === "atardecer" ? ["rgba(255,200,170,0.95)", "rgba(190,90,110,0.95)"] : ["rgba(255,255,255,0.98)", "rgba(190,215,235,0.98)"];
  for (let i = 0; i < 11; i++) cloud(x, i * 46 + r() * 20 - 10, 236 + r() * 16, 20 + r() * 10, top, bottom);
  SUMMIT_SKY = c;
  const [f, y] = layer(LW, H);
  y.save(); y.beginPath(); y.rect(0, 286, LW, H - 286);
  for (let k = 0; k < 8; k++) y.rect(k * 58 + 4, 256, 40, 30);
  y.clip(); paintWall(y, 0, 256, LW, H - 256, 61, 15, [28, 46]);
  y.fillStyle = linear(y, 0, 256, 0, H, [[0, "rgba(0,0,0,0)"], [1, "rgba(0,0,0,0.5)"]]); y.fillRect(0, 256, LW, H - 256);
  y.restore();
  for (let k = 0; k < 8; k++) {   // cara de arriba de las almenas y del adarve
    y.fillStyle = shade(TH.stone[0], 0.2); y.fillRect(k * 58 + 4, 254, 40, 3);
    y.fillStyle = "rgba(0,0,0,0.35)"; y.fillRect(k * 58 + 44, 256, 3, 30);
  }
  y.fillStyle = shade(TH.stone[0], 0.12); y.fillRect(0, 284, LW, 3);
  for (const bx of [92, LW - 92]) {   // estandartes con el color del tema
    y.fillStyle = linear(y, bx - 14, 0, bx + 14, 0, [[0, shade(TH.dragon[1], -0.2)], [0.5, TH.dragon[0]], [1, shade(TH.dragon[1], -0.2)]]);
    y.beginPath(); y.moveTo(bx - 14, 290); y.lineTo(bx + 14, 290); y.lineTo(bx + 14, 342); y.lineTo(bx, 334); y.lineTo(bx - 14, 342); y.closePath(); y.fill();
    y.fillStyle = "#e8b04a"; y.fillRect(bx - 15, 288, 30, 3);
    y.save(); y.translate(bx, 308); drawDragonIcon(y, 0, 0, 18, 0); y.restore();
  }
  SUMMIT_FRONT = f;
}

function drawWing(x, k, flap, main, dark) {
  const sx = LW / 2 + k * 36, sy = 208, wx = LW / 2 + k * 150, wy = 70 - flap;
  const tips = [[k * 210, 40 - flap], [k * 220, 110 - flap * 0.6], [k * 196, 170 - flap * 0.3], [k * 140, 214]];
  x.beginPath(); x.moveTo(sx, sy); x.lineTo(wx, wy);
  tips.forEach(([tx, ty], j) => {
    const px = LW / 2 + tx, prev = j ? [LW / 2 + tips[j - 1][0], tips[j - 1][1]] : [wx, wy];
    x.quadraticCurveTo((prev[0] + px) / 2 - k * 6, (prev[1] + ty) / 2 + 14, px, ty);
  });
  x.quadraticCurveTo(LW / 2 + k * 80, 220, sx, sy + 26); x.closePath();
  x.fillStyle = linear(x, sx, sy, LW / 2 + k * 210, 60, [[0, shade(dark, -0.2)], [0.6, rgba(main, 0.92)], [1, rgba(shade(main, 0.2), 0.85)]]); x.fill();
  x.lineCap = "round";
  for (const [tx, ty] of tips) {   // dedos del ala
    x.lineWidth = 3; x.strokeStyle = shade(dark, -0.35); x.beginPath(); x.moveTo(wx, wy); x.lineTo(LW / 2 + tx, ty); x.stroke();
    x.lineWidth = 1; x.strokeStyle = rgba(TH.dragon[2], 0.4); x.beginPath(); x.moveTo(wx, wy - 1); x.lineTo(LW / 2 + tx, ty - 1); x.stroke();
  }
  x.lineWidth = 7; x.strokeStyle = shade(dark, -0.2); x.beginPath(); x.moveTo(sx, sy); x.lineTo(wx, wy); x.stroke();
  x.lineWidth = 2; x.strokeStyle = rgba(TH.dragon[2], 0.45); x.beginPath(); x.moveTo(sx, sy - 2.5); x.lineTo(wx, wy - 2.5); x.stroke();
  x.fillStyle = shade(TH.horn, -0.1); x.beginPath(); x.moveTo(wx - 4, wy); x.lineTo(wx + k * 4, wy - 14); x.lineTo(wx + 4, wy + 2); x.fill();
}

function drawSummitAt(x, st, oy) {
  if (!SUMMIT_SKY) paintSummit();
  x.drawImage(SUMMIT_SKY, 0, oy, LW, H);
  const bow = ease(clamp(st.bow || 0, 0, 1)), t = st.t || 0;
  const [main, dark] = TH.dragon;
  x.save(); x.translate(0, oy);
  const flap = Math.sin(t * 0.5) * 8;
  for (const k of [-1, 1]) drawWing(x, k, flap, main, dark);
  // Cuello y pecho, con las placas del vientre.
  const hx = LW / 2, hy = lerp(128, 184, bow);
  x.fillStyle = linear(x, LW / 2 - 70, 0, LW / 2 + 70, 0, [[0, shade(dark, -0.2)], [0.4, main], [0.75, shade(main, -0.1)], [1, shade(dark, -0.3)]]);
  x.beginPath(); x.moveTo(LW / 2 - 70, 300);
  x.bezierCurveTo(LW / 2 - 56, 236, hx - 34, hy + 64, hx - 28, hy + 18); x.lineTo(hx + 28, hy + 18);
  x.bezierCurveTo(hx + 40, hy + 70, LW / 2 + 70, 236, LW / 2 + 76, 300); x.closePath(); x.fill();
  for (let k = 0; k < 7; k++) {
    const q = k / 7, yy = lerp(hy + 40, 290, q), ww = lerp(14, 34, q);
    x.fillStyle = linear(x, 0, yy - 7, 0, yy + 7, [[0, shade(TH.dragon[2], 0.1)], [1, shade(TH.dragon[2], -0.35)]]);
    x.beginPath(); x.ellipse(LW / 2 + 3, yy, ww, 7.5, 0, 0, Math.PI); x.fill();
  }
  drawDragonHead(x, hx, hy, 156, { tilt: bow * 0.18, eyes: 1 - bow, mouth: 0 });
  x.restore();
  if (st.crown != null) {
    const c = ease(clamp(st.crown, 0, 1)), cy = lerp(-50, 46, c) + oy;
    x.save(); x.globalCompositeOperation = "lighter";
    x.translate(LW / 2, cy); x.rotate(t * 0.05);
    for (let i = 0; i < 14; i++) {
      x.rotate(TAU / 14); x.fillStyle = linear(x, 0, 0, 0, -230, [[0, `rgba(255,236,150,${0.22 * c})`], [1, "rgba(255,236,150,0)"]]);
      x.beginPath(); x.moveTo(0, 0); x.lineTo(-16, -230); x.lineTo(16, -230); x.closePath(); x.fill();
    }
    x.rotate(-t * 0.05); x.fillStyle = radial(x, 0, 0, 4, 90, [[0, `rgba(255,240,170,${0.6 * c})`], [1, "rgba(255,240,170,0)"]]); x.fillRect(-90, -90, 180, 180);
    for (let i = 0; i < 6; i++) { const a = i * 1.1 + t * 0.2; sparkle(x, Math.cos(a) * (60 + 10 * Math.sin(t + i)), Math.sin(a) * 40, 3 + 1.5 * Math.sin(t * 1.3 + i)); }
    x.restore();
    drawCrown(x, LW / 2, cy, 0.9);
  }
  x.drawImage(SUMMIT_FRONT, 0, oy, LW, H);
  if (st.coins != null && oy === 0) drawCoinRain(x, st.coins, t, 40, LW);
}

// -- La torre entera ----------------------------------------------------------------------

function towerFloorY(f) { return TOWER.base - (f + 1) * TOWER.fh; }

function paintTowerBG() {
  const [c, x] = layer(LW, H);
  paintSky(x, LW, H, 23);
  const r = rng(31);
  // Tres cordilleras, cada una más cerca y más oscura (en la lava, un volcán).
  [[0.35, 205, 26], [0.6, 236, 18], [1, 262, 12]].forEach(([k, y0, amp], j) => {
    x.fillStyle = mix(TH.sky[1], TH.hills[1], k); x.beginPath(); x.moveTo(0, H);
    for (let px = 0; px <= LW; px += 12) x.lineTo(px, y0 + Math.sin(px / (40 + j * 13) + j) * amp + r() * 6);
    x.lineTo(LW, H); x.closePath(); x.fill();
  });
  if (TH.decor === "lava") {
    x.fillStyle = "#1a0606"; x.beginPath(); x.moveTo(330, H); x.lineTo(396, 196); x.lineTo(420, 196); x.lineTo(LW + 40, H); x.fill();
    x.save(); x.globalCompositeOperation = "lighter";
    x.fillStyle = radial(x, 408, 194, 2, 46, [[0, "rgba(255,150,30,0.95)"], [1, "rgba(255,60,0,0)"]]); x.fillRect(350, 140, 120, 110);
    x.strokeStyle = "rgba(255,110,10,0.85)"; x.lineWidth = 2; x.beginPath(); x.moveTo(402, 198); x.quadraticCurveTo(396, 240, 384, 290); x.stroke();
    x.restore();
  }
  x.fillStyle = linear(x, 0, TOWER.base - 12, 0, H, [[0, TH.hills[0]], [1, shade(TH.hills[1], -0.3)]]);   // la loma de la torre
  x.beginPath(); x.moveTo(0, H); x.lineTo(0, TOWER.base + 8); x.quadraticCurveTo(LW / 2, TOWER.base - 16, LW, TOWER.base + 8); x.lineTo(LW, H); x.fill();
  const top = towerFloorY(8), side = TOWER.side, R = TOWER.x + TOWER.w;
  x.fillStyle = "rgba(0,0,0,0.4)"; x.beginPath(); x.ellipse(LW / 2 + 20, TOWER.base + 2, TOWER.w * 0.7, 8, 0, 0, TAU); x.fill();
  // Cara de delante (sillares) y cara de la derecha, en sombra.
  x.save(); x.beginPath(); x.rect(TOWER.x, top, TOWER.w, TOWER.base - top); x.clip();
  paintWall(x, TOWER.x, top, TOWER.w, TOWER.base - top, 13, 14, [20, 34]);
  x.restore();
  x.save(); x.beginPath(); x.moveTo(R, top); x.lineTo(R + side, top - 7); x.lineTo(R + side, TOWER.base - 7); x.lineTo(R, TOWER.base); x.closePath(); x.clip();
  paintWall(x, R, top - 8, side, TOWER.base - top + 8, 14, 14, [10, 16]);
  x.fillStyle = "rgba(0,0,0,0.5)"; x.fillRect(R, top - 8, side, TOWER.base - top + 8);
  x.restore();
  x.fillStyle = linear(x, TOWER.x, 0, R, 0, [[0, "rgba(0,0,0,0.35)"], [0.25, "rgba(255,255,255,0.05)"], [0.6, "rgba(0,0,0,0)"], [1, "rgba(0,0,0,0.3)"]]);
  x.fillRect(TOWER.x, top, TOWER.w, TOWER.base - top);
  // Cornisas entre pisos, números y multiplicadores.
  for (let f = 0; f < 9; f++) {
    const y = towerFloorY(f);
    x.fillStyle = shade(TH.stone[0], 0.1); x.fillRect(TOWER.x - 3, y + TOWER.fh - 3, TOWER.w + 6, 2);
    x.fillStyle = shade(TH.stone[1], -0.35); x.fillRect(TOWER.x - 3, y + TOWER.fh - 1, TOWER.w + 6, 1.5);
    x.fillStyle = "rgba(0,0,0,0.3)"; x.fillRect(TOWER.x, y + TOWER.fh + 0.5, TOWER.w, 2.5);
    const sx = TOWER.x - 15, sy = y + TOWER.fh / 2;   // escudo con el número
    x.beginPath(); x.moveTo(sx - 8, sy - 9); x.lineTo(sx + 8, sy - 9); x.lineTo(sx + 8, sy + 2); x.quadraticCurveTo(sx + 7, sy + 7, sx, sy + 10); x.quadraticCurveTo(sx - 7, sy + 7, sx - 8, sy + 2); x.closePath();
    x.fillStyle = linear(x, 0, sy - 9, 0, sy + 10, [[0, shade(TH.panel[0], 0.2)], [1, TH.panel[1]]]); x.fill();
    x.lineWidth = 1.2; x.strokeStyle = "#d8a028"; x.stroke();
    text(x, String(f + 1), sx, sy + 1, { font: "11px Luckiest", fill: "#ffe7a0" });
    x.font = "700 10px Montserrat"; const mw = x.measureText(META.short[f]).width + 10, mx = R + side + 6;
    roundRect(x, mx, sy - 7.5, mw, 15, 7.5); x.fillStyle = "rgba(0,0,0,0.55)"; x.fill();
    x.lineWidth = 0.8; x.strokeStyle = rgba(TH.accent, 0.6); x.stroke();
    text(x, META.short[f], mx + mw / 2, sy + 0.5, { font: "700 10px Montserrat", fill: "#fff" });
  }
  // Almenas con su cara de arriba y la bandera.
  for (let k = 0; k < 7; k++) {
    const mx = TOWER.x + k * (TOWER.w / 7) + 3, mw = TOWER.w / 7 - 10;
    x.save(); x.beginPath(); x.rect(mx, top - 15, mw, 15); x.clip();
    paintWall(x, mx, top - 15, mw, 15, 40 + k, 8, [10, 18]); x.restore();
    x.fillStyle = shade(TH.stone[0], 0.25); x.fillRect(mx, top - 16, mw, 2);
    x.fillStyle = "rgba(0,0,0,0.35)"; x.fillRect(mx + mw, top - 14, 2, 14);
  }
  x.fillStyle = shade(TH.stone[1], -0.3); x.fillRect(TOWER.x - 5, top - 2, TOWER.w + 10, 4);
  x.fillStyle = shade(TH.stone[0], 0.2); x.fillRect(TOWER.x - 5, top - 2, TOWER.w + 10, 1.2);
  x.fillStyle = linear(x, LW / 2 - 1.5, 0, LW / 2 + 1.5, 0, [[0, "#2a1a0a"], [0.5, "#7a5a3a"], [1, "#2a1a0a"]]); x.fillRect(LW / 2 - 1.5, top - 58, 3, 42);
  x.fillStyle = linear(x, LW / 2, top - 58, LW / 2 + 34, top - 44, [[0, shade(TH.accent, -0.2)], [1, TH.accent]]);
  x.beginPath(); x.moveTo(LW / 2 + 1.5, top - 58); x.quadraticCurveTo(LW / 2 + 18, top - 54, LW / 2 + 34, top - 52); x.quadraticCurveTo(LW / 2 + 18, top - 46, LW / 2 + 1.5, top - 42); x.fill();
  return c;
}

function drawTowerView(x, st) {
  if (!TOWER_BG) TOWER_BG = paintTowerBG();
  x.drawImage(TOWER_BG, 0, 0, LW, H);
  const t = st.t || 0, tour = st.tour ?? 9, picks = st.picks || [], n = META.width;
  const dw = { 2: 40, 3: 34, 4: 30 }[n] || 30, gap = 10, x0 = TOWER.x + TOWER.w / 2 - (n * dw + (n - 1) * gap) / 2;
  for (let f = 0; f < 9; f++) {
    const y = towerFloorY(f), lit = f < tour;
    const sweep = clamp(1 - Math.abs(tour - 0.5 - f), 0, 1);
    if (sweep > 0) {
      x.save(); x.globalCompositeOperation = "lighter";
      x.fillStyle = linear(x, TOWER.x, 0, TOWER.x + TOWER.w, 0, [[0, rgba(TH.accent, 0)], [0.5, rgba(TH.accent, 0.4 * sweep)], [1, rgba(TH.accent, 0)]]);
      x.fillRect(TOWER.x, y, TOWER.w, TOWER.fh - 3); x.restore();
    }
    for (let i = 0; i < n; i++) {
      const d = { x: x0 + i * (dw + gap), y: y + 3.5, w: dw, h: TOWER.fh - 6.5 };
      const picked = picks[f] === i, burned = st.burned && st.burned[0] === f && st.burned[1] === i;
      const dragon = META.dragons[f] && META.dragons[f].includes(i);
      archPath(x, d.x - 2, d.y - 2, d.w + 4, d.h + 2); x.fillStyle = shade(TH.stone[1], -0.45); x.fill();
      archPath(x, d.x, d.y, d.w, d.h); x.fillStyle = linear(x, 0, d.y, 0, d.y + d.h, [[0, "#050303"], [1, "#1a120c"]]); x.fill();
      if (burned) {
        x.save(); x.globalCompositeOperation = "lighter";
        x.fillStyle = radial(x, d.x + d.w / 2, d.y + d.h / 2, 1, 30, [[0, "rgba(255,210,80,0.95)"], [0.5, "rgba(255,90,20,0.6)"], [1, "rgba(255,40,0,0)"]]);
        x.fillRect(d.x - 26, d.y - 26, d.w + 52, d.h + 52);
        for (let k = 0; k < 3; k++) { flameShape(x, d.x + d.w * (0.3 + k * 0.2), d.y + 2, 4, 10 + 4 * Math.sin(t * 2 + k), Math.sin(t + k) * 2); x.fillStyle = rgba(TH.flame[1], 0.8); x.fill(); }
        x.restore();
      }
      if (picked) {
        x.save(); x.globalCompositeOperation = "lighter";
        x.fillStyle = radial(x, d.x + d.w / 2, d.y + d.h * 0.6, 1, d.w * 0.6, [[0, rgba(TH.accent, 0.75)], [1, rgba(TH.accent, 0)]]);
        x.fillRect(d.x, d.y, d.w, d.h); x.restore();
        drawEgg(x, d.x + d.w / 2, d.y + d.h * 0.6, 6.5, false);
      } else if (dragon && (lit || burned)) drawDragonHead(x, d.x + d.w / 2, d.y + d.h * 0.62, burned ? 26 : 22, { mouth: burned ? 0.6 : 0.15 });
      else if (!lit) drawLeaf(x, i % 4, d, 0, t);
      else { x.fillStyle = rgba(TH.light, 0.12); archPath(x, d.x, d.y, d.w, d.h); x.fill(); }
    }
    if (st.ghost === f) {
      x.save(); x.globalCompositeOperation = "lighter";
      x.fillStyle = "rgba(200,255,200,0.12)"; x.fillRect(TOWER.x + 2, y + 1, TOWER.w - 4, TOWER.fh - 4); x.restore();
      x.save(); x.setLineDash([5, 4]); x.lineWidth = 1.6; x.strokeStyle = "#d8ffd0";
      x.strokeRect(TOWER.x + 2, y + 1, TOWER.w - 4, TOWER.fh - 4); x.restore();
    }
  }
  if (st.crowned) {
    x.save(); x.globalCompositeOperation = "lighter";
    x.fillStyle = radial(x, LW / 2, towerFloorY(8) - 34, 2, 60, [[0, "rgba(255,230,140,0.7)"], [1, "rgba(255,230,140,0)"]]); x.fillRect(LW / 2 - 60, towerFloorY(8) - 94, 120, 120);
    x.restore();
    drawCrown(x, LW / 2, towerFloorY(8) - 34, 0.34);
  }
}

// -- Panel ------------------------------------------------------------------------------

function paintPanel(p) {
  const [c, x] = layer(PW, PH);
  x.save(); blur(x, "rgba(0,0,0,0.6)", 6, 2);
  roundRect(x, 2, 2, PW - 4, PH - 4, 12); x.fillStyle = TH.panel[1]; x.fill(); x.restore();
  roundRect(x, 2, 2, PW - 4, PH - 4, 12);
  x.fillStyle = linear(x, 0, 0, 0, PH, [[0, shade(TH.panel[0], 0.06)], [0.5, TH.panel[0]], [1, TH.panel[1]]]); x.fill();
  x.lineWidth = 2.4; x.strokeStyle = linear(x, 0, 0, 0, PH, [[0, "#fff1a8"], [0.3, "#d8a028"], [0.7, "#a87010"], [1, "#e8c060"]]); x.stroke();
  roundRect(x, 5.5, 5.5, PW - 11, PH - 11, 9); x.lineWidth = 0.8; x.strokeStyle = "rgba(255,230,160,0.22)"; x.stroke();
  // Lo que se cobra, en un hueco hundido.
  roundRect(x, 9, 9, PW - 18, 64, 8);
  x.fillStyle = linear(x, 0, 9, 0, 73, [[0, "rgba(0,0,0,0.6)"], [0.3, "rgba(0,0,0,0.35)"], [1, "rgba(0,0,0,0.25)"]]); x.fill();
  x.lineWidth = 0.8; x.strokeStyle = "rgba(255,255,255,0.1)"; x.stroke();
  text(x, p.label, PW / 2, 21, { font: "700 9px Montserrat", fill: p.labelColor || TH.accent, spacing: 1.2 });
  x.font = "28px Luckiest";
  const size = Math.min(28, Math.floor(28 * (PW - 30) / x.measureText(p.mult).width));
  const multFill = p.labelColor ? linear(x, 0, 32, 0, 56, [[0, "#ffd0c0"], [1, "#ff5a3a"]]) : gold(x, 32, 56);
  text(x, p.mult, PW / 2, 45, { font: `${size}px Luckiest`, fill: multFill, stroke: "#1a0c02", width: 4.5, drop: "rgba(0,0,0,0.6)" });
  text(x, p.value, PW / 2, 64, { font: "700 12px Montserrat", fill: p.valueColor || "#f3e6c8" });
  // La torre en miniatura: almenas, sillares, pisos y la fila actual encendida.
  const n = META.width, top = 92, rh = 22, base = top + 9 * rh;
  for (let k = 0; k < 7; k++) {
    const mx = 13 + k * 22.4;
    x.fillStyle = linear(x, 0, top - 10, 0, top, [[0, shade(TH.stone[1], -0.05)], [1, shade(TH.stone[1], -0.4)]]); x.fillRect(mx, top - 10, 13, 10);
    x.fillStyle = "rgba(255,255,255,0.2)"; x.fillRect(mx, top - 10, 13, 1);
  }
  x.save(); roundRect(x, 10, top - 1, PW - 20, base - top + 3, 3); x.clip();
  paintWall(x, 10, top - 1, PW - 20, base - top + 3, 77, 11, [16, 30]);
  x.fillStyle = "rgba(0,0,0,0.68)"; x.fillRect(10, top - 1, PW - 20, base - top + 3);
  x.restore();
  for (let f = 0; f < 9; f++) {
    const y = base - (f + 1) * rh;
    const cur = p.current === f, done = f < (p.picks || []).length;
    if (cur) {
      x.save(); blur(x, rgba(TH.accent, 0.8), 6);
      roundRect(x, 7, y + 1, PW - 14, rh - 2, 5); x.fillStyle = rgba(TH.accent, 0.25); x.fill(); x.restore();
      roundRect(x, 7, y + 1, PW - 14, rh - 2, 5); x.lineWidth = 1.6; x.strokeStyle = TH.accent; x.stroke();
    }
    text(x, String(f + 1), 21, y + rh / 2 + 1, { font: "700 10px Montserrat", fill: cur ? "#fff" : "rgba(255,255,255,0.7)" });
    for (let i = 0; i < n; i++) {
      const cx = 32 + i * 17, cy = y + 3.5;
      const burned = p.burned && p.burned[0] === f && p.burned[1] === i;
      archPath(x, cx, cy, 14, 15);
      x.fillStyle = burned ? radial(x, cx + 7, cy + 8, 1, 10, [[0, "#ffb040"], [1, "#9a200a"]]) : linear(x, 0, cy, 0, cy + 15, [[0, "rgba(0,0,0,0.75)"], [1, "rgba(30,20,12,0.6)"]]);
      x.fill(); x.lineWidth = 0.9; x.strokeStyle = rgba(TH.stone[0], 0.45); x.stroke();
      if (done && p.picks[f] === i) drawEgg(x, cx + 7, cy + 9, 4.4, false);
      else if (f < (p.reveal || 0) && META.dragons[f] && META.dragons[f].includes(i)) drawDragonIcon(x, cx + 7, cy + 9, 13, burned ? 0.5 : 0.1);
    }
    text(x, META.short[f], PW - 13, y + rh / 2 + 1, { font: "700 10px Montserrat", align: "right", fill: cur ? "#fff" : done ? TH.accent : "rgba(255,255,255,0.55)" });
  }
  // La dificultad en su placa y la apuesta.
  x.font = "17px Luckiest"; const lw = x.measureText(META.label).width + 30;
  roundRect(x, PW / 2 - lw / 2, PH - 47, lw, 24, 12);
  x.fillStyle = linear(x, 0, PH - 47, 0, PH - 23, [[0, "rgba(0,0,0,0.25)"], [1, "rgba(0,0,0,0.55)"]]); x.fill();
  x.lineWidth = 1.2; x.strokeStyle = rgba(TH.accent, 0.75); x.stroke();
  text(x, META.label, PW / 2, PH - 33.5, { font: "17px Luckiest", fill: TH.accent, stroke: "rgba(0,0,0,0.65)", width: 3.5, spacing: 1 });
  text(x, `APUESTA ${META.stake}`, PW / 2, PH - 13, { font: "700 9.5px Montserrat", fill: "rgba(255,240,210,0.78)", spacing: 0.8 });
  return c;
}

function drawPanel(x, p) {
  x.drawImage(cached(`panel:${JSON.stringify(p)}`, () => paintPanel(p)), PX, PY, PW, PH);
}

// -- Fotograma -------------------------------------------------------------------------

function paintFrame(st) {
  g.setTransform(S, 0, 0, S, 0, 0);
  g.globalAlpha = 1; g.globalCompositeOperation = "source-over";
  g.fillStyle = linear(g, 0, 0, 0, H, [[0, "#14100c"], [1, "#060403"]]); g.fillRect(0, 0, W, H);
  g.save(); g.beginPath(); g.rect(0, 0, LW, H); g.clip();
  const [sx, sy] = st.shake || [0, 0];
  g.translate(sx, sy);
  if (st.view === "tower") {
    if (st.zoom) {   // la cámara se aleja del piso donde acabó la partida
      const z = 1 + 2.2 * st.zoom * st.zoom, f = clamp(st.focus ?? 0, 0, 8);
      const cx = lerp(LW / 2, TOWER.x + TOWER.w / 2, st.zoom);
      const cy = clamp(lerp(H / 2, towerFloorY(f) + TOWER.fh / 2, st.zoom), H / (2 * z), H - H / (2 * z));
      g.translate(LW / 2, H / 2); g.scale(z, z); g.translate(-cx, -cy);
    }
    drawTowerView(g, st);
  }
  else if (st.view === "summit") drawSummitAt(g, st, 0);
  else drawFloorView(g, st);
  g.setTransform(S, 0, 0, S, 0, 0);
  if (st.heart) {
    g.fillStyle = radial(g, LW / 2, 190, 90, 300, [[0, "rgba(60,0,0,0)"], [1, `rgba(70,0,0,${st.heart})`]]);
    g.fillRect(0, 0, LW, H);
  }
  if (st.flash) { const [r, gg, b, a] = st.flash; g.fillStyle = `rgba(${r},${gg},${b},${a})`; g.fillRect(0, 0, LW, H); }
  drawBanner(g, st.banner);
  if (st.fade) { g.fillStyle = `rgba(0,0,0,${st.fade})`; g.fillRect(0, 0, LW, H); }
  g.restore();
  drawPanel(g, st.panel);
}

function snapshot() {
  octx.setTransform(1, 0, 0, 1, 0, 0);
  octx.imageSmoothingEnabled = true; octx.imageSmoothingQuality = "high";
  octx.drawImage(big, 0, 0, W * S, H * S, 0, 0, W, H);
  return { x: 0, y: 0, u: window.exportFrame(out) };
}

// En Chromium cada recuadro va como data URL de PNG; el pintor de Node
// (assets/escena_node.cjs) pone su exportFrame, que devuelve los píxeles tal cual.
window.exportFrame ??= (canvas) => canvas.toDataURL("image/png");
window.loadFonts = async () => {
  await Promise.all([document.fonts.load("30px Luckiest"), document.fonts.load("700 12px Montserrat")]);
  await document.fonts.ready;
  return true;
};
window.setup = async (meta) => {
  META = meta; TH = THEMES[meta.theme] || THEMES.facil;
  const key = JSON.stringify(meta);
  if (BG_KEY !== key) {
    BG_KEY = key; FLOOR_BG = TOWER_BG = SUMMIT_SKY = SUMMIT_FRONT = null; SPRITES.clear();
  }
  return true;
};
window.renderFrames = (states, first = 0) => states.map((st) => { paintFrame(st); return snapshot(); });
</script>
