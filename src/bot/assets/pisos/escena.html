<!doctype html>
<!--
Escena de `pisos` (un mercado inmobiliario satírico de Canarias), dibujada con canvas.
La pinta Node con Skia (assets/escena_node.cjs) y, si no hay Node, un Chromium sin
ventana (ver bot/services/housing_scene.py).

No decide nada: Python le pasa cada pantalla ya formateada (bot/services/housing_view.py:
map_state, barrio_state, listing_state, portfolio_state, checkout_state y vpo_state) y aquí solo se
pinta. Las cifras llegan como texto: la escena nunca calcula dinero. Funciones que llama
Python:

- loadFonts()                espera a las fuentes (canvas no las carga solo).
- setup(meta)                no guarda nada: cada pantalla se pinta entera desde cero.
- renderFrames(states)       una pantalla entera por estado: {x: 0, y: 0, u}.

Pantallas (`screen`): mapa, barrio, ficha, cartera, caja y vpo. Como no hay estado entre
fotogramas, el dibujo se reparte entre procesos sin cambiar un píxel.

Todo se dibuja al doble de tamaño (S = 2) y se reduce al copiarlo. Nada de Math.random
(el ruido sale de un hash de la clave del inmueble) y nada de emojis: el Chromium del
Docker no trae su fuente, así que los iconos son trazos de canvas.
-->
<html lang="es">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: "Montserrat"; src: url("../memes/fonts/MontserratBold.ttf"); font-weight: 700; }
  @font-face { font-family: "RobotoM"; src: url("../memes/fonts/robotomedium.ttf"); }
  @font-face { font-family: "RobotoR"; src: url("../memes/fonts/robotoregular.ttf"); }
  html, body { margin: 0; padding: 0; background: transparent; }
</style>
</head>
<body>
<script>
"use strict";
const S = 2;
const W = 1000, H = 640;

const big = document.createElement("canvas"); big.width = W * S; big.height = H * S;
const out = document.createElement("canvas"); out.width = W; out.height = H;
const g = big.getContext("2d");
const octx = out.getContext("2d");

const C = {
  bg: "#f3f5f8", card: "#ffffff", ink: "#16202b", mute: "#5a6877", line: "#dde3ea",
  orange: "#ea5a0c", sea: "#1f6fb2", green: "#1f9d55", greenDk: "#137a3f", red: "#d23a3a",
  redDk: "#b3261e", amber: "#f2a900", grey: "#8a95a3", blue: "#1f6fb2",
};
const F = {
  d: (s) => `700 ${s}px Montserrat`,
  m: (s) => `${s}px RobotoM`,
  r: (s) => `${s}px RobotoR`,
};

// -- Utilidades ---------------------------------------------------------------------------

function hash(s) {
  let h = 2166136261 >>> 0;
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; }
  return h >>> 0;
}
function rng(seed) {
  return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const TAU = Math.PI * 2;

function rr(x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
}
function circle(x, y, r) { g.beginPath(); g.arc(x, y, r, 0, TAU); }
function fillRR(x, y, w, h, r, color) { rr(x, y, w, h, r); g.fillStyle = color; g.fill(); }
function rect(x, y, w, h, color) { g.fillStyle = color; g.fillRect(x, y, w, h); }
function line(x1, y1, x2, y2, color, width = 1) {
  g.strokeStyle = color; g.lineWidth = width; g.beginPath(); g.moveTo(x1, y1); g.lineTo(x2, y2); g.stroke();
}
function poly(points, color) {
  g.beginPath(); points.forEach(([x, y], i) => (i ? g.lineTo(x, y) : g.moveTo(x, y))); g.closePath();
  g.fillStyle = color; g.fill();
}
function vgrad(y0, y1, a, b) {
  const gr = g.createLinearGradient(0, y0, 0, y1); gr.addColorStop(0, a); gr.addColorStop(1, b); return gr;
}

// Texto: `o.font` ya montada, `o.color`, `o.align` y `o.base`.
function T(s, x, y, o = {}) {
  g.font = o.font || F.m(22); g.fillStyle = o.color || C.ink;
  // `y` es el centro de las mayúsculas: se pinta sobre la línea base y no con `middle`, que Chromium
  // y Skia en Node calculan distinto.
  y += parseFloat(g.font.match(/([\d.]+)px/)[1]) * 0.35;
  g.textAlign = o.align || "left"; g.textBaseline = "alphabetic";
  if (o.skew) {
    g.save(); g.translate(x, y); g.transform(1, 0, -0.2, 1, 0, 0); g.fillText(s, 0, 0); g.restore();
  } else g.fillText(s, x, y);
}
function width(s, font) { g.font = font; return g.measureText(s).width; }
function ellipsize(s, maxW, font) {
  g.font = font;
  if (g.measureText(s).width <= maxW) return s;
  let t = s;
  while (t.length > 1 && g.measureText(t + "…").width > maxW) t = t.slice(0, -1);
  return t.trimEnd() + "…";
}
// Reduce la letra hasta que quepa; si ni con `min`, recorta con puntos suspensivos.
function fit(s, maxW, fontFn, size, min) {
  for (let z = size; z >= min; z--) { g.font = fontFn(z); if (g.measureText(s).width <= maxW) return [s, z]; }
  return [ellipsize(s, maxW, fontFn(min)), min];
}
function fitText(s, x, y, maxW, fontFn, size, min, o = {}) {
  const [t, z] = fit(s, maxW, fontFn, size, min);
  T(t, x, y, { ...o, font: fontFn(z) });
  return z;
}
// Parte en líneas de `maxW`; si sobran, la última acaba en «…».
function wrap(s, maxW, font, maxLines) {
  g.font = font;
  const words = String(s).split(/\s+/).filter(Boolean), lines = [];
  let cur = "";
  for (let i = 0; i < words.length; i++) {
    const trial = cur ? cur + " " + words[i] : words[i];
    if (g.measureText(trial).width <= maxW || !cur) { cur = trial; continue; }
    if (lines.length === maxLines - 1) { cur = trial + " " + words.slice(i + 1).join(" "); break; }
    lines.push(cur); cur = words[i];
  }
  if (cur) lines.push(ellipsize(cur.trim(), maxW, font));
  return lines;
}
function paragraph(s, x, y, maxW, font, lh, maxLines, o = {}) {
  const lines = wrap(s, maxW, font, maxLines);
  lines.forEach((l, i) => T(l, x, y + i * lh, { ...o, font, base: "middle" }));
  return lines.length;
}

// -- Piezas comunes -----------------------------------------------------------------------

// Tarjeta blanca con sombra suave (capas, para que Node y Chromium den lo mismo).
function card(x, y, w, h, o = {}) {
  const r = o.r ?? 14;
  for (let i = 4; i >= 1; i--) fillRR(x - i, y - i + 3, w + 2 * i, h + 2 * i, r + i, `rgba(22,32,43,${0.018 * (5 - i)})`);
  fillRR(x, y, w, h, r, o.fill || C.card);
  if (o.stroke) { rr(x, y, w, h, r); g.strokeStyle = o.stroke; g.lineWidth = 1.5; g.stroke(); }
}

const CHIP = {
  green: [C.green, "#fff"], blue: [C.blue, "#fff"], amber: [C.amber, "#3a2800"],
  red: [C.red, "#fff"], grey: [C.grey, "#fff"], orange: [C.orange, "#fff"], ink: [C.ink, "#fff"],
};
const STATUS_COLOR = { venta: "green", tuyo: "blue", compartido: "blue", parcial: "amber", ajeno: "grey",
  vacio: "grey", alquilado: "green", impago: "red", desahucio: "red", okupa: "red", habitual: "blue" };
// Una etiqueta de color. Devuelve su ancho. `align`: left | right | center. `outline`: borde y sin relleno.
function chip(text, x, y, kind, o = {}) {
  const size = o.size || 20, maxW = o.maxW || 400, h = size + 14;
  const [t, z] = fit(text, maxW - 20, F.d, size, 13);
  const w = width(t, F.d(z)) + 22;
  const x0 = o.align === "right" ? x - w : o.align === "center" ? x - w / 2 : x;
  const [bg, fg] = CHIP[STATUS_COLOR[kind] || kind] || CHIP.grey;
  if (o.outline) { fillRR(x0, y, w, h, h / 2, "#fff"); rr(x0 + 1, y + 1, w - 2, h - 2, h / 2); g.strokeStyle = bg; g.lineWidth = 2; g.stroke(); }
  else fillRR(x0, y, w, h, h / 2, bg);
  T(t, x0 + w / 2, y + h / 2 + 1, { font: F.d(z), color: o.outline ? bg : fg, align: "center" });
  return w;
}
// Lo que mide una etiqueta de `tag` (con su icono), sin pintarla.
function tagW(text, size, icon, maxW = 400) {
  const [t, z] = fit(text, maxW - 22 - (icon ? size + 6 : 0), F.d, size, 12);
  return width(t, F.d(z)) + 22 + (icon ? size + 6 : 0);
}
// Una etiqueta pequeña con un icono delante (casa, sol, corazón, aviso). Devuelve su ancho.
function tag(text, x, y, kind, icon, size = 16, maxW = 400) {
  const h = size + 10, ic = icon ? size + 6 : 0;
  const [t, z] = fit(text, maxW - 22 - ic, F.d, size, 12);
  const w = width(t, F.d(z)) + 22 + ic, [bg, fg] = CHIP[kind] || CHIP.grey;
  fillRR(x, y, w, h, h / 2, bg);
  if (icon) smallIcon(icon, x + 11 + size * 0.5, y + h / 2, size * 0.5, fg);
  T(t, x + 11 + ic, y + h / 2 + 1, { font: F.d(z), color: fg });
  return w;
}

function logoHouse(cx, cy, sz, color) {
  g.fillStyle = color;
  g.beginPath(); g.moveTo(cx - sz, cy - sz * 0.05); g.lineTo(cx, cy - sz); g.lineTo(cx + sz, cy - sz * 0.05);
  g.lineTo(cx + sz * 0.72, cy - sz * 0.05); g.lineTo(cx + sz * 0.72, cy + sz * 0.85); g.lineTo(cx - sz * 0.72, cy + sz * 0.85);
  g.lineTo(cx - sz * 0.72, cy - sz * 0.05); g.closePath(); g.fill();
}

function header(title, sub, o = {}) {
  rect(0, 0, W, 88, C.ink);
  rect(0, 86, W, 4, C.orange);
  fillRR(20, 18, 52, 52, 12, C.orange);
  logoHouse(46, 44, 17, "#fff");
  rect(40, 48, 12, 14, C.orange);
  const right = o.right ? o.rightW + 36 : 0;
  const maxW = W - 96 - 20 - right;
  const size = o.size || 40;
  if (sub) {
    fitText(title, 92, 33, maxW, F.d, size, 22, { color: "#fff" });
    fitText(sub, 92, 66, maxW, F.m, 22, 16, { color: "#b4c0cd" });
  } else fitText(title, 92, 44, maxW, F.d, size, 22, { color: "#fff" });
  if (o.right) o.right();
}
function footer(text) {
  if (text) fitText(text, W / 2, 624, W - 40, F.r, 17, 13, { color: C.mute, align: "center" });
}

// Barra con el reparto de las 100 participaciones: dueños, el tuyo en azul, y lo libre.
const OWNER_COLORS = ["#6b7f95", "#98a8b9", "#4c6178", "#b8c4d1"];
function ownerColor(owner, i) { return owner.mine ? C.blue : OWNER_COLORS[i % OWNER_COLORS.length]; }
function ownersBar(x, y, w, h, owners, free) {
  g.save(); rr(x, y, w, h, h / 2); g.clip();
  rect(x, y, w, h, "#e8ecf1");
  let cx = x;
  owners.forEach((o, i) => { const sw = w * o.shares / 100; rect(cx, y, sw, h, ownerColor(o, i)); cx += sw; rect(cx - 1, y, 1.5, h, "#fff"); });
  if (free > 0) {
    const fw = w * free / 100;
    rect(cx, y, fw, h, "#fff1c9");
    g.save(); g.beginPath(); g.rect(cx, y, fw, h); g.clip();
    for (let k = -h; k < fw; k += 7) line(cx + k, y + h, cx + k + h, y, "rgba(242,169,0,0.75)", 2);
    g.restore();
  }
  g.restore();
}

// -- Iconos (solo trazos) -----------------------------------------------------------------

function dog(cx, cy, r) {
  g.save(); g.translate(cx, cy);
  g.fillStyle = "#7a4a28";
  for (const s of [-1, 1]) { g.beginPath(); g.ellipse(s * r * 0.8, -r * 0.05, r * 0.3, r * 0.62, s * 0.3, 0, TAU); g.fill(); }
  circle(0, 0, r * 0.82); g.fillStyle = "#d9a066"; g.fill();
  g.beginPath(); g.ellipse(0, r * 0.3, r * 0.46, r * 0.36, 0, 0, TAU); g.fillStyle = "#f3dcb8"; g.fill();
  g.beginPath(); g.ellipse(0, r * 0.1, r * 0.18, r * 0.12, 0, 0, TAU); g.fillStyle = "#2a2018"; g.fill();
  for (const s of [-1, 1]) { circle(s * r * 0.32, -r * 0.22, r * 0.1); g.fillStyle = "#2a2018"; g.fill(); }
  g.beginPath(); g.ellipse(0, r * 0.52, r * 0.1, r * 0.14, 0, 0, TAU); g.fillStyle = "#e8788a"; g.fill();
  g.restore();
}

function energyBadge(letter, x, y, w, h) {
  const cols = { A: "#00963f", B: "#4cb04a", C: "#b9d330", D: "#ffd800", E: "#f7a600", F: "#ee7203", G: "#e2001a" };
  const col = cols[letter] || C.grey;
  g.beginPath(); g.moveTo(x, y); g.lineTo(x + w - h * 0.5, y); g.lineTo(x + w, y + h / 2); g.lineTo(x + w - h * 0.5, y + h);
  g.lineTo(x, y + h); g.closePath(); g.fillStyle = col; g.fill();
  T(letter, x + (w - h * 0.25) / 2, y + h / 2 + 1, { font: F.d(Math.round(h * 0.7)), color: "#fff", align: "center" });
}

function levelIcon(key, cx, cy, sz, color) {
  g.save(); g.translate(cx, cy); g.strokeStyle = color; g.fillStyle = color; g.lineWidth = sz * 0.14; g.lineCap = "round";
  if (key === "social") {
    g.beginPath(); g.moveTo(0, sz * 0.8); g.bezierCurveTo(-sz * 1.4, -sz * 0.1, -sz * 0.6, -sz * 1.0, 0, -sz * 0.25);
    g.bezierCurveTo(sz * 0.6, -sz * 1.0, sz * 1.4, -sz * 0.1, 0, sz * 0.8); g.fill();
  } else if (key === "mercado") {
    for (let i = 0; i < 3; i++) g.fillRect(-sz * 0.85 + i * sz * 0.62, sz * 0.7 - (i + 1) * sz * 0.5, sz * 0.46, (i + 1) * sz * 0.5);
  } else if (key === "nomadas") {
    circle(0, 0, sz * 0.8); g.stroke(); g.beginPath(); g.ellipse(0, 0, sz * 0.36, sz * 0.8, 0, 0, TAU); g.stroke();
    line(-sz * 0.8, 0, sz * 0.8, 0, color, sz * 0.14);
  } else { // referencia: una balanza
    line(0, -sz * 0.7, 0, sz * 0.7, color, sz * 0.14); line(-sz * 0.8, -sz * 0.35, sz * 0.8, -sz * 0.35, color, sz * 0.14);
    line(-sz * 0.4, sz * 0.7, sz * 0.4, sz * 0.7, color, sz * 0.14);
    g.beginPath(); g.arc(-sz * 0.6, -sz * 0.2, sz * 0.3, 0, Math.PI); g.stroke(); g.beginPath(); g.arc(sz * 0.6, -sz * 0.2, sz * 0.3, 0, Math.PI); g.stroke();
  }
  g.restore();
}

// El inquilino, un busto de color con algo que lo delata según su clave.
function tenantIcon(key, cx, cy, r) {
  const hues = { enfermeros: 190, familia: 28, opositor: 250, rider: 160, profesora: 330, ingles: 45,
    medico: 205, funcionario: 220, aleman: 100, influencer: 300, erasmus: 130, cripto: 40 };
  const hue = hues[key] ?? (hash(key) % 360);
  g.save(); g.translate(cx, cy);
  circle(0, 0, r); g.fillStyle = `hsl(${hue},55%,86%)`; g.fill();
  g.save(); circle(0, 0, r); g.clip();
  const skin = "#f0c9a4", cloth = `hsl(${hue},50%,42%)`, k = r / 30;
  g.scale(k, k);
  // hombros y cabeza
  g.beginPath(); g.ellipse(0, 27, 21, 15, 0, 0, TAU); g.fillStyle = cloth; g.fill();
  circle(0, -5, 11); g.fillStyle = skin; g.fill();
  g.beginPath(); g.arc(0, -8, 11.5, Math.PI, TAU); g.fillStyle = key === "ingles" ? "#d9d9d9" : "#4a3426"; g.fill();
  const acc = {
    enfermeros() { circle(-16, -2, 7); g.fillStyle = skin; g.fill(); circle(15, 14, 7); g.fillStyle = "#fff"; g.fill();
      g.fillStyle = C.red; g.fillRect(12, 13, 6, 2); g.fillRect(14.5, 10.5, 1.5, 7); },
    familia() { circle(-17, 8, 6); g.fillStyle = skin; g.fill(); g.beginPath(); g.ellipse(-17, 22, 8, 7, 0, 0, TAU); g.fillStyle = "#e0a030"; g.fill(); },
    opositor() { g.fillStyle = "#b3261e"; g.fillRect(-14, 14, 28, 6); g.fillStyle = "#1f6fb2"; g.fillRect(-12, 20, 26, 6); g.fillStyle = "#fff"; g.fillRect(-12, 16, 20, 1.5); },
    rider() { g.fillStyle = "#00a58e"; g.fillRect(-26, 8, 18, 22); g.fillStyle = "#fff"; g.fillRect(-22, 14, 10, 3);
      g.beginPath(); g.arc(0, -8, 13, Math.PI, TAU); g.fillStyle = "#d23a3a"; g.fill(); },
    profesora() { g.strokeStyle = "#222"; g.lineWidth = 1.6; circle(-5, -4, 4.2); g.stroke(); circle(5, -4, 4.2); g.stroke(); line(-0.8, -4, 0.8, -4, "#222", 1.6);
      g.fillStyle = "#fff"; g.fillRect(8, 12, 14, 12); g.fillStyle = "#1f6fb2"; g.fillRect(8, 12, 3, 12); },
    ingles() { g.beginPath(); g.ellipse(0, -14, 19, 5, 0, 0, TAU); g.fillStyle = "#e8d28a"; g.fill(); g.beginPath(); g.arc(0, -15, 10, Math.PI, TAU); g.fillStyle = "#e8d28a"; g.fill(); g.fillStyle = "#c0392b"; g.fillRect(-10, -17, 20, 3); },
    medico() { g.strokeStyle = "#333"; g.lineWidth = 2; g.beginPath(); g.arc(0, 14, 11, 0.1 * Math.PI, 0.9 * Math.PI); g.stroke(); circle(0, 25, 3); g.fillStyle = "#888"; g.fill();
      g.fillStyle = "#fff"; g.fillRect(-4, 14, 8, 14); },
    funcionario() { poly([[-3, 14], [3, 14], [5, 30], [0, 34], [-5, 30]], "#b3261e"); g.fillStyle = "#fff"; g.fillRect(-9, 12, 18, 3); },
    aleman() { g.fillStyle = "#cfd6de"; g.fillRect(-15, 14, 30, 16); g.fillStyle = "#4a6178"; g.fillRect(-13, 16, 26, 11); },
    influencer() { g.fillStyle = "#222"; g.fillRect(12, -2, 9, 16); g.fillStyle = "#f7b6d8"; g.fillRect(13.5, 0, 6, 11);
      starPath(-17, -14, 5, "#ffcc00"); },
    erasmus() { g.fillStyle = "#222"; g.fillRect(-15, 10, 5, 22); g.fillRect(10, 10, 5, 22); g.fillStyle = "#009246"; g.fillRect(-26, -22, 7, 12);
      g.fillStyle = "#fff"; g.fillRect(-19, -22, 7, 12); g.fillStyle = "#ce2b37"; g.fillRect(-12, -22, 7, 12); },
    cripto() { circle(14, 14, 9); g.fillStyle = "#f2a900"; g.fill(); T("B", 14, 15, { font: F.d(13), color: "#fff", align: "center" }); },
  };
  (acc[key] || (() => {}))();
  g.restore();
  g.restore();
}
function starPath(cx, cy, r, color) {
  g.beginPath();
  for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, rr_ = i % 2 ? r * 0.45 : r; g.lineTo(cx + Math.cos(a) * rr_, cy + Math.sin(a) * rr_); }
  g.closePath(); g.fillStyle = color; g.fill();
}

// Iconos pequeños para etiquetas y cajas: casa, sol, corazón, aviso, banco, visto y cruz.
function smallIcon(key, cx, cy, r, color) {
  g.save(); g.translate(cx, cy); g.fillStyle = color; g.strokeStyle = color; g.lineCap = "round"; g.lineJoin = "round";
  if (key === "house") {
    g.beginPath(); g.moveTo(-r, -r * 0.05); g.lineTo(0, -r); g.lineTo(r, -r * 0.05); g.lineTo(r * 0.7, -r * 0.05); g.lineTo(r * 0.7, r * 0.85);
    g.lineTo(-r * 0.7, r * 0.85); g.lineTo(-r * 0.7, -r * 0.05); g.closePath(); g.fill();
  } else if (key === "sun") {
    circle(0, 0, r * 0.45); g.fill(); g.lineWidth = r * 0.22;
    for (let i = 0; i < 8; i++) { const a = i * Math.PI / 4; g.beginPath(); g.moveTo(Math.cos(a) * r * 0.7, Math.sin(a) * r * 0.7); g.lineTo(Math.cos(a) * r, Math.sin(a) * r); g.stroke(); }
  } else if (key === "heart") {
    g.beginPath(); g.moveTo(0, r * 0.85); g.bezierCurveTo(-r * 1.5, -r * 0.1, -r * 0.7, -r * 1.0, 0, -r * 0.3);
    g.bezierCurveTo(r * 0.7, -r * 1.0, r * 1.5, -r * 0.1, 0, r * 0.85); g.fill();
  } else if (key === "warn") {
    g.beginPath(); g.moveTo(0, -r); g.lineTo(r, r * 0.8); g.lineTo(-r, r * 0.8); g.closePath(); g.fill();
    g.strokeStyle = "rgba(255,255,255,0.0)"; g.fillStyle = "#3a2800"; g.fillRect(-r * 0.08, -r * 0.35, r * 0.16, r * 0.6); g.fillRect(-r * 0.08, r * 0.35, r * 0.16, r * 0.16);
  } else if (key === "bank") {
    g.beginPath(); g.moveTo(-r, -r * 0.35); g.lineTo(0, -r); g.lineTo(r, -r * 0.35); g.closePath(); g.fill();
    for (let i = 0; i < 4; i++) g.fillRect(-r * 0.8 + i * r * 0.5, -r * 0.2, r * 0.26, r * 0.8);
    g.fillRect(-r, r * 0.7, r * 2, r * 0.26);
  } else if (key === "check") {

const COAST = {
  gc: [[0.52, 0.04], [0.74, 0.02], [0.88, 0.05], [0.93, 0.28], [0.9, 0.52], [0.8, 0.76], [0.64, 0.95], [0.5, 0.98],

function coastline(key, bx, by, bw, bh) {
  const base = COAST[key], r = rng(hash(key)), pts = [];
  for (let i = 0; i < base.length; i++) {
    const a = base[i], b = base[(i + 1) % base.length];

      pts.push([bx + (mx + (r() - 0.5) * 0.035) * bw, by + (my + (r() - 0.5) * 0.035) * bh]);
    }

}
function smoothPath(pts) {

  if (stroke) { g.strokeStyle = stroke; g.lineWidth = 1.5; g.stroke(); }
}

function segHitsRect(x1, y1, x2, y2, rc) {
  for (let t = 0.1; t < 1; t += 0.1) { const x = x1 + (x2 - x1) * t, y = y1 + (y2 - y1) * t; if (x > rc.x && x < rc.x + rc.w && y > rc.y && y < rc.y + rc.h) return true; }
  return false;
}
const overlap = (a, b, m = 4) => a.x < b.x + b.w + m && a.x + a.w + m > b.x && a.y < b.y + b.h + m && a.y + a.h + m > b.y;

const leaderOf = (p, rc) => [p.px, p.py, clamp(p.px, rc.x, rc.x + rc.w), clamp(p.py, rc.y, rc.y + rc.h)];
function segCross(a, b) {
  const o = (px, py, qx, qy, rx, ry) => (qx - px) * (ry - py) - (qy - py) * (rx - px);
  return o(a[0], a[1], a[2], a[3], b[0], b[1]) * o(a[0], a[1], a[2], a[3], b[2], b[3]) < 0
    && o(b[0], b[1], b[2], b[3], a[0], a[1]) * o(b[0], b[1], b[2], b[3], a[2], a[3]) < 0;
}
function pointSegDist(px, py, s) {
  const dx = s[2] - s[0], dy = s[3] - s[1], l2 = dx * dx + dy * dy || 1;
  const t = clamp(((px - s[0]) * dx + (py - s[1]) * dy) / l2, 0, 1);
  return Math.hypot(px - (s[0] + t * dx), py - (s[1] + t * dy));
}
// Los sitios posibles del rótulo de una chincheta (alrededor, cada vez más lejos), del mejor al peor:
// los que se salen de la caja, tapan el título o tapan una chincheta ya no entran.
function labelSpots(p, pins, dots, title, box) {
  const spots = [];
  for (let k = 0; k < 10; k++) {
    for (let a = 0; a < 20; a++) {
      const ang = a * TAU / 20;
      const cx = p.px + Math.cos(ang) * (p.w / 2 + 16 + k * 22), cy = p.py + Math.sin(ang) * (p.h / 2 + 12 + k * 18);
      const rc = { x: cx - p.w / 2, y: cy - p.h / 2, w: p.w, h: p.h };
      if (rc.x < box.bx + 6 || rc.x + rc.w > box.bx + box.bw - 6 || rc.y < box.by + 6 || rc.y + rc.h > box.by + box.bh - 6) continue;
      if (overlap(rc, title, 2) || dots.some((d) => overlap(rc, d, 2))) continue;
      const L = leaderOf(p, rc);
      let base = Math.hypot(L[2] - L[0], L[3] - L[1]) + Math.abs(((a + 10) % 20) - 10) * 0.5;
      for (const o of pins) if (o !== p && pointSegDist(o.px, o.py, L) < 13) base += 90; // la línea pasa sobre otra chincheta
      spots.push({ rc, L, base });
    }
  }
  return spots.sort((m, n) => m.base - n.base);
}
// Coloca los rótulos de uno en uno, cada uno en su mejor sitio libre: cerca de su chincheta y sin
// cruzar las líneas de los demás. Devuelve la colocación y lo que cuesta (0 = perfecta).
function layoutLabels(order, spots, pins, limit) {
  const placed = [];
  let total = 0;
  for (const i of order) {
    let best = null;
    for (const s of spots[i]) {
      if (best && s.base >= best.cost) break;
      if (placed.some((q) => overlap(s.rc, q.rc, 5))) continue;
      let cost = s.base;
      for (const q of placed) {
        if (segCross(s.L, q.L)) cost += 120;
        if (segHitsRect(s.L[0], s.L[1], s.L[2], s.L[3], q.rc)) cost += 120;
        if (segHitsRect(q.L[0], q.L[1], q.L[2], q.L[3], s.rc)) cost += 120;
      }
      if (!best || cost < best.cost) best = { rc: s.rc, L: s.L, cost };
    }
    if (!best) return { placed, cost: Infinity };
    total += best.cost;
    if (total >= limit) return { placed, cost: Infinity }; // ya no mejora a la mejor colocación
    placed.push({ p: pins[i], rc: best.rc, L: best.L });
  }
  return { placed, cost: total };
}

function placePins(isl, bx, by, bw, bh) {
  const pins = isl.barrios.map((b) => {
    const nameW = width(b.name, F.m(20)), chW = width(b.change, F.d(18));
    return { b, px: bx + b.x * bw, py: by + b.y * bh, w: nameW + chW + 26, h: 30, nameW };
  });
  const dots = pins.map((p) => ({ x: p.px - 15, y: p.py - 15, w: 30, h: 30 }));
  const title = { x: bx + 8, y: by + 6, w: width(isl.name, F.d(26)) + 20, h: 38 };
  const box = { bx, by, bw, bh };
  const spots = pins.map((p) => labelSpots(p, pins, dots, title, box));
  const crowd = (i) => pins.filter((q) => Math.hypot(q.px - pins[i].px, q.py - pins[i].py) < 90).length;
  const base = pins.map((_, i) => i).sort((a, b) => crowd(b) - crowd(a) || a - b);
  // Varios órdenes de colocación (los mismos en cada pintado): se queda el de menos cruces y líneas largas.
  const shuffle = rng(hash(isl.key + "pins"));
  let bestPlan = null;
  for (let attempt = 0; attempt < 60; attempt++) {
    const order = base.slice();
    if (attempt) for (let i = order.length - 1; i > 0; i--) { const j = Math.floor(shuffle() * (i + 1)); [order[i], order[j]] = [order[j], order[i]]; }
    const plan = layoutLabels(order, spots, pins, bestPlan ? bestPlan.cost : Infinity);
    if (!bestPlan || plan.cost < bestPlan.cost) bestPlan = plan;
  }
  let placed = bestPlan.placed;
  if (placed.length < pins.length) { // sin hueco para alguno: cada rótulo a la derecha de su chincheta
    placed = pins.map((p) => { const rc = { x: clamp(p.px + 18, bx + 6, bx + bw - p.w - 6), y: clamp(p.py - 15, by + 6, by + bh - 36), w: p.w, h: p.h }; return { p, rc, L: leaderOf(p, rc) }; });
  }
  // cada rótulo con su línea hasta la chincheta
  for (const { L } of placed) if (Math.hypot(L[2] - L[0], L[3] - L[1]) > 15) {
    line(L[0], L[1], L[2], L[3], "rgba(255,255,255,0.85)", 4.2); // borde claro: se ve sobre la tierra y sobre el mar
    line(L[0], L[1], L[2], L[3], "#16202b", 1.8);
    circle(L[2], L[3], 3.2); g.fillStyle = "#16202b"; g.fill();
  }
  for (const p of pins) {
    const owned = p.b.owned;
    if (owned) { circle(p.px, p.py, 17); g.fillStyle = "rgba(255,255,255,0.9)"; g.fill(); circle(p.px, p.py, 14); g.fillStyle = C.blue; g.fill(); house(p.px, p.py - 1, 7, "#fff"); }
    else { circle(p.px, p.py, 9); g.fillStyle = C.orange; g.fill(); circle(p.px, p.py, 9); g.strokeStyle = "#fff"; g.lineWidth = 2.5; g.stroke(); circle(p.px, p.py, 3); g.fillStyle = "#fff"; g.fill(); }
  }
  for (const { p, rc } of placed) {
    fillRR(rc.x, rc.y + 1.5, rc.w, rc.h, 8, "rgba(0,0,0,0.18)"); fillRR(rc.x, rc.y, rc.w, rc.h, 8, "rgba(255,255,255,0.96)");
    if (p.b.owned) { rr(rc.x, rc.y, rc.w, rc.h, 8); g.strokeStyle = C.blue; g.lineWidth = 2; g.stroke(); }
    T(p.b.name, rc.x + 9, rc.y + rc.h / 2 + 1, { font: F.m(20), color: C.ink });
    T(p.b.change, rc.x + rc.w - 9, rc.y + rc.h / 2 + 1, { font: F.d(18), color: changeColor(p.b.up, p.b.down), align: "right" });
  }
}

// Lo que cabe en la etiqueta de una fila: la frase entera y, si no entra, una más corta.
const SHORT = { vacio: "Vacío", alquilado: "Alquilado", impago: "No paga", desahucio: "Desahucio", okupa: "Okupado", habitual: "Vives aquí" };
// `compact`: dos líneas y la etiqueta a la derecha; con hipoteca lleva además una tercera con la deuda.
function itemRow(it, x, y, w, h, compact) {
  card(x, y, w, h, { r: 12 });
  const ih = h - 12, iw = compact ? Math.min(ih * 1.25, 70) : Math.min(ih * 1.4, 92);
  facade(it.kind, x + 6, y + 6, iw, ih, { key: it.key, floor: "", r: 8 });
  if (it.home) { // vives aquí: una chincheta con casa en la esquina de la fachada
    circle(x + 16, y + 16, 11); g.fillStyle = "#fff"; g.fill(); circle(x + 16, y + 16, 9); g.fillStyle = C.blue; g.fill(); house(x + 16, y + 15, 5, "#fff");
  }
  const tx = x + iw + 18, right = x + w - 14, vw = compact ? 128 : 160;
  const csize = compact ? 14 : 16, room = compact ? 150 : w - iw - 40;
  const label = it.status && width(it.status, F.d(csize)) + 24 > room ? SHORT[it.status_kind] || it.status : it.status;
  if (compact) {
    const mort = !!it.mortgage, a = mort ? 0.2 : 0.3, b = mort ? 0.55 : 0.72;
    fitText(it.title, tx, y + h * a, right - vw - tx - 8, F.m, 20, 18, { color: C.ink });
    fitText(`${it.barrio} · ${it.shares} %`, tx, y + h * b, right - vw - tx - 8, F.m, 18, 14, { color: C.mute });
    fitText(it.value, right, y + h * a, vw, F.d, 19, 12, { color: C.ink, align: "right" });
    if (label) chip(label, right, y + h * (mort ? 0.52 : 0.5) - (mort ? 13 : 0), it.status_kind, { size: csize, align: "right", maxW: 150 });
    if (mort) {
      smallIcon("bank", tx + 7, y + h * 0.82, 7, /debes/.test(it.mortgage) ? C.redDk : C.mute);
      fitText(it.mortgage, tx + 20, y + h * 0.82, right - tx - 20, F.m, 17, 12, { color: /debes/.test(it.mortgage) ? C.redDk : C.mute });
    }
    return;
  }
  fitText(it.title, tx, y + 22, right - vw - tx - 8, F.m, 22, 18, { color: C.ink });
  fitText(`${it.barrio} · ${it.shares} %`, tx, y + 49, right - vw - tx - 8, F.m, 19, 14, { color: C.mute });
  if (label) chip(label, tx, y + h - 34, it.status_kind, { size: csize, maxW: room });
  fitText(it.value, right, y + 24, vw, F.d, 23, 14, { color: C.ink, align: "right" });
  fitText(it.rent, right, y + 52, vw, F.m, 19, 13, { color: C.mute, align: "right" });
}

    pills.forEach((p, i) => chip(p.text, W - 20, pills.length === 1 ? 30 : 12 + i * 36, p.kind, { size: 17, align: "right", maxW: 500 }));
  } } : {});
  const debt = !!st.debt, lw0 = debt ? 470 : 400;

    const cols = [["Efectivo", u.cash, C.ink], ["En ladrillo", u.worth, C.blue], ["Deuda con el banco", st.debt, C.redDk]];
    const nat = cols.map(([l, v]) => Math.max(width(l, F.m(17)), width(v, F.d(23))) + 14);
    const k = Math.min(1, (lw0 - 32) / nat.reduce((a, b) => a + b, 0));
    let cx = 32;
    cols.forEach(([l, v, c], i) => { const cw = nat[i] * k; fitText(l, cx, 122, cw - 6, F.m, 17, 13, { color: C.mute }); fitText(v, cx, 152, cw - 8, F.d, 23, 12, { color: c }); cx += cw; });
  } else {
    T("Efectivo", 32, 122, { font: F.m(18), color: C.mute }); fitText(u.cash, 32, 152, 170, F.d, 25, 14, { color: C.ink });
    T("En ladrillo", 218, 122, { font: F.m(18), color: C.mute }); fitText(u.worth, 218, 152, 184, F.d, 25, 14, { color: C.blue });
  }
  const w = st.week, wx = 16 + lw0 + 16, ww = 984 - wx, wc = (ww - 32) / 4;
  card(wx, 100, ww, 78);
  T("Últimos 7 días", wx + 16, 120, { font: F.m(18), color: C.mute });
  if (st.euribor) T(st.euribor, wx + ww - 16, 120, { font: F.m(17), color: C.mute, align: "right" });
  [["Renta", w.rent, C.ink], ["IBI", w.ibi, C.redDk], ["Gastos", w.costs, C.redDk], ["Neto", w.net, C.greenDk]].forEach(([l, v, c], i) => {
    const x = wx + 16 + i * wc;
    T(l, x, 142, { font: F.m(17), color: C.mute }); fitText(v, x, 164, wc - 8, F.d, 19, 12, { color: c });
  });
  if (st.empty) {
    card(16, 192, 520, 408); sofaRoom(16, 192, 520, 408);
    paragraph("Generación inquilina", 560, 270, 424, F.d(46), 54, 2, { color: C.ink });
    paragraph("Vives con tus padres. Compra tu primera participación desde 1 %", 560, 392, 424, F.m(26), 36, 4, { color: C.mute });
    fillRR(560, 540, 330, 52, 26, C.orange); T("Elige un barrio y empieza", 725, 567, { font: F.d(19), color: "#fff", align: "center" });
    return;
  }
  // Las filas con hipoteca llevan una línea más y necesitan alto: si no caben con la franja de «Última hora»,
  // se quita la franja; si aun así no caben, se enseñan menos y el resto va a «y N más».
  const hasMort = st.items.some((it) => it.mortgage), minH = hasMort ? 68 : 44;
  let count = Math.min(st.items.length, 10), layout;
  for (; count >= 1; count--) {
    const more = st.items.length - count, many = count > 5, rows = Math.ceil(count / (many ? 2 : 1)), gap = many ? 8 : 10;
    for (const withNews of st.news.length ? [true, false] : [false]) {
      const bottom = many ? (withNews ? 540 : more ? 570 : 604) : 604;
      const rh = clamp(Math.floor((bottom - 192 - gap * (rows - 1)) / rows), 44, 96);
      layout = { count, more, many, rows, gap, rh, withNews };
      if (rh >= minH) break;
    }
    if (layout.rh >= minH) break;
  }
  const { more, many, rows, gap, rh, withNews } = layout;
  const items = st.items.slice(0, layout.count), top = 192;
  const hasNews = st.news.length > 0 && (many ? withNews : true);
  const lw = many ? 476 : hasNews ? 620 : 968;
  items.forEach((it, i) => {

    itemRow(it, 16 + col * (lw + 16), top + r * (rh + gap), lw, rh, rh < 70 || hasMort);
  });
  const news = st.news.map((raw) => { const i = raw.indexOf(" · "); return i > 0 ? [raw.slice(0, i), raw.slice(i + 3)] : ["", raw]; });
  if (more && !(many && hasNews)) T(`y ${more} más`, 984, many ? 588 : 620, { font: F.m(20), color: C.mute, align: "right" });
  if (!hasNews) return;
  if (!many) {
    card(652, 192, 332, 412); T("Últimas noticias", 668, 214, { font: F.m(19), color: C.mute });
    let ny = 244;
    for (const [date, text] of news) {
      const lines = wrap(text, 250, F.r(20), 3);
      if (ny + lines.length * 24 > 596) break;
      T(date, 668, ny + 9, { font: F.d(16), color: C.orange });
      lines.forEach((l, k) => T(l, 722, ny + 9 + k * 24, { font: F.r(20), color: C.ink }));
      ny += lines.length * 24 + 10;
    }
  } else {
    card(16, 552, 968, 52); T("Última hora", 32, 578, { font: F.m(18), color: C.mute });
    T(news[0][0], 160, 578, { font: F.d(16), color: C.orange });
    fitText(news[0][1], 222, 578, more ? 640 : 750, F.r, 20, 14, { color: C.ink });
    if (more) T(`y ${more} más`, 972, 578, { font: F.m(20), color: C.mute, align: "right" });
  }
}

// VPO ------------------------------------------------------------------------------------

// Las dos comprobaciones de la VPO las decide housing_view (`income_ok`, `home_ok`).
function vpoChecks(u) {
  return [u.income_ok ?? u.eligible, u.home_ok ?? u.eligible];
}

function vpoRow(un, x, y, w, h) {
  card(x, y, w, h, { r: 10 });
  const ih = h - 8, iw = Math.round(ih * 1.5);
  facade("vpo", x + 4, y + 4, iw, ih, { key: "vpo:" + un.key, floor: "", r: 7 });
  const tx = x + iw + 18, right = x + w - 14, pw = 150;
  const cmax = 330, cs = 15;
  const cw = Math.min(cmax, width(un.status, F.d(cs)) + 22);
  const cx = right - pw - 14 - cw;
  chip(un.status, cx, y + (h - (cs + 14)) / 2, un.status_kind, { size: cs, maxW: cmax, outline: un.status_kind === "compartido" });
  const room = cx - 14 - tx;
  fitText(un.name, tx, y + h * 0.32, room, F.m, 22, 16, { color: C.ink });
  fitText(`${un.town} · ${un.island} · ${un.m2}`, tx, y + h * 0.74, room, F.m, 17, 12, { color: C.mute });
  fitText(un.price, right, y + h * 0.32, pw, F.d, 22, 14, { color: C.ink, align: "right" });
  fitText(un.payment, right, y + h * 0.74, pw, F.m, 17, 12, { color: C.mute, align: "right" });
}

function paintVpo(st) {
  header(st.title, st.subtitle);
  const u = st.user, n = st.units.length, res = !!u.reservation;
  const UH = 124, banner = res ? 50 : 0, bottom = 606, userTop = bottom - UH - banner - (res ? 8 : 0);
  const gap = 6, rh = clamp(Math.floor((userTop - 10 - 100 - gap * (n - 1)) / n), 44, 62);
  st.units.forEach((un, i) => vpoRow(un, 16, 100 + i * (rh + gap), 968, rh));
  let y = bottom - UH - banner - (res ? 8 : 0);
  if (res) { // te ha tocado: el aviso más grande de la pantalla
    fillRR(16, y, 968, banner, 12, "#fff3c4"); rr(16, y, 968, banner, 12); g.strokeStyle = C.amber; g.lineWidth = 3; g.stroke();
    starPath(52, y + banner / 2 + 1, 17, C.amber);
    fitText(`¡Te ha tocado ${u.reservation}! Cómprala antes de que caduque`, 84, y + banner / 2 + 1, 968 - 84 - 20, F.d, 25, 15, { color: "#5a3a00" });
    y += banner + 8;
  }
  // lo tuyo: apuntado o no, las dos comprobaciones y el motivo si no puedes
  card(16, y, 580, UH);
  const inn = u.signed_up;
  circle(44, y + 27, 14); g.fillStyle = inn ? C.green : C.grey; g.fill();
  smallIcon(inn ? "check" : "cross", 44, y + 27, 9, "#fff");
  fitText(inn ? "Estás apuntado/a al sorteo" : "No estás apuntado", 68, y + 27, 508, F.d, 24, 16, { color: inn ? C.greenDk : C.ink });
  const [incomeOk, homeOk] = vpoChecks(u);
  tick(incomeOk, 34, y + 58, 10); fitText(`Ingresos ${u.income} (límite ${u.cap})`, 54, y + 58, 530, F.m, 20, 13, { color: C.ink });
  tick(homeOk, 34, y + 84, 10); T("Sin vivienda propia", 54, y + 84, { font: F.m(20), color: C.ink });
  if (u.reason && !u.eligible) fitText(u.reason, 30, y + 110, 548, F.d, 19, 13, { color: C.redDk });
  // el sorteo
  card(612, y, 372, UH);
  T("Próximo sorteo", 630, y + 24, { font: F.m(18), color: C.mute });
  fitText(st.next_draw, 630, y + 54, 336, F.d, 28, 16, { color: C.ink });
  fitText(`${u.signups} apuntados`, 630, y + 84, 336, F.m, 21, 14, { color: C.ink });
  if (st.euribor) T(st.euribor, 966, y + 108, { font: F.m(17), color: C.mute, align: "right" });
}

// CAJA ----------------------------------------------------------------------------------

function paintCaja(st) {
  header("Notaría", st.selling ? "Venta de participaciones" : "Compra de participaciones");
  const tx = 216, tw = 568, ty = 98, th = 510, left = tx + 30, right = tx + tw - 26;
  // el papel, con los bordes dentados y una raya naranja
  const jag = (y0, dir) => { for (let x = tx; x < tx + tw; x += 20) poly([[x, y0], [x + 10, y0 + dir * 9], [x + 20, y0]], "#fff"); };
  fillRR(tx + 4, ty + 7, tw, th, 4, "rgba(22,32,43,0.14)");
  rect(tx, ty + 9, tw, th - 18, "#fff"); jag(ty + 9, -1); jag(ty + th - 9, 1);
  rect(tx, ty + 9, 6, th - 18, C.orange);
  // a los lados: la fachada y, si hay impuestos, Perro Sanxe cobrándolos
  card(16, 130, 188, 150); facade(st.kind, 16, 130, 188, 150, { key: "caja_" + st.barrio, r: 14 });
  fitText(st.barrio, 110, 304, 184, F.d, 22, 14, { color: C.ink, align: "center" });
  if (st.lines.some((l) => l.type === "tax")) {
    card(796, 130, 188, 150); dog(890, 190, 38);
    fitText("Perro Sanxe", 890, 248, 176, F.d, 21, 13, { color: C.ink, align: "center" });
    fitText("cobra su parte", 890, 268, 176, F.m, 18, 13, { color: C.mute, align: "center" });
  }
  let y = ty + 34;
  fitText(st.selling ? "ESCRITURA DE VENTA" : "ESCRITURA DE COMPRAVENTA", tx + tw / 2, y, tw - 60, F.d, 25, 15, { color: C.ink, align: "center" });
  y += 20; g.save(); g.setLineDash([6, 5]); line(left, y, right, y, "#9aa6b3", 1.6); g.restore();
  y += 22;
  const tl = wrap(st.title, right - left, F.m(23), 2);
  tl.forEach((l, i) => T(l, left, y + i * 26, { font: F.m(23), color: C.ink }));
  y += (tl.length - 1) * 26 + 25;
  T(st.barrio, left, y, { font: F.m(20), color: C.mute });
  y += 24;
  // lo que queda de papel se reparte entre las filas; con sello se deja sitio abajo
  const note = wrap(st.note, right - left, F.r(21), 2);
  const stampH = st.stamp ? 92 : 0;
  const tail = 52 + 20 + note.length * 25 + 8;
  const weights = st.lines.map((l) => (l.type === "tax" ? 1.55 : l.type === "total" ? 1.3 : 1));
  const unit = clamp((ty + th - 14 - stampH - tail - y - 14) / (weights.reduce((a, b) => a + b, 0) || 1), 30, 40);
  st.lines.forEach((l, i) => {
    const total = l.type === "total", tax = l.type === "tax", rowH = unit * weights[i];
    if (total) { y += 6; rect(left, y, right - left, 3, C.ink); y += 6; }
    const cy = y + rowH / 2, lx = left + (tax ? 34 : 0);
    const amountW = Math.max(120, width(l.amount, total ? F.d(27) : F.d(22)) + 6);
    if (tax) dog(left + 14, cy, 14);
    const colour = tax ? C.redDk : C.ink;
    fitText(l.label, lx, tax ? cy - 8 : cy, right - lx - amountW - 12, total ? F.d : F.m, total ? 25 : 22, 15, { color: colour });
    if (tax) T("Perro Sanxe", lx, cy + 13, { font: F.m(16), color: C.redDk });
    fitText(l.amount, right, cy, amountW, F.d, total ? 27 : 22, 14, { color: colour, align: "right" });
    y += rowH;
  });
  // saldo antes y después
  y += 8;
  fillRR(left - 6, y, right - left + 12, 52, 10, st.short ? "#fdecea" : "#eef3f8");
  const mid = y + 26, after = st.after, aw = width(after, F.d(26));
  T("Saldo", left + 8, mid, { font: F.m(20), color: C.mute });
  T(after, right - 8, mid, { font: F.d(26), color: st.short ? C.redDk : C.greenDk, align: "right" });
  T("→", right - 8 - aw - 16, mid, { font: F.d(22), color: C.mute, align: "right" });
  T(st.balance, right - 8 - aw - 42, mid, { font: F.m(22), color: C.mute, align: "right" });
  y += 52 + 20;
  note.forEach((l, i) => T(l, left, y + i * 25, { font: F.r(21), color: C.mute, skew: true }));
  if (st.stamp) {
    g.save(); g.translate(tx + tw / 2 + 24, ty + th - 14 - stampH / 2 - 4); g.rotate(-0.13); g.globalAlpha = 0.9;
    const [word, z] = fit(st.stamp, 380, F.d, 52, 30), sw = width(word, F.d(z)) + 50, sh = z * 1.5;
    g.strokeStyle = "#c9302c"; g.lineWidth = 6; rr(-sw / 2, -sh / 2, sw, sh, 12); g.stroke();
    g.lineWidth = 2; rr(-sw / 2 + 10, -sh / 2 + 10, sw - 20, sh - 20, 7); g.stroke();
    T(word, 0, 3, { font: F.d(z), color: "#c9302c", align: "center" });
    g.restore();
  }
}

// -- Entrada ------------------------------------------------------------------------------

const SCREENS = { mapa: paintMapa, barrio: paintBarrio, ficha: paintFicha, cartera: paintCartera, caja: paintCaja, vpo: paintVpo };

function paintScreen(st) {
  const draw = SCREENS[st.screen];
  if (!draw) throw new Error(`Pantalla desconocida: ${st.screen}`);
  g.setTransform(S, 0, 0, S, 0, 0);
  g.clearRect(0, 0, W, H);
  g.lineCap = "butt"; g.lineJoin = "miter"; g.globalAlpha = 1; g.setLineDash([]);
  rect(0, 0, W, H, C.bg);
  draw(st);
  footer(st.footer);
}

function frame(st) {
  paintScreen(st);
  octx.clearRect(0, 0, W, H);
  octx.imageSmoothingEnabled = true; octx.imageSmoothingQuality = "high";
  octx.drawImage(big, 0, 0, W * S, H * S, 0, 0, W, H);
  return { x: 0, y: 0, u: window.exportFrame(out) };
}

// En Chromium cada pantalla va como data URL de PNG; el pintor de Node
// (assets/escena_node.cjs) pone su exportFrame, que devuelve los píxeles tal cual.
window.exportFrame ??= (canvas) => canvas.toDataURL("image/png");
window.loadFonts = async () => {
  await Promise.all([document.fonts.load("700 20px Montserrat"), document.fonts.load("20px RobotoM"), document.fonts.load("20px RobotoR")]);
  await document.fonts.ready;
  return true;
};
// Sin estado entre pantallas: cada una se pinta entera, así que no hay nada que reiniciar.
window.setup = async (meta) => true;
window.renderFrames = (states, first = 0) => states.map((st) => frame(st));
</script>
