<!doctype html>
<!--
Escena de «Allá tú», dibujada con canvas. La pinta Node con Skia
(assets/escena_node.cjs) y, si no hay Node, un Chromium sin ventana (ver
bot/services/allatu_scene.py).

No decide nada: Python le pasa en cada fotograma qué se ve y aquí solo se pinta
(bot/services/allatu_scene.py: `opening_states`, `open_states`, `call_states`,
`deal_states`, `haggle_states`, `final_states`, `rest_state`, `board_state`).
Funciones que llama Python:

- loadFonts()                  espera a las fuentes (canvas no las carga solo).
- setup(meta)                  mesa, apuesta y gordo de la partida.
- renderFrames(states, first)  dibuja los fotogramas y devuelve cada uno entero.

Cuatro vistas, todas en el plató (azul noche y morado, focos, neones, suelo
brillante) con el logo «ALLÁ TÚ»:

- "board":  las 22 cajas en rejilla (cerrada, abierta con su premio o el hueco de
            la tuya), tu caja en su atril, las ofertas de la banca, el resultado
            al acabar y, a la derecha, la escalera de premios (22 placas).
- "wheel":  la ruleta del gordo: un rodillo dorado con bombillas y 3 casillas.
- "open":   una caja enorme sobre su pedestal que tiembla, se abre y deja subir
            la placa del premio.
- "call":   la cabina de Perro Sanxe: su silueta tras el cristal, el teléfono rojo
            de dial, el marcador LED, el bocadillo, el sello y la lluvia de monedas.
- "final":  las dos últimas cajas en sus atriles, que se cruzan si cambias.

Lo que falta en un estado vale 0, salvo lo que ya está en su sitio por defecto:
`zoom` (la caja a tamaño completo) e `intro` (las cajas ya dentro). Con `fade`
(negro), `flash` ([r,g,b,a]) y `banner` encima de todo.

Lo fijo (fondo, cajas, placas, logo, teléfono, cabina) se pinta una vez en un
lienzo y se copia en cada fotograma; por fotograma solo va lo que se mueve. Todo se
dibuja al doble (S = 2) y se reduce al copiarlo. Sin emojis: el Chromium del Docker
no trae su fuente. Nada de Math.random: el azar sale de `rng(semilla)` y del reloj
`t` de cada estado, así que cada proceso pinta lo mismo y cada fotograma se pinta
sin depender de otro.
-->
<html lang="es">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: "Luckiest"; src: url("../botes/fonts/luckiest-guy.woff"); }
  @font-face { font-family: "Montserrat"; src: url("../memes/fonts/MontserratBold.ttf"); font-weight: 700; }
  html, body { margin: 0; padding: 0; background: transparent; }
</style>
</head>
<body>
<script>
"use strict";
const S = 2;
const W = 640, H = 360;
const PNL = { x: 444, y: 6, w: 190, h: 346 };     // escalera de premios
const PLW = 86, PLH = 25, PITCH = 28.2;             // placa de la escalera
const TAU = Math.PI * 2;

const TIER = {
  gordo: { a: "#fff0a0", b: "#ffc21a", c: "#a86400", ink: "#4a2800", glow: "#ffd54a" },
  rojo: { a: "#ff9a5a", b: "#e0281e", c: "#6a0808", ink: "#ffffff", glow: "#ff6a3a" },
  azul: { a: "#8cc8ff", b: "#2f6fe0", c: "#102a72", ink: "#ffffff", glow: "#5aa8ff" },
  cero: { a: "#8e9ab4", b: "#434d66", c: "#1a2030", ink: "#dfe5f4", glow: "#9aa8c8" },
};
const BANNER = {
  good: { t: ["#e4ffc8", "#4ee06e", "#14902e"], line: "#0a3a1a", rib: ["#2cb04e", "#0e6a2a"], edge: "#d6ffb0" },
  bad: { t: ["#ffd2c0", "#ff5040", "#a41212"], line: "#3a0808", rib: ["#d03030", "#7a0c0c"], edge: "#ffc0a8" },
  gordo: { t: ["#fffad0", "#ffd23a", "#d88400"], line: "#4a2400", rib: ["#f0b020", "#a86400"], edge: "#fff2a8" },
  deal: { t: ["#fffad0", "#ffd23a", "#d88400"], line: "#5a2e00", rib: ["#e8a010", "#8a5000"], edge: "#ffe890" },
  hang: { t: ["#f4f4fa", "#aeb0c2", "#62667e"], line: "#1a1c28", rib: ["#6a6e86", "#363a50"], edge: "#d0d2e0" },
  info: { t: ["#d8f0ff", "#5ab4ff", "#1f64c8"], line: "#0a1c4a", rib: ["#2f7ae0", "#15408c"], edge: "#bfe2ff" },
};

const big = document.createElement("canvas"); big.width = W * S; big.height = H * S;
const g = big.getContext("2d");
const out = document.createElement("canvas"); out.width = W; out.height = H;
const octx = out.getContext("2d");

let META = null;
const SPRITES = new Map();               // todo lo fijo, por clave

const lerp = (a, b, t) => a + (b - a) * t;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const ease = (t) => (t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2);
const easeOut = (t) => 1 - Math.pow(1 - t, 3);
const backOut = (t) => 1 + 2.70158 * Math.pow(t - 1, 3) + 1.70158 * Math.pow(t - 1, 2);
function rng(seed) {
  return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
function rgbOf(c) {
  if (c[0] === "#") { const n = parseInt(c.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
  return c.match(/[\d.]+/g).slice(0, 3).map(Number);
}
function hexOf(v) { return "#" + v.map((n) => Math.round(clamp(n, 0, 255)).toString(16).padStart(2, "0")).join(""); }
function mix(a, b, t) { const x = rgbOf(a), y = rgbOf(b); return hexOf(x.map((v, i) => lerp(v, y[i], t))); }
function shade(c, k) { return k >= 0 ? mix(c, "#ffffff", k) : mix(c, "#000000", -k); }
function rgba(c, a) { const [r, gg, b] = rgbOf(c); return `rgba(${r},${gg},${b},${a})`; }
function linear(x, x0, y0, x1, y1, stops) {
  const gr = x.createLinearGradient(x0, y0, x1, y1); stops.forEach(([o, c]) => gr.addColorStop(o, c)); return gr;
}
function radial(x, cx, cy, r0, r1, stops) {
  const gr = x.createRadialGradient(cx, cy, r0, cx, cy, r1); stops.forEach(([o, c]) => gr.addColorStop(o, c)); return gr;
}
function goldGrad(x, y0, y1) { return linear(x, 0, y0, 0, y1, [[0, "#fffadc"], [0.4, "#ffd54a"], [0.55, "#f0b42a"], [1, "#a86a0a"]]); }
function layer(w, h) {
  const c = document.createElement("canvas"); c.width = Math.ceil(w * S); c.height = Math.ceil(h * S);
  const x = c.getContext("2d"); x.setTransform(S, 0, 0, S, 0, 0); return [c, x];
}
function cached(key, paint) {
  let c = SPRITES.get(key);
  if (!c) { c = paint(); SPRITES.set(key, c); if (SPRITES.size > 420) SPRITES.delete(SPRITES.keys().next().value); }
  return c;
}
// Un dibujo fijo de w×h con `pad` de margen, listo para copiar con `blit`.
function sprite(key, w, h, pad, paint) {
  return cached(key, () => {
    const [c, x] = layer(w + 2 * pad, h + 2 * pad); x.translate(pad, pad); paint(x);
    return { c, w: w + 2 * pad, h: h + 2 * pad, pad };
  });
}
function blit(sp, X, Y, a = 1) {
  if (a <= 0) return;
  if (a < 1) g.globalAlpha = a;
  g.drawImage(sp.c, X - sp.pad, Y - sp.pad, sp.w, sp.h);
  if (a < 1) g.globalAlpha = 1;
}
function roundRect(x, X, Y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  x.beginPath(); x.moveTo(X + r, Y); x.arcTo(X + w, Y, X + w, Y + h, r); x.arcTo(X + w, Y + h, X, Y + h, r);
  x.arcTo(X, Y + h, X, Y, r); x.arcTo(X, Y, X + w, Y, r); x.closePath();
}
function poly(x, pts) { x.beginPath(); pts.forEach(([a, b], i) => (i ? x.lineTo(a, b) : x.moveTo(a, b))); x.closePath(); }
function blur(x, color, b, dy = 0) { x.shadowColor = color; x.shadowBlur = b * S; x.shadowOffsetX = 0; x.shadowOffsetY = dy * S; }
function noBlur(x) { x.shadowColor = "rgba(0,0,0,0)"; x.shadowBlur = 0; x.shadowOffsetY = 0; }
const LUCK = (px) => `${px}px Luckiest`;
const MONT = (px) => `700 ${px}px Montserrat`;
function text(x, str, X, Y, { font, fill, stroke, width = 0, align = "center", base = "middle", drop, spacing }) {
  x.save();
  x.font = font; x.textAlign = align; x.textBaseline = base; x.lineJoin = "round";
  if (spacing && "letterSpacing" in x) x.letterSpacing = spacing + "px";
  if (drop) {
    x.fillStyle = drop; x.strokeStyle = drop; x.lineWidth = width;
    if (stroke) x.strokeText(str, X, Y + 2); x.fillText(str, X, Y + 2);
  }
  if (stroke) { x.lineWidth = width; x.strokeStyle = stroke; x.strokeText(str, X, Y); }
  x.fillStyle = fill; x.fillText(str, X, Y);
  x.restore();
}
// Tamaño de fuente que cabe en `maxW` (sin pasarse de `size`).
function fit(x, str, face, size, maxW) {
  x.font = face(size); const w = x.measureText(str).width;
  return w > maxW ? Math.max(5, size * maxW / w) : size;
}
function sparkle(x, sx, sy, s, color = "rgba(255,250,215,0.95)") {
  x.fillStyle = color; x.beginPath();
  x.moveTo(sx, sy - s * 1.7); x.quadraticCurveTo(sx, sy, sx + s * 1.7, sy); x.quadraticCurveTo(sx, sy, sx, sy + s * 1.7);
  x.quadraticCurveTo(sx, sy, sx - s * 1.7, sy); x.quadraticCurveTo(sx, sy, sx, sy - s * 1.7); x.fill();
}
function star(x, cx, cy, r, ri, n = 5, rot = -Math.PI / 2) {
  x.beginPath();
  for (let i = 0; i < n * 2; i++) {
    const a = rot + (i * Math.PI) / n, rr = i % 2 ? ri : r;
    i ? x.lineTo(cx + Math.cos(a) * rr, cy + Math.sin(a) * rr) : x.moveTo(cx + Math.cos(a) * rr, cy + Math.sin(a) * rr);
  }
  x.closePath();
}
// Haz de foco de (ax,ay) a la base (bx,by) de media anchura hw.
function cone(x, ax, ay, bx, by, hw, col, a) {
  const dx = bx - ax, dy = by - ay, len = Math.hypot(dx, dy), nx = -dy / len, ny = dx / len;
  x.fillStyle = linear(x, ax, ay, bx, by, [[0, rgba(col, a)], [0.6, rgba(col, a * 0.45)], [1, rgba(col, 0)]]);
  x.beginPath(); x.moveTo(ax - nx * 2, ay - ny * 2); x.lineTo(ax + nx * 2, ay + ny * 2);
  x.lineTo(bx + nx * hw, by + ny * hw); x.lineTo(bx - nx * hw, by - ny * hw); x.closePath(); x.fill();
}
// Abanico de rayos desde (cx,cy); todos en un solo trazo.
function rays(x, cx, cy, len, n, rot, width, col, a) {
  x.save(); x.globalCompositeOperation = "lighter";
  x.fillStyle = radial(x, cx, cy, 4, len, [[0, rgba(col, a)], [0.55, rgba(col, a * 0.4)], [1, rgba(col, 0)]]);
  x.beginPath();
  for (let i = 0; i < n; i++) {
    const an = rot + (i * TAU) / n;
    x.moveTo(cx, cy); x.lineTo(cx + Math.cos(an - width) * len, cy + Math.sin(an - width) * len);
    x.lineTo(cx + Math.cos(an + width) * len, cy + Math.sin(an + width) * len); x.closePath();
  }
  x.fill(); x.restore();
}

// -- Plató ------------------------------------------------------------------------------

const HORIZ = 268;                       // donde la pared toca el suelo
const LAMPS = [48, 136, 224, 320, 416, 504, 592];

function paintStudio(x, dark) {
  x.fillStyle = linear(x, 0, 0, 0, HORIZ, [[0, dark ? "#03030f" : "#070722"], [0.5, dark ? "#0a0620" : "#1a0f48"], [1, dark ? "#160830" : "#2e1262"]]);
  x.fillRect(0, 0, W, HORIZ);
  // Resplandores de colores al fondo.
  x.save(); x.globalCompositeOperation = "lighter";
  x.fillStyle = radial(x, 110, 130, 10, 260, [[0, "rgba(255,40,150,0.30)"], [1, "rgba(255,40,150,0)"]]); x.fillRect(0, 0, W, HORIZ);
  x.fillStyle = radial(x, 540, 120, 10, 260, [[0, "rgba(40,190,255,0.26)"], [1, "rgba(40,190,255,0)"]]); x.fillRect(0, 0, W, HORIZ);
  x.fillStyle = radial(x, 320, 250, 10, 300, [[0, "rgba(160,90,255,0.28)"], [1, "rgba(160,90,255,0)"]]); x.fillRect(0, 0, W, HORIZ);
  x.restore();
  // Paneles de pantalla LED del fondo.
  for (let i = 0; i < 20; i++) {
    x.fillStyle = `rgba(255,255,255,${i % 2 ? 0.018 : 0.04})`; x.fillRect(i * 32, 14, 32, HORIZ - 14);
  }
  x.fillStyle = "rgba(255,255,255,0.05)";
  for (let yy = 30; yy < HORIZ; yy += 14) x.fillRect(0, yy, W, 0.6);
  // Arcos de neón detrás del presentador.
  x.save(); x.lineWidth = 3;
  blur(x, "rgba(255,50,170,0.95)", 10); x.strokeStyle = "rgba(255,90,190,0.8)";
  x.beginPath(); x.ellipse(W / 2, HORIZ + 20, 320, 232, 0, Math.PI, TAU); x.stroke();
  blur(x, "rgba(60,210,255,0.95)", 10); x.strokeStyle = "rgba(110,225,255,0.8)";
  x.beginPath(); x.ellipse(W / 2, HORIZ + 20, 296, 208, 0, Math.PI, TAU); x.stroke();
  noBlur(x); x.restore();
  // Focos: haces suaves desde la cercha.
  x.save(); x.globalCompositeOperation = "lighter";
  const cols = ["#fff4d8", "#ff5ab8", "#5ad4ff", "#ffd54a", "#5ad4ff", "#ff5ab8", "#fff4d8"];
  LAMPS.forEach((lx, i) => cone(x, lx, 12, lx + (i - 3) * 46, HORIZ + 20, 40 + (i % 2) * 14, cols[i], dark ? 0.2 : 0.17));
  x.restore();
  // Cercha con focos.
  x.fillStyle = linear(x, 0, 0, 0, 13, [[0, "#06061a"], [0.5, "#2a2a4e"], [1, "#0c0c26"]]); x.fillRect(0, 0, W, 13);
  x.fillStyle = "rgba(255,255,255,0.25)"; x.fillRect(0, 1.5, W, 0.8);
  for (let xx = 0; xx < W; xx += 14) { x.fillStyle = "rgba(120,130,190,0.45)"; x.fillRect(xx, 4, 1, 8); }
  LAMPS.forEach((lx, i) => {
    x.fillStyle = "#101026"; roundRect(x, lx - 7, 8, 14, 9, 2); x.fill();
    x.fillStyle = radial(x, lx, 16, 0, 9, [[0, "#ffffff"], [0.5, rgba(cols[i], 0.9)], [1, rgba(cols[i], 0)]]);
    x.fillRect(lx - 9, 8, 18, 16);
  });
  // Tiras de neón en los lados.
  x.save();
  for (const [nx, c] of [[5, "#ff3aa8"], [W - 5, "#3ad2ff"], [13, "#3ad2ff"], [W - 13, "#ff3aa8"]]) {
    blur(x, c, 8); x.fillStyle = c; x.fillRect(nx - 1.2, 20, 2.4, HORIZ - 24);
    noBlur(x); x.fillStyle = "rgba(255,255,255,0.8)"; x.fillRect(nx - 0.4, 20, 0.8, HORIZ - 24);
  }
  x.restore();
  // Suelo brillante.
  x.fillStyle = linear(x, 0, HORIZ, 0, H, [[0, dark ? "#0a0620" : "#1c0d42"], [0.35, "#0c0724"], [1, "#04030e"]]);
  x.fillRect(0, HORIZ, W, H - HORIZ);
  x.save(); x.beginPath(); x.rect(0, HORIZ, W, H - HORIZ); x.clip();
  x.strokeStyle = "rgba(140,120,255,0.13)"; x.lineWidth = 0.8;
  for (let i = -14; i <= 14; i++) { x.beginPath(); x.moveTo(W / 2 + i * 26, HORIZ); x.lineTo(W / 2 + i * 120, H); x.stroke(); }
  for (let k = 1; k < 6; k++) { const yy = HORIZ + Math.pow(k / 6, 1.7) * (H - HORIZ); x.beginPath(); x.moveTo(0, yy); x.lineTo(W, yy); x.stroke(); }
  // Reflejo de los focos en el suelo.
  x.globalCompositeOperation = "lighter";
  LAMPS.forEach((lx, i) => cone(x, lx + (i - 3) * 46, HORIZ + 4, lx + (i - 3) * 62, H + 30, 46, cols[i], 0.09));
  x.fillStyle = radial(x, W / 2, HORIZ + 36, 10, 300, [[0, "rgba(180,150,255,0.30)"], [1, "rgba(180,150,255,0)"]]);
  x.save(); x.translate(W / 2, HORIZ + 36); x.scale(1, 0.22); x.translate(-W / 2, -HORIZ - 36); x.fillRect(0, HORIZ - 400, W, 900); x.restore();
  x.restore();
  // Línea de neón entre pared y suelo.
  x.save(); blur(x, "rgba(255,60,180,1)", 9); x.fillStyle = "#ff6ac8"; x.fillRect(0, HORIZ - 1, W, 2.2);
  blur(x, "rgba(60,210,255,1)", 9); x.fillStyle = "#7ae0ff"; x.fillRect(0, HORIZ + 3, W, 1.4); noBlur(x); x.restore();
  x.fillStyle = "rgba(255,255,255,0.7)"; x.fillRect(0, HORIZ - 0.2, W, 0.7);
  // Viñeta.
  x.fillStyle = radial(x, W / 2, H / 2, 150, 420, [[0, "rgba(0,0,0,0)"], [1, "rgba(0,0,6,0.55)"]]); x.fillRect(0, 0, W, H);
}
function studio(dark = false) {
  return cached("studio" + dark, () => { const [c, x] = layer(W, H); paintStudio(x, dark); return c; });
}
let DUST = null;
function drawStudio(st, dark = false) {
  g.drawImage(studio(dark), 0, 0, W, H);
  const t = st.t || 0;
  // Dos haces que barren el plató.
  g.save(); g.globalCompositeOperation = "lighter";
  for (let i = 0; i < 2; i++) {
    const ax = i ? 560 : 80, an = Math.sin(t * 0.09 + i * 2.4) * 0.35 + (i ? -0.28 : 0.28);
    cone(g, ax, 12, ax + Math.sin(an) * 260, 12 + Math.cos(an) * 260, 26, i ? "#7ae0ff" : "#ff8ad8", 0.1);
  }
  g.restore();
  // Polvo brillante, siempre en el mismo sitio y parpadeando con el reloj.
  if (!DUST) { const r = rng(31); DUST = Array.from({ length: 26 }, () => ({ x: r() * W, y: 18 + r() * 330, p: r() * 6.28, s: 0.7 + r() * 1.2, v: 0.3 + r() * 0.5, c: r() })); }
  for (const d of DUST) {
    const a = 0.5 + 0.5 * Math.sin(t * 0.55 + d.p);
    if (a < 0.2) continue;
    const yy = ((d.y - t * d.v) % 340 + 340) % 340 + 14;
    g.globalAlpha = a * 0.8;
    sparkle(g, d.x, yy, d.s * (0.6 + a * 0.5), d.c < 0.5 ? "rgba(255,246,210,1)" : d.c < 0.8 ? "rgba(255,170,230,1)" : "rgba(160,235,255,1)");
  }
  g.globalAlpha = 1;
}

// -- Logo y rótulos ---------------------------------------------------------------------

function logo(scale = 1) {
  return sprite("logo" + scale, 150 * scale, 46 * scale, 10, (x) => {
    x.scale(scale, scale); x.save(); x.translate(75, 24); x.rotate(-0.045);
    blur(x, "rgba(255,200,60,0.6)", 7);
    text(x, "ALLÁ TÚ", 0, 0, { font: LUCK(35), fill: "#000", stroke: "#2a0a3c", width: 10 });
    noBlur(x);
    text(x, "ALLÁ TÚ", 0, 0, { font: LUCK(35), fill: "#000", stroke: "#fff4c0", width: 6.5 });
    text(x, "ALLÁ TÚ", 0, 0, { font: LUCK(35), fill: "#000", stroke: "#3a0b4a", width: 4.5 });
    text(x, "ALLÁ TÚ", 0, 0, { font: LUCK(35), fill: linear(x, 0, -17, 0, 17, [[0, "#fffbe0"], [0.35, "#ffd54a"], [0.55, "#f2a416"], [1, "#b8620a"]]) });
    x.globalCompositeOperation = "source-atop";
    x.fillStyle = "rgba(255,255,255,0.45)"; poly(x, [[-40, -20], [-26, -20], [-44, 20], [-58, 20]]); x.fill();
    x.fillStyle = "rgba(255,255,255,0.3)"; poly(x, [[20, -20], [26, -20], [8, 20], [2, 20]]); x.fill();
    x.restore();
  });
}
function drawLogo(st, X = 6, Y = 2, scale = 1) {
  blit(logo(scale), X, Y);
  const t = st.t || 0, a = 0.5 + 0.5 * Math.sin(t * 0.4);
  g.globalAlpha = a; sparkle(g, X + 28 * scale, Y + 8 * scale, 2.6 * scale); g.globalAlpha = 1;
  g.globalAlpha = 1 - a; sparkle(g, X + 128 * scale, Y + 30 * scale, 2.2 * scale); g.globalAlpha = 1;
}
function crown(x, cx, cy, s, fill = "#ffd54a", line = "#7a4a00") {
  x.beginPath(); x.moveTo(cx - 8 * s, cy + 5 * s); x.lineTo(cx - 9 * s, cy - 5 * s); x.lineTo(cx - 4 * s, cy);
  x.lineTo(cx, cy - 7 * s); x.lineTo(cx + 4 * s, cy); x.lineTo(cx + 9 * s, cy - 5 * s); x.lineTo(cx + 8 * s, cy + 5 * s); x.closePath();
  x.fillStyle = linear(x, 0, cy - 7 * s, 0, cy + 5 * s, [[0, "#fffadc"], [0.5, fill], [1, shade(fill, -0.35)]]); x.fill();
  x.lineWidth = 0.9 * s; x.strokeStyle = line; x.lineJoin = "round"; x.stroke();
  x.fillStyle = "#e0284a"; x.beginPath(); x.arc(cx, cy + 1.4 * s, 1.5 * s, 0, TAU); x.fill();
}
function pills(st, b) {
  const left = sprite("pill:" + META.tableLabel + META.stake, 150, 14, 2, (x) => {
    const s = `MESA ${META.tableLabel}  ·  ${META.stake}`;
    x.font = MONT(9); const w = Math.min(150, x.measureText(s).width + 14);
    roundRect(x, 0, 0, w, 14, 7); x.fillStyle = "rgba(10,8,34,0.75)"; x.fill();

// Una caja de frente, con el borde de arriba un poco visto desde arriba. (cx, by) es el centro
// de su base. `p` (0-1) es la tapa: bisagra detrás, que sube y se echa hacia atrás. `mid` pinta
// algo entre el fondo y el frente de la caja (la luz y la placa que sube).
function paintBox(x, cx, by, w, fh, d, lidL, o, mid) {
  const p = clamp(o.p || 0, 0, 1), th = p * 1.95;
  const yt = by - fh, yb = yt - d, wb = w * 0.86, L = cx - w / 2, R = cx + w / 2;
  const rim = Math.max(1.2, w * 0.035), gl = o.glow || 0, gc = o.gc || "#ffe9a0";
  const cs = Math.cos(th), sn = Math.sin(th), fy = yb + d * cs - lidL * sn, fw = lerp(w, wb * 1.05, sn);
  // Sombra en el suelo.
  x.fillStyle = radial(x, cx, by + 1, 1, w * 0.62, [[0, "rgba(0,0,0,0.5)"], [1, "rgba(0,0,0,0)"]]);
  x.save(); x.translate(cx, by + 1); x.scale(1, 0.16); x.translate(-cx, -by - 1); x.fillRect(cx - w * 0.7, by - w * 0.7, w * 1.4, w * 1.4); x.restore();
  // Interior de terciopelo.
  if (p > 0) {
    x.save(); poly(x, [[L + rim, yt], [R - rim, yt], [cx + wb / 2 - rim, yb], [cx - wb / 2 + rim, yb]]); x.clip();
    x.fillStyle = linear(x, 0, yb, 0, yt, [[0, "#12020a"], [1, "#52102c"]]); x.fillRect(L, yb, w, d);
    if (gl > 0) {
      x.globalCompositeOperation = "lighter";
      x.fillStyle = radial(x, cx, (yt + yb) / 2, 0, w * 0.55, [[0, rgba(gc, Math.min(1, 0.95 * gl))], [0.5, rgba(gc, 0.45 * gl)], [1, rgba(gc, 0)]]);
      x.fillRect(L, yb - d, w, d * 3);
    }
    x.restore();
  }
  // Tapa (o su cara de dentro, ya echada hacia atrás).
  const lidPts = [[cx - wb / 2, yb], [cx + wb / 2, yb], [cx + fw / 2, fy], [cx - fw / 2, fy]];
  poly(x, lidPts);
  if (th < 1.5) {
    x.fillStyle = linear(x, 0, Math.min(yb, fy), 0, Math.max(yb, fy), [[0, "#a2122a"], [0.5, "#e02a46"], [1, "#ff5a70"]]);
  } else {
    x.fillStyle = linear(x, 0, fy, 0, yb, [[0, "#6a1236"], [1, "#2a0618"]]);
  }
  x.fill();
  x.lineWidth = Math.max(0.8, w * 0.02); x.strokeStyle = "#e0a820"; x.lineJoin = "round"; x.stroke();
  if (th >= 1.5) {   // forro de la tapa con su ribete dorado
    poly(x, [[cx - fw / 2 + 3, fy + 2], [cx + fw / 2 - 3, fy + 2], [cx + wb / 2 - 3, yb - 2], [cx - wb / 2 + 3, yb - 2]]);
    x.lineWidth = Math.max(0.5, w * 0.008); x.strokeStyle = "rgba(255,214,90,0.55)"; x.stroke();
  } else {
    x.fillStyle = "rgba(255,255,255,0.16)"; poly(x, [[cx - wb / 2 + 2, yb + 1], [cx - wb * 0.1, yb + 1], [cx - fw * 0.2, fy - 1], [cx - fw / 2 + 2, fy - 1]]); x.fill();
  }
  if (mid) mid();
  // Frente.
  const r = Math.max(1.5, w * 0.04);
  roundRect(x, L, yt, w, fh, r);
  x.fillStyle = linear(x, 0, yt, 0, by, [[0, "#f4405a"], [0.18, "#d81f3a"], [0.6, "#a30f27"], [1, "#6a0818"]]); x.fill();
  x.save(); roundRect(x, L, yt, w, fh, r); x.clip();
  x.fillStyle = linear(x, L, 0, R, 0, [[0, "rgba(0,0,0,0.38)"], [0.14, "rgba(0,0,0,0)"], [0.86, "rgba(0,0,0,0)"], [1, "rgba(0,0,0,0.45)"]]); x.fillRect(L, yt, w, fh);
  x.fillStyle = "rgba(255,255,255,0.2)"; poly(x, [[L + w * 0.06, yt], [L + w * 0.3, yt], [L + w * 0.12, by], [L - w * 0.04, by]]); x.fill();
  const lh = fh * 0.3, closed = p < 0.12;
  if (closed) {   // banda de la tapa y su costura
    x.fillStyle = linear(x, 0, yt, 0, yt + lh, [[0, "rgba(255,120,140,0.5)"], [1, "rgba(255,255,255,0.04)"]]); x.fillRect(L, yt, w, lh);
    x.fillStyle = "rgba(40,0,10,0.65)"; x.fillRect(L, yt + lh, w, Math.max(0.8, fh * 0.035));
    x.fillStyle = "rgba(255,170,180,0.4)"; x.fillRect(L, yt + lh + fh * 0.035, w, Math.max(0.5, fh * 0.015));
  }
  // Tiras de latón y remaches.
  for (const k of [-1, 1]) {
    const sx = cx + k * w * 0.34 - w * 0.03;
    x.fillStyle = linear(x, sx, 0, sx + w * 0.06, 0, [[0, "#a8680a"], [0.4, "#ffe27a"], [1, "#b8780e"]]); x.fillRect(sx, yt, w * 0.06, fh);
    x.fillStyle = "#fff2b0"; const rr = Math.max(0.7, w * 0.012);
    for (const yy of [yt + fh * 0.18, yt + fh * 0.82]) { x.beginPath(); x.arc(sx + w * 0.03, yy, rr, 0, TAU); x.fill(); }
  }
  // Placa dorada con el número.
  const bh = (fh - lh) * 0.72, bw = Math.max(bh * 1.55, w * 0.34), bcy = yt + lh + (fh - lh) * 0.5;
  if (o.n) {
    blur(x, "rgba(0,0,0,0.5)", Math.max(1, w * 0.02), 1);
    roundRect(x, cx - bw / 2, bcy - bh / 2, bw, bh, bh * 0.28); x.fillStyle = linear(x, 0, bcy - bh / 2, 0, bcy + bh / 2, [[0, "#fff6c0"], [0.5, "#ffc82a"], [1, "#b8700c"]]); x.fill();
    noBlur(x);
    x.lineWidth = Math.max(0.6, w * 0.012); x.strokeStyle = "#6a3c00"; x.stroke();
    roundRect(x, cx - bw / 2 + bh * 0.1, bcy - bh / 2 + bh * 0.1, bw - bh * 0.2, bh * 0.8, bh * 0.2);
    x.lineWidth = Math.max(0.4, w * 0.007); x.strokeStyle = "rgba(255,255,255,0.7)"; x.stroke();
    text(x, String(o.n), cx, bcy + bh * 0.06, { font: LUCK(bh * 0.76), fill: "#4a2300", drop: "rgba(255,248,200,0.55)" });
  }
  x.restore();
  // Esquinas de latón y ribete de arriba.
  const c = w * 0.11;
  for (const [ex, ey, sx2, sy2] of [[L, yt, 1, 1], [R, yt, -1, 1], [L, by, 1, -1], [R, by, -1, -1]]) {
    poly(x, [[ex, ey], [ex + sx2 * c, ey], [ex + sx2 * c * 0.45, ey + sy2 * c * 0.45], [ex, ey + sy2 * c]]);
    x.fillStyle = linear(x, ex, ey, ex + sx2 * c, ey + sy2 * c, [[0, "#fff2b0"], [1, "#a8680a"]]); x.fill();
    x.lineWidth = 0.5; x.strokeStyle = "#5a3200"; x.stroke();
  }
  x.fillStyle = linear(x, 0, yt - 0.5, 0, yt + fh * 0.07, [[0, "#fff2b0"], [1, "#b8780e"]]);
  x.fillRect(L, yt - Math.max(0.6, fh * 0.015), w, Math.max(1.2, fh * 0.055));
  if (closed) {   // lacre de cera en la costura
    const sy = yt + lh, sr = Math.max(2.2, fh * 0.1);
    x.fillStyle = radial(x, cx - sr * 0.3, sy - sr * 0.3, 0, sr * 1.3, [[0, "#ff8a8a"], [0.5, "#c8142c"], [1, "#6a0614"]]);
    x.beginPath(); x.arc(cx, sy, sr, 0, TAU); x.fill();
    x.lineWidth = Math.max(0.5, sr * 0.2); x.strokeStyle = "#e8b030"; x.stroke();
  }
  // Fugas de luz por la costura cuando aún está cerrada.
  if (gl > 0 && p < 0.05) {
    x.save(); x.globalCompositeOperation = "lighter";
    const lc = rgba(gc, 0.95 * gl);
    x.fillStyle = lc; x.fillRect(L + w * 0.04, yt - 0.5, w * 0.92, Math.max(1, fh * 0.035));
    x.fillStyle = linear(x, 0, yt, 0, yt - d * 1.8, [[0, rgba(gc, 0.5 * gl)], [1, rgba(gc, 0)]]);
    poly(x, [[L + w * 0.05, yt], [R - w * 0.05, yt], [R + w * 0.1, yt - d * 1.8], [L - w * 0.1, yt - d * 1.8]]); x.fill();
    x.restore();
  }
}

const BOX = { w: 52, fh: 30, d: 8, lid: 7, cw: 56, ch: 42, by: 38 };   // casilla de la rejilla

const ROWS = [6, 6, 5, 5];
function gridPos(i) {

    const fall = (1 - ei) * (o.id === "a" ? -190 : -240);
    const isMine = o.id === mine, d = o.d, k = TIER[d.tier] || TIER.cero;
    const lid = d.lid || 0, rise = d.rise || 0;
    g.save(); g.globalAlpha = clamp(intro * 2.5, 0, 1);
    g.translate(o.x + (isMine ? sh[0] : 0), BY - 4 + o.dy + fall + (isMine ? sh[1] : 0)); g.scale(o.s, o.s);
    if (isMine && glow > 0) {
      g.save(); g.globalCompositeOperation = "lighter";
      g.fillStyle = radial(g, 0, -40, 10, 120, [[0, `rgba(255,226,130,${0.55 * glow})`], [1, "rgba(255,226,130,0)"]]); g.fillRect(-130, -170, 260, 220); g.restore();
    }
    paintBox(g, 0, 0, 122, 64, 22, 42, { n: d.n, p: lid, glow: Math.max(isMine ? glow * (lid < 0.05 ? 1 : 0.6) : 0, lid * 0.9), gc: lid > 0.2 ? k.glow : "#fff0b8" }, () => {
      if (lid > 0) {
        rays(g, 0, -64 - 11, 150, d.tier === "gordo" ? 9 : 6, t * 0.03, 0.1, d.tier === "gordo" ? "#ffe27a" : k.glow, (d.tier === "gordo" ? 0.6 : 0.4) * lid);
        if (rise > 0) {
          const er = easeOut(rise); g.save(); g.translate(0, lerp(-30, -64 - 22 - 26, er)); g.scale(lerp(0.6, 1, er), lerp(0.6, 1, er)); g.globalAlpha = clamp(rise * 3, 0, 1);
          blit(finalPlate(d.tier, d.v), -54, -21); g.restore();
        }
      }
    });
    if (o.id === (mine === "b" && swap >= 0.5 ? "b" : "a")) blit(placard(84, 18), -42, 9, 0.9 + 0.1 * Math.sin(t * 0.6));
    g.restore();
  }
  drawLadder(b.ladder, t);
}

// -- Encima de todo ---------------------------------------------------------------------------

function drawBanner(b, cy, cx = 320) {
  if (!b || !(b.a > 0)) return;
  const K = BANNER[b.kind] || BANNER.info, a = clamp(b.a, 0, 1), t = b.t || 0;
  const sc = 0.5 + 0.5 * backOut(a);
  g.save(); g.globalAlpha = clamp(a * 2.2, 0, 1); g.translate(cx, cy); g.scale(sc, sc);
  if (b.kind === "gordo" || b.kind === "deal") rays(g, 0, 0, 330, b.kind === "gordo" ? 16 : 10, (b.tt || 0) * 0.04 + a, 0.07, "#ffd54a", b.kind === "gordo" ? 0.75 : 0.45);
  const f = fit(g, b.text, LUCK, 46, 520);
  g.save(); blur(g, rgba(K.t[1], 0.9), 14);
  text(g, b.text, 0, -10, { font: LUCK(f), fill: K.line, stroke: K.line, width: 14 });
  g.restore();
  text(g, b.text, 0, -10, { font: LUCK(f), fill: "#000", stroke: K.edge, width: 10 });
  text(g, b.text, 0, -10, { font: LUCK(f), fill: "#000", stroke: K.line, width: 7 });
  text(g, b.text, 0, -10, { font: LUCK(f), fill: linear(g, 0, -10 - f * 0.5, 0, -10 + f * 0.5, [[0, K.t[0]], [0.5, K.t[1]], [1, K.t[2]]]) });
  if (b.sub) {
    g.font = MONT(15); const w = Math.min(470, g.measureText(b.sub).width + 54), h = 24, y0 = f * 0.5 + 2;
    g.save();
    blur(g, "rgba(0,0,0,0.5)", 4, 2);
    g.beginPath(); g.moveTo(-w / 2, y0); g.lineTo(w / 2, y0); g.lineTo(w / 2 + 9, y0 + h / 2); g.lineTo(w / 2, y0 + h); g.lineTo(-w / 2, y0 + h); g.lineTo(-w / 2 - 9, y0 + h / 2); g.closePath();
    g.fillStyle = linear(g, 0, y0, 0, y0 + h, [[0, K.rib[0]], [1, K.rib[1]]]); g.fill(); noBlur(g);
    g.lineWidth = 1.6; g.strokeStyle = K.edge; g.stroke();
    g.fillStyle = "rgba(255,255,255,0.2)"; g.fillRect(-w / 2 + 2, y0 + 1.5, w - 4, h * 0.38);
    g.restore();
    const f2 = fit(g, b.sub, MONT, 15, 450);
    text(g, b.sub, 0, y0 + h / 2 + 0.5, { font: MONT(f2), fill: "#fff", stroke: "rgba(0,0,0,0.4)", width: 2.5 });
  }
  if (b.kind === "gordo" || b.kind === "deal" || b.kind === "good") {
    const r = rng(b.kind.length * 13);
    for (let i = 0; i < 12; i++) {
      const an = r() * TAU, rr = 60 + r() * 200, ph = r() * 6;
      g.globalAlpha = clamp(a * (0.5 + 0.5 * Math.sin(t * 0.6 + ph)), 0, 1);
      sparkle(g, Math.cos(an) * rr * 1.3, Math.sin(an) * rr * 0.34, 2 + r() * 2.2, "rgba(255,246,190,1)");
    }
  }
  g.restore();
}

const BANNER_Y = { wheel: 296, open: 300, call: 300, final: 304, board: 180 };
function paintFrame(st) {
  // Todo lo que un dibujo deja cambiado (unión de líneas, guiones…) se deshace al acabar el fotograma.
  g.save(); g.setTransform(S, 0, 0, S, 0, 0); g.globalAlpha = 1; g.globalCompositeOperation = "source-over"; noBlur(g);
  const view = st.view;
  if (view === "wheel") paintWheel(st);
  else if (view === "open") paintOpen(st);
  else if (view === "call") paintCall(st);
  else if (view === "final") paintFinal(st);
  else paintBoard(st);
  if (st.flash) { const [r, gg, b, a] = st.flash; g.fillStyle = `rgba(${r},${gg},${b},${a})`; g.fillRect(0, 0, W, H); }
  if (st.banner) drawBanner({ ...st.banner, t: st.t || 0, tt: st.t || 0 }, BANNER_Y[view] ?? 180, view === "call" || view === "final" ? 215 : 320);
  if (st.fade) { g.fillStyle = `rgba(0,0,0,${clamp(st.fade, 0, 1)})`; g.fillRect(0, 0, W, H); }
  g.restore();
}

function snapshot() {
  octx.setTransform(1, 0, 0, 1, 0, 0);
  octx.imageSmoothingEnabled = true; octx.imageSmoothingQuality = "high";
  octx.drawImage(big, 0, 0, W * S, H * S, 0, 0, W, H);
  return { x: 0, y: 0, u: window.exportFrame(out) };
}

// En Chromium cada recuadro va como data URL de PNG; el pintor de Node
// (assets/escena_node.cjs) pone su exportFrame, que devuelve los píxeles tal cual.
window.exportFrame ??= (canvas) => canvas.toDataURL("image/png");
window.loadFonts = async () => {
  await Promise.all([document.fonts.load("30px Luckiest"), document.fonts.load("700 12px Montserrat")]);
  await document.fonts.ready;
  return true;
};
window.setup = async (meta) => {
  const key = JSON.stringify(meta);
  if (!META || JSON.stringify(META) !== key) SPRITES.clear();
  META = meta; DUST = null;
  return true;
};
window.renderFrames = (states, first = 0) => states.map((st) => { paintFrame(st); return snapshot(); });
</script>
