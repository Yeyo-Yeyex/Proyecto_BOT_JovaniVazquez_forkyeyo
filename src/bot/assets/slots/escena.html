<!doctype html>
<!--
Escena de la tragaperras clásica, dibujada con canvas. La pinta Node con Skia
(assets/escena_node.cjs) y, si no hay Node, un Chromium sin ventana (ver
bot/services/slots_scene.py).

No decide nada: Python le pasa, fotograma a fotograma, dónde está cada rodillo, las luces,
el marcador, los carteles y el doble o nada. Aquí solo se pinta. Funciones que llama Python:

- loadFonts()                espera a las fuentes (canvas no las carga solo).
- setup(meta)                {strips: [3 cadenas], symbols: {clave: data URL de un PNG de
                             200x200}, symbolsKey}. Carga los símbolos solo si cambia
                             symbolsKey y prepara una vez los sprites y el fondo.
- renderFrames(states, first) dibuja los fotogramas y devuelve, de cada uno, el recuadro que
                             ha cambiado (PNG en Chromium, píxeles crudos en Node) y dónde va.

Un estado es (ver `_base`, `_celebration` y `double_states` en slots_scene.py):
  reels[3]   posición de la tira (float): la celda de la línea es strip[floor(p)] y la fila r
             (0 arriba, 1 la línea, 2 abajo) muestra strip[(floor(p) + r - 1) mod n].
  blur[3]    desenfoque vertical por velocidad, 0..1.
  flash[3]   destello de la ventana al tocar fondo, 0..1.
  bulbs      {shape: round|diamond|star|burst, lit: [12 colores o null]}, la 0 abajo.
  glow, glowColor   aura del tercer rodillo (anticipación).
  dim        oscurece la máquina menos el tercer rodillo y las casillas de `hits`.
  line       marco dorado de la fila de pago, 0..1.
  hits, pulse   casillas [rodillo, fila] que se iluminan y su intensidad.
  banner     null o {tier: big|mega|epic, scale, spin, flash}.
  meter      null o {text, fit, glow}: el marcador del premio.
  coins      [[x, y, fase 0..3, alfa]]       sparkles   [[x, y, intensidad]]
  gamble     null o el doble o nada (ver `_gamble`).       ms   (lo ignora la escena)

Se dibuja al doble de tamaño (S = 2) y se reduce al copiar. El recuadro que cambia se calcula
comparando con el fotograma anterior, así que montar los recuadros da exactamente lo mismo
que pintar cada fotograma entero. Todo lo fijo (mueble, marcos, sprites de símbolos nítidos y
desenfocados, luces, cartas) se pinta una vez; cada fotograma solo compone. Nada de
Math.random y nada de emojis: el Chromium del Docker no trae su fuente, los palos son trazados.
-->
<html lang="es">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: "Luckiest"; src: url("../botes/fonts/luckiest-guy.woff"); }
  @font-face { font-family: "Montserrat"; src: url("../memes/fonts/MontserratBold.ttf"); font-weight: 700; }
  html, body { margin: 0; padding: 0; background: transparent; }
</style>
</head>
<body>
<script>
"use strict";
const S = 2;
// Estas medidas salen de bot/services/slots_scene.py: si cambian allí, cambian aquí.
const W = 544, H = 412;
const CELL_W = 128, CELL_H = 116, SYMBOL = 100, GAP = 16, MARGIN = 32, SIDE = 32, LEFT = 64, BULBS = 12;
const WIN_H = CELL_H * 3;
const EPIC_RAYS = 18;
const TAU = Math.PI * 2;
const WX = [0, 1, 2].map((i) => LEFT + i * (CELL_W + GAP));     // x de cada ventana
const BULB_X = [24, W - 24];                                    // centro de cada columna de luces
const BULB_PITCH = (H - 48) / BULBS;
const bulbY = (k) => H - 24 - (k + 0.5) * BULB_PITCH;           // la 0 es la de abajo
const ARROW_X = [49, W - 49], ARROW_Y = MARGIN + CELL_H * 1.5;
const LINE_BOX = [62, 150, 420, 112];                           // marco de la fila de pago
const METER_BOX = [58, 274, 428, 112];
const GP = { x: 47, y: 27, w: 450, h: 358 };                    // el panel del doble o nada
const GCX = GP.x + GP.w / 2;

const big = document.createElement("canvas"); big.width = W * S; big.height = H * S;
const out = document.createElement("canvas"); out.width = W; out.height = H;
const half = document.createElement("canvas"); half.width = W; half.height = H;   // paso intermedio
const crop = document.createElement("canvas");
const bctx = big.getContext("2d");
const octx = out.getContext("2d", { willReadFrequently: true });
const hctx = half.getContext("2d");
const cctx = crop.getContext("2d");

let META = { strips: ["", "", ""] };
let SYMBOLS_KEY = null;     // con qué symbolsKey se hicieron los sprites
let SPR = {};               // clave de símbolo -> [nítido, desenfoque 1, desenfoque 2]
let BG = null, FG = null, ARROW = null, ARROW_LIT = null, LINE = null, METER = null, GAMBLE_BG = null;
let COINS = null;           // las cuatro fases de la moneda
let PREV = null;            // píxeles del fotograma anterior (Uint32Array)
let TEMP = null;            // lienzo de apoyo (solo el fundido del doble o nada)
const CACHE = new Map();    // luces y auras: se hacen la primera vez que se piden

// -- Utilidades ---------------------------------------------------------------------------------

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
function rrPath(g, x, y, w, h, r) {
  g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
}
function roundRect(g, x, y, w, h, r) { g.beginPath(); rrPath(g, x, y, w, h, r); }
function spaced(g, px) { if ("letterSpacing" in g) g.letterSpacing = px + "px"; }
function hexRgb(h) { const n = parseInt(h.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
function rgba(h, a) { const [r, g, b] = hexRgb(h); return `rgba(${r},${g},${b},${a})`; }
function mix(a, b, t) {
  const A = hexRgb(a), B = hexRgb(b);
  return "#" + A.map((v, i) => Math.round(lerp(v, B[i], t)).toString(16).padStart(2, "0")).join("");
}
function lin(g, x0, y0, x1, y1, stops) {
  const gr = g.createLinearGradient(x0, y0, x1, y1);
  for (const [o, c] of stops) gr.addColorStop(o, c);
  return gr;
}
function rad(g, x0, y0, r0, x1, y1, r1, stops) {
  const gr = g.createRadialGradient(x0, y0, r0, x1, y1, r1);
  for (const [o, c] of stops) gr.addColorStop(o, c);
  return gr;
}
// Un lienzo de `w` x `h` unidades lógicas, ya a escala S.
function layer(w, h) {
  const c = document.createElement("canvas");
  c.width = Math.ceil(w * S); c.height = Math.ceil(h * S);
  const g = c.getContext("2d"); g.scale(S, S);
  return { c, g, w, h };
}
// Node y Chromium no ponen igual el textBaseline "middle", así que el texto va sobre la línea base y
// `y` es el centro de las mayúsculas: con la altura de la H se calcula dónde queda la línea base.
function capMid(g, y) { return y + g.measureText("H").actualBoundingBoxAscent / 2; }
function fillMid(g, text, x, y) { g.save(); g.textBaseline = "alphabetic"; g.fillText(text, x, capMid(g, y)); g.restore(); }
// Texto con contorno (el contorno va debajo del relleno), centrado en `y` como arriba.
function inked(g, text, x, y, fill, width, stroke) {
  g.save(); g.textBaseline = "alphabetic"; y = capMid(g, y);
  g.lineJoin = "round"; g.miterLimit = 2; g.lineWidth = width; g.strokeStyle = stroke;
  g.strokeText(text, x, y); g.fillStyle = fill; g.fillText(text, x, y); g.restore();
}
// Reduce la letra hasta que el texto cabe en `maxW`.
function fitFont(g, text, maxW, size, family, weight = "") {
  for (; size > 10; size -= 1) { g.font = `${weight}${size}px ${family}`; if (g.measureText(text).width <= maxW) break; }
  return size;
}

// -- Palos y cartas (los trazados del blackjack: S 0 picas, H 1 corazones, D 2 diamantes, C 3 tréboles)

const SUIT_INDEX = { S: 0, H: 1, D: 2, C: 3 };
function suitPath(g, suit) {
  g.beginPath();
  if (suit === 2) {                                    // diamantes
    g.moveTo(0, -0.5); g.quadraticCurveTo(0.12, -0.2, 0.37, 0); g.quadraticCurveTo(0.12, 0.2, 0, 0.5);
    g.quadraticCurveTo(-0.12, 0.2, -0.37, 0); g.quadraticCurveTo(-0.12, -0.2, 0, -0.5);
  } else if (suit === 1) {                             // corazones
    g.moveTo(0, 0.5);
    g.bezierCurveTo(-0.15, 0.35, -0.5, 0.12, -0.5, -0.15);
    g.bezierCurveTo(-0.5, -0.38, -0.32, -0.5, -0.17, -0.5);
    g.bezierCurveTo(-0.07, -0.5, 0, -0.43, 0, -0.32);
    g.bezierCurveTo(0, -0.43, 0.07, -0.5, 0.17, -0.5);
    g.bezierCurveTo(0.32, -0.5, 0.5, -0.38, 0.5, -0.15);
    g.bezierCurveTo(0.5, 0.12, 0.15, 0.35, 0, 0.5);
  } else if (suit === 0) {                             // picas: corazón del revés con tallo
    g.moveTo(0, -0.5);
    g.bezierCurveTo(0.12, -0.3, 0.5, -0.08, 0.5, 0.14);
    g.bezierCurveTo(0.5, 0.34, 0.34, 0.42, 0.2, 0.42);
    g.bezierCurveTo(0.1, 0.42, 0.03, 0.37, 0.03, 0.28);
    g.bezierCurveTo(0.03, 0.38, 0.1, 0.47, 0.24, 0.5);
    g.lineTo(-0.24, 0.5);
    g.bezierCurveTo(-0.1, 0.47, -0.03, 0.38, -0.03, 0.28);
    g.bezierCurveTo(-0.03, 0.37, -0.1, 0.42, -0.2, 0.42);
    g.bezierCurveTo(-0.34, 0.42, -0.5, 0.34, -0.5, 0.14);
    g.bezierCurveTo(-0.5, -0.08, -0.12, -0.3, 0, -0.5);
  } else {                                             // tréboles: tres bolas y tallo
    for (const [bx, by] of [[0, -0.27], [-0.27, 0.1], [0.27, 0.1]]) { g.moveTo(bx + 0.23, by); g.arc(bx, by, 0.23, 0, TAU); }
    g.moveTo(-0.04, 0.05); g.bezierCurveTo(-0.02, 0.3, -0.1, 0.42, -0.2, 0.5);
    g.lineTo(0.2, 0.5); g.bezierCurveTo(0.1, 0.42, 0.02, 0.3, 0.04, 0.05); g.closePath();
    g.moveTo(-0.15, -0.05); g.lineTo(0.15, -0.05); g.lineTo(0, 0.12); g.closePath();
  }
}
function drawSuit(g, suit, x, y, size, color, flipped = false) {
  g.save(); g.translate(x, y); if (flipped) g.rotate(Math.PI); g.scale(size, size);
  g.fillStyle = color; suitPath(g, suit); g.fill(); g.restore();
}
const suitColor = (suit) => (suit === 1 || suit === 2 ? "#c8232f" : "#1a1c22");

const CARD_W = 80, CARD_H = 112, CARD_ZOOM = 1.05, CARD_Y = 194;
const CARDS = new Map();

function crown(g) {                                    // la corona del dorso, centrada en (0, 0)
  g.save();
  const grad = g.createLinearGradient(0, -14, 0, 2); grad.addColorStop(0, "#ffe27a"); grad.addColorStop(1, "#c8901c");
  g.lineJoin = "round"; g.lineWidth = 1; g.strokeStyle = "#7a5206";
  g.beginPath(); g.moveTo(-11, 1); g.lineTo(-12.5, -10); g.lineTo(-6, -4.5); g.lineTo(0, -13);
  g.lineTo(6, -4.5); g.lineTo(12.5, -10); g.lineTo(11, 1); g.closePath();
  g.fillStyle = grad; g.fill(); g.stroke();
  g.fillStyle = "#c8232f";
  for (const jx of [-6, 0, 6]) { g.beginPath(); g.arc(jx, -2.4, 1.5, 0, TAU); g.fill(); }
  g.fillStyle = "#fff6c4";
  for (const [tx, ty] of [[-12.5, -10], [0, -13], [12.5, -10]]) { g.beginPath(); g.arc(tx, ty, 1.5, 0, TAU); g.fill(); g.stroke(); }
  g.fillStyle = "#c8901c"; g.fillRect(-0.7, -19, 1.4, 5); g.fillRect(-2.2, -17.5, 4.4, 1.4);
  g.restore();
}

// La cara: un palo grande y los índices de las esquinas.
function faceSprite(suit) {
  const key = "face" + suit;
  if (CARDS.has(key)) return CARDS.get(key);
  const { c, g } = layer(CARD_W, CARD_H);
  const color = suitColor(suit);
  roundRect(g, 0.5, 0.5, CARD_W - 1, CARD_H - 1, 7);
  g.fillStyle = lin(g, 0, 0, CARD_W, CARD_H, [[0, "#ffffff"], [1, "#ece8dd"]]); g.fill();
  g.strokeStyle = "#9d998b"; g.lineWidth = 1; g.stroke();
  roundRect(g, 2, 2, CARD_W - 4, CARD_H - 4, 5.5);
  g.strokeStyle = "rgba(255,255,255,0.9)"; g.lineWidth = 0.8; g.stroke();
  const corner = () => { drawSuit(g, suit, 11, 17, 11, color); };
  corner();
  g.save(); g.translate(CARD_W, CARD_H); g.rotate(Math.PI); corner(); g.restore();
  g.beginPath(); g.arc(CARD_W / 2, CARD_H / 2, 31, 0, TAU);
  g.strokeStyle = suit === 1 || suit === 2 ? "rgba(200,35,47,0.22)" : "rgba(26,28,34,0.2)"; g.lineWidth = 0.9; g.stroke();
  g.save(); g.shadowColor = "rgba(0,0,0,0.28)"; g.shadowBlur = 4 * S; g.shadowOffsetY = 1.4 * S;
  drawSuit(g, suit, CARD_W / 2, CARD_H / 2 + 1, suit === 0 ? 54 : 46, color); g.restore();
  CARDS.set(key, c);
  return c;
}

// El dorso: rejilla dorada sobre rojo, con el medallón de la casa.
function backSprite() {
  if (CARDS.has("back")) return CARDS.get("back");
  const { c, g } = layer(CARD_W, CARD_H);
  roundRect(g, 0.5, 0.5, CARD_W - 1, CARD_H - 1, 7); g.fillStyle = "#f4f1e8"; g.fill();
  g.strokeStyle = "#9d998b"; g.lineWidth = 1; g.stroke();
  const x = 4.5, y = 4.5, w = CARD_W - 9, h = CARD_H - 9;
  roundRect(g, x, y, w, h, 4.5);
  g.fillStyle = lin(g, 0, 0, CARD_W, CARD_H, [[0, "#c4222f"], [0.55, "#8e1220"], [1, "#4a0710"]]); g.fill();
  g.save(); roundRect(g, x, y, w, h, 4.5); g.clip();
  g.strokeStyle = "rgba(255,206,100,0.38)"; g.lineWidth = 0.8;
  for (let k = -CARD_H; k < CARD_W + CARD_H; k += 9) {
    g.beginPath(); g.moveTo(k, 0); g.lineTo(k + CARD_H, CARD_H); g.stroke();
    g.beginPath(); g.moveTo(k + CARD_H, 0); g.lineTo(k, CARD_H); g.stroke();
  }
  g.restore();
  roundRect(g, x + 3.5, y + 3.5, w - 7, h - 7, 3);
  g.strokeStyle = "rgba(255,214,110,0.85)"; g.lineWidth = 1.1; g.stroke();
  g.save(); g.translate(CARD_W / 2, CARD_H / 2);
  g.fillStyle = rad(g, 0, -4, 2, 0, 0, 23, [[0, "#b52432"], [1, "#4a0710"]]);
  g.beginPath(); g.arc(0, 0, 22, 0, TAU); g.fill();
  g.strokeStyle = "#f3c64f"; g.lineWidth = 1.8; g.stroke();
  g.beginPath(); g.arc(0, 0, 18.4, 0, TAU); g.lineWidth = 0.7; g.stroke();
  g.fillStyle = "#f3c64f";
  for (let k = 0; k < 16; k++) { const a = k * Math.PI / 8; g.beginPath(); g.arc(Math.cos(a) * 20.2, Math.sin(a) * 20.2, 0.7, 0, TAU); g.fill(); }
  g.save(); g.translate(0, -5.5); g.scale(0.75, 0.75); crown(g); g.restore();
  g.font = "15px Luckiest"; g.textAlign = "center"; g.textBaseline = "alphabetic";
  inked(g, "PS", 0, 12.5 - g.measureText("H").actualBoundingBoxAscent / 2, "#ffd75e", 2.2, "#4a0710");
  g.restore();
  g.fillStyle = "rgba(255,214,110,0.9)";
  for (const [qx, qy] of [[13, 13], [CARD_W - 13, 13], [13, CARD_H - 13], [CARD_W - 13, CARD_H - 13]]) {
    g.beginPath(); g.moveTo(qx, qy - 3); g.lineTo(qx + 2.2, qy); g.lineTo(qx, qy + 3); g.lineTo(qx - 2.2, qy); g.closePath(); g.fill();
  }
  CARDS.set("back", c);
  return c;
}
function cardPath(g, inset = 0) {
  roundRect(g, -CARD_W / 2 + inset, -CARD_H / 2 + inset, CARD_W - 2 * inset, CARD_H - 2 * inset, 7 - inset * 0.5);
}

// -- Símbolos: sprites nítidos y desenfocados (una vez) -----------------------------------------

function loadImage(src) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = () => reject(new Error("No se pudo leer un símbolo de la tragaperras"));
    img.src = src;
  });
}
// Tres niveles: nítido (con su sombra suave), desenfoque vertical (velocidad media) y estela de bandas
// (a tope). `blur` de cada rodillo elige: < 0,15 nítido, < 0,55 desenfoque, más estela.
function symbolSprites(img) {
  const PAD = 14, SZ = SYMBOL + 2 * PAD;
  const sharp = layer(SZ, SZ);
  sharp.g.shadowColor = "rgba(0,0,0,0.38)"; sharp.g.shadowBlur = 7 * S; sharp.g.shadowOffsetY = 4 * S;
  sharp.g.drawImage(img, PAD, PAD, SYMBOL, SYMBOL);
  return [sharp, smearSprite(sharp, 14), bandSprite(sharp, 46, 1.7)];
}
// Desenfoque vertical de radio `R` (lógico): el promedio de copias del símbolo movidas un píxel cada una.
function smearSprite(src, R) {
  const o = layer(src.w, src.h + 2 * R), n = 2 * R * S + 1;
  for (let k = 0; k < n; k++) { o.g.globalAlpha = 1 / (k + 1); o.g.drawImage(src.c, 0, k / S, src.w, src.h); }
  return o;
}
// A toda velocidad el rodillo es una estela de color sin forma: cada fila, del mismo color en todo el
// ancho, y desenfocada en vertical con radio `R` (dos pasadas de caja). Con degradados en horizontal
// cada fotograma del GIF costaría el triple. `gain` sube el alfa, que al promediar queda pálido. Se hace
// en setup, una vez, con arrays pequeños: el bucle de píxeles a mano tardaba un segundo por símbolo.
function bandSprite(src, R, gain) {
  const w = src.w, h = src.h, oh = h + 2 * R;
  const lo = document.createElement("canvas"); lo.width = w; lo.height = h;
  const lg = lo.getContext("2d"); lg.drawImage(src.c, 0, 0, w, h);
  const px = lg.getImageData(0, 0, w, h).data;
  const rows = [0, 1, 2, 3].map(() => new Float32Array(oh));    // r, g, b y alfa, con el alfa ya multiplicado
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      const i = (y * w + x) * 4, a = px[i + 3] / 255;
      rows[0][y + R] += px[i] * a; rows[1][y + R] += px[i + 1] * a; rows[2][y + R] += px[i + 2] * a; rows[3][y + R] += a;
    }
  }
  const half = Math.ceil(R / 2), pre = new Float32Array(oh + 1);
  for (const row of rows) {
    for (let pass = 0; pass < 2; pass++) {
      for (let k = 0; k < oh; k++) pre[k + 1] = pre[k] + row[k];
      for (let k = 0; k < oh; k++) row[k] = (pre[Math.min(oh, k + half + 1)] - pre[Math.max(0, k - half)]) / (2 * half + 1);
    }
  }
  const o = layer(w, oh);
  for (let y = 0; y < oh; y++) {
    const a = rows[3][y];
    if (a < 0.002) continue;
    o.g.fillStyle = `rgba(${Math.round(rows[0][y] / a)},${Math.round(rows[1][y] / a)},${Math.round(rows[2][y] / a)},${Math.min(1, a / w * gain).toFixed(4)})`;
    o.g.fillRect(0, y, w, 1);
  }
  return o;
}

// -- Luces: una bombilla por forma y color, con su halo --------------------------------------------

function bulbShape(g, shape) {
  g.beginPath();
  if (shape === "diamond") {
    g.moveTo(0, -12); g.lineTo(9, 0); g.lineTo(0, 12); g.lineTo(-9, 0); g.closePath();
  } else if (shape === "star" || shape === "burst") {
    const n = shape === "star" ? 5 : 8, ro = shape === "star" ? 13 : 12.5, ri = shape === "star" ? 5.6 : 6;
    for (let k = 0; k < n * 2; k++) {
      const a = -Math.PI / 2 + k * Math.PI / n, r = k % 2 ? ri : ro;
      g.lineTo(Math.cos(a) * r, Math.sin(a) * r);
    }
    g.closePath();
  } else g.arc(0, 0, 8.6, 0, TAU);
}
function bulbSprite(shape, color) {
  const key = "bulb" + shape + color;
  if (CACHE.has(key)) return CACHE.get(key);
  const R = 32, o = layer(2 * R, 2 * R), g = o.g;
  g.translate(R, R);
  const hr = shape === "burst" ? 18 : shape === "star" ? 15.5 : 14.5;   // pequeño: cada bombilla que cambia son píxeles de GIF
  g.fillStyle = rad(g, 0, 0, 2, 0, 0, hr, [[0, rgba(color, 0.8)], [0.4, rgba(color, 0.3)], [1, rgba(color, 0)]]);
  g.beginPath(); g.arc(0, 0, hr, 0, TAU); g.fill();
  if (shape === "burst") {                                       // la aureola
    g.beginPath(); g.arc(0, 0, 15.5, 0, TAU);
    g.strokeStyle = rgba(color, 0.75); g.lineWidth = 1.6; g.stroke();
    g.beginPath(); g.arc(0, 0, 18.5, 0, TAU);
    g.strokeStyle = rgba(color, 0.28); g.lineWidth = 1.2; g.stroke();
  }
  bulbShape(g, shape);
  g.fillStyle = rad(g, -2.6, -3.4, 1, 0, 0, 14,
    [[0, "#ffffff"], [0.22, mix(color, "#ffffff", 0.78)], [0.62, color], [1, mix(color, "#000000", 0.5)]]);
  g.fill();
  g.lineJoin = "round"; g.lineWidth = 1.1; g.strokeStyle = rgba(mix(color, "#000000", 0.55), 0.9); g.stroke();

// -- Cada fotograma ---------------------------------------------------------------------------------

function drawSymbol(g, key, cx, cy, level, scale) {
  const spr = SPR[key];
  if (!spr) return;
  const s = spr[level], w = s.w * scale, h = s.h * scale;
  g.drawImage(s.c, cx - w / 2, cy - h / 2, w, h);
}

function drawReel(g, i, st, hits) {
  const x0 = WX[i], strip = META.strips[i], n = strip.length;
  if (!n) return;
  const p = st.reels[i], fl = Math.floor(p), fr = p - fl;
  const level = (st.blur?.[i] ?? 0) < 0.15 ? 0 : st.blur[i] < 0.55 ? 1 : 2;
  const pulse = Math.round(clamp(st.pulse || 0, 0, 1) * 4) / 4;     // a saltos: así el GIF repite más píxeles
  g.save();
  g.beginPath(); g.rect(x0, MARGIN, CELL_W, WIN_H); g.clip();
  const r0 = level ? -1 : 0, r1 = level ? 4 : 3;
  for (let r = r0; r <= r1; r++) {
    const top = MARGIN + (r - fr) * CELL_H;
    if (r >= 0 && r <= 4 && top > MARGIN + 0.5 && top < MARGIN + WIN_H - 0.5) {            // separador entre celdas
      g.fillStyle = "rgba(96,78,40,0.3)"; g.fillRect(x0, top - 0.5, CELL_W, 1);
      g.fillStyle = "rgba(255,255,255,0.55)"; g.fillRect(x0, top + 0.5, CELL_W, 1);
    }
    const key = strip[(((fl + r - 1) % n) + n) % n];
    const cx = x0 + CELL_W / 2, cy = top + CELL_H / 2;
    let scale = 1;
    if (pulse > 0 && hits.has(i * 8 + r)) {                                                  // la casilla que se ilumina
      const a = 0.8 * pulse;
      g.fillStyle = rad(g, cx, cy, 6, cx, cy, 52, [[0, `rgba(255,222,110,${a})`], [0.55, `rgba(255,200,60,${a * 0.4})`], [1, "rgba(255,200,60,0)"]]);
      g.fillRect(cx - 52, cy - 52, 104, 104);
      roundRect(g, x0 + 5, top + 5, CELL_W - 10, CELL_H - 10, 12);
      g.lineWidth = 1.6; g.strokeStyle = `rgba(255,214,70,${0.75 * pulse})`; g.stroke();
      scale = 1 + 0.08 * pulse;
    }
    drawSymbol(g, key, cx, cy, level, scale);
  }
  g.restore();
  g.drawImage(FG.c, x0, MARGIN, CELL_W, WIN_H);
  const f = st.flash?.[i] ?? 0;
  if (f > 0.01) {                                                                            // destello al tocar fondo
    g.save(); g.beginPath(); g.rect(x0, MARGIN, CELL_W, WIN_H); g.clip();
    g.fillStyle = lin(g, 0, MARGIN, 0, MARGIN + WIN_H, [[0, `rgba(255,255,255,${0.22 * f})`], [0.5, `rgba(255,252,235,${0.62 * f})`], [1, `rgba(255,255,255,${0.22 * f})`]]);
    g.fillRect(x0, MARGIN, CELL_W, WIN_H);
    g.restore();
    roundRect(g, x0 - 4.5, MARGIN - 4.5, CELL_W + 9, WIN_H + 9, 8);
    g.lineWidth = 2.4; g.strokeStyle = `rgba(255,255,255,${0.7 * f})`; g.stroke();
  }
}

// Oscurece el mueble menos el tercer rodillo y las casillas del camino del bote.
function drawDim(g, dim, hits) {

  // Lo que se juega, en el centro de abajo.
  const tone = gm.tone, gl = clamp(gm.glow || 0, 0, 1);
  g.save(); g.textAlign = "center"; g.textBaseline = "middle";
  g.font = "700 12px Montserrat"; spaced(g, 4);
  g.fillStyle = tone === "win" ? "#9bffbf" : tone === "lose" ? "#ffa0a0" : "rgba(255,236,190,0.85)";
  fillMid(g, gm.label, GCX + 2, TXT_Y.label); spaced(g, 1);
  const cols = tone === "win" ? [["#f4fff4", "#7dff9e", "#1fbf63"], "#06361a"]
    : tone === "lose" ? [["#fff0f0", "#ff8a8a", "#e03030"], "#3a0408"] : [["#fff8c4", "#ffd848", "#d98e14"], "#4a2a02"];
  const size = fitFont(g, gm.text, 188, 38, "Montserrat", "700 ");
  g.font = `700 ${size}px Montserrat`;
  if (gl > 0.01) { g.shadowColor = `rgba(255,214,90,${gl})`; g.shadowBlur = 20 * S * gl; }
  inked(g, gm.text, GCX, TXT_Y.text + 3, "rgba(0,0,0,0.5)", 7, "rgba(0,0,0,0.5)");
  g.shadowBlur = 0;
  inked(g, gm.text, GCX, TXT_Y.text, lin(g, 0, TXT_Y.text - size * 0.42, 0, TXT_Y.text + size * 0.42, [[0, cols[0][0]], [0.5, cols[0][1]], [1, cols[0][2]]]),
    Math.max(4.5, size * 0.13), cols[1]);
  if (tone === "gold") {
    g.font = "700 15px Montserrat"; spaced(g, 0.5);
    g.fillStyle = "rgba(255,220,130,0.95)"; fillMid(g, `→ ${gm.prize}`, GCX, TXT_Y.prize);
  }
  g.restore();
}
function drawGamble(g, gm) {
  if (!gm) return;
  const mixa = clamp(gm.mix, 0, 1);
  if (!(mixa > 0)) return;
  if (mixa >= 0.999) { drawGambleLayer(g, gm); return; }
  if (!TEMP) { TEMP = layer(W, H); }
  TEMP.g.clearRect(0, 0, W, H);
  drawGambleLayer(TEMP.g, gm);
  g.save(); g.globalAlpha = mixa; g.drawImage(TEMP.c, 0, 0, W, H); g.restore();
}

// -- Un fotograma ------------------------------------------------------------------------------------

function paint(st) {
  const g = bctx;
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.drawImage(BG.c, 0, 0);
  g.save(); g.scale(S, S);
  const hits = new Set();
  for (const [reel, row] of st.hits || []) hits.add(reel * 8 + row);
  for (let i = 0; i < 3; i++) drawReel(g, i, st, hits);
  const line = clamp(st.line || 0, 0, 1);
  if (line > 0.01) {
    const [x, y] = LINE_BOX;
    g.globalAlpha = line; g.drawImage(LINE.c, x - 26, y - 26, LINE.w, LINE.h); g.globalAlpha = 1;
  }
  drawDim(g, st.dim, hits);
  if (st.glow > 0.01) {
    const a = auraSprite(st.glowColor || "#ec382c");
    g.save(); g.beginPath(); g.rect(WX[2] - 40, 0, W, H); g.clip();
    g.globalAlpha = Math.round(clamp(st.glow, 0, 1) * 6) / 6; g.drawImage(a.c, WX[2] - 6 - 34, MARGIN - 6 - 34, a.w, a.h); g.restore();
  }
  drawLights(g, st.bulbs);
  const away = 1 - clamp(st.gamble ? st.gamble.mix : 0, 0, 1);       // las flechas se van con el doble o nada
  if (away > 0.01) {
    g.save(); g.globalAlpha = away;
    ARROW_X.forEach((ax, k) => {
      g.save(); g.translate(ax, ARROW_Y); if (k) g.scale(-1, 1);
      g.drawImage(ARROW.c, -ARROW.w / 2, -ARROW.h / 2, ARROW.w, ARROW.h);
      if (line > 0.01) { g.globalAlpha = away * line; g.drawImage(ARROW_LIT.c, -ARROW.w / 2, -ARROW.h / 2, ARROW.w, ARROW.h); }
      g.restore();
    });
    g.restore();
  }
  drawGamble(g, st.gamble);
  drawMeter(g, st.meter);
  drawBanner(g, st.banner);
  drawCoins(g, st.coins);
  drawSparkles(g, st.sparkles);
  g.restore();
}

// -- Salida: solo el recuadro que cambia ------------------------------------------------------------

// Se pinta a la medida lógica (W × H) al doble y se reduce al tamaño de salida que pide Python
// (`meta.out`, el de `out`): así cambiar lo que pesa el GIF no mueve nada del dibujo. Se reduce
// en dos pasos: a la mitad justa con calidad alta y de ahí a la salida, bilineal. Reducir de una
// vez a menos de la mitad usa mipmaps, y Skia saca distinto el primer fotograma que los demás.
function snapshot(full) {
  const OW = out.width, OH = out.height;
  if (OW === W && OH === H) {
    octx.imageSmoothingEnabled = true; octx.imageSmoothingQuality = "high";
    octx.drawImage(big, 0, 0, OW, OH);
  } else {
    hctx.imageSmoothingEnabled = true; hctx.imageSmoothingQuality = "high";
    hctx.drawImage(big, 0, 0, W, H);
    octx.imageSmoothingEnabled = true; octx.imageSmoothingQuality = "low";
    octx.drawImage(half, 0, 0, OW, OH);
  }
  const cur = new Uint32Array(octx.getImageData(0, 0, OW, OH).data.buffer);
  let x0 = 0, y0 = 0, x1 = OW, y1 = OH;
  if (!full && PREV) {
    x0 = OW; y0 = OH; x1 = 0; y1 = 0;
    for (let y = 0; y < OH; y++) {
      const row = y * OW;
      for (let x = 0; x < OW; x++) {
        if (cur[row + x] !== PREV[row + x]) {
          if (x < x0) x0 = x; if (x >= x1) x1 = x + 1;
          if (y < y0) y0 = y; if (y >= y1) y1 = y + 1;
        }
      }
    }
    if (x1 <= x0) { x0 = 0; y0 = 0; x1 = 1; y1 = 1; }   // nada ha cambiado
  }
  PREV = cur;
  const w = x1 - x0, h = y1 - y0;
  crop.width = w; crop.height = h;
  cctx.drawImage(out, x0, y0, w, h, 0, 0, w, h);
  return { x: x0, y: y0, u: window.exportFrame(crop) };
}

// En Chromium cada recuadro va como data URL de PNG; el pintor de Node
// (assets/escena_node.cjs) pone su exportFrame, que devuelve los píxeles tal cual.
window.exportFrame ??= (canvas) => canvas.toDataURL("image/png");

window.loadFonts = async () => {
  await Promise.all([document.fonts.load("30px Luckiest"), document.fonts.load("700 12px Montserrat")]);
  await document.fonts.ready;
  return true;
};
window.setup = async (meta) => {
  await window.loadFonts();
  META = { strips: meta?.strips || ["", "", ""] };
  PREV = null;
  const [ow, oh] = meta?.out || [W, H];
  if (out.width !== ow || out.height !== oh) { out.width = ow; out.height = oh; }
  if (!BG) buildStatics();
  if (SYMBOLS_KEY === null || SYMBOLS_KEY !== meta?.symbolsKey) {        // los símbolos llegan en cada setup: solo se leen si cambian
    const loaded = {};
    for (const [key, src] of Object.entries(meta?.symbols || {})) loaded[key] = symbolSprites(await loadImage(src));
    SPR = loaded; SYMBOLS_KEY = meta?.symbolsKey ?? "";
  }
  return true;
};
window.renderFrames = (states, first = 0) => states.map((st) => { paint(st); return snapshot(!!st.full); });
</script>
