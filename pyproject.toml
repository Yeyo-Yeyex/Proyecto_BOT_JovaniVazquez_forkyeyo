[project]
name = "bot-jovani-vazquez"
version = "0.1.0"
description = "Bot de Discord con arquitectura modular en Python."
requires-python = ">=3.12"
dependencies = [
    "discord.py>=2.4,<3",
    "python-dotenv>=1.0,<2",
    "yt-dlp>=2024.1",
    "PyNaCl>=1.5,<2",
    "davey>=0.1.6",
    "Pillow>=10.3",
    "numpy>=1.26",
    # Zonas horarias Atlantic/Canary (días de las rachas) y Asia/Hong_Kong
    # (`hongkong`): la imagen python:slim no trae la base de datos del sistema.
    "tzdata>=2024.1",
    # Chromium sin ventana para dibujar las carreras de caballos con canvas y
    # HTML/CSS (`bot.services.horses_scene`). Sin el navegador, se dibuja con Pillow.
    "playwright>=1.48,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
# El código vive en src/, así que se añade al path de importación de pytest; tests/
# también, para los dobles compartidos entre pruebas (`interaction_fakes`).
pythonpath = ["src", "tests"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bot = ["assets/*.mp4", "assets/*.txt", "assets/memes/**/*", "assets/slots/*", "assets/botes/**/*", "assets/caballos/*", "assets/pachinko/*"]
