[project]
name = "bot-jovani-vazquez"
version = "0.1.0"
description = "Bot de Discord con arquitectura modular en Python."
requires-python = ">=3.12"
dependencies = [
    "discord.py>=2.4,<3",
    "python-dotenv>=1.0,<2",
    "yt-dlp>=2024.1",
    "PyNaCl>=1.5,<2",
    "davey>=0.1.6",
    "Pillow>=10.3",
    "numpy>=1.26",
    # Zona horaria Atlantic/Canary para los días de las rachas y la hora feliz:
    # la imagen python:slim no trae la base de datos de zonas del sistema.
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
# El código vive en src/, así que se añade al path de importación de pytest.
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bot = ["assets/*.mp4", "assets/*.txt", "assets/memes/**/*", "assets/slots/*", "assets/botes/*"]
